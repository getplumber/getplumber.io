version: 2
updates:
  # Keep the SHA-pinned actions fresh: Dependabot bumps the pin and the
  # version comment together, so pinning never means "frozen forever".
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      # One PR for routine minor/patch bumps; majors stay individual
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # 10.3+ requires conventional-changelog-writer@9, which
      # @semantic-release/release-notes-generator (<= 14.x) does not ship;
      # bumping it breaks the release job's generateNotes step. Drop this
      # ignore once release-notes-generator depends on writer 9.
      - dependency-name: "conventional-changelog-conventionalcommits"
        versions: [">10.2.1"]

  # Isolated deploy tooling (hash-locked Vercel CLI used by the deploy jobs)
  - package-ecosystem: "npm"
    directory: "/.github/vercel"
    schedule:
      interval: "weekly"
