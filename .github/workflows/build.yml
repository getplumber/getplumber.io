name: Build

# Secret-less production build check: runs on every PR — including Dependabot's,
# which skip the Deploy Preview workflow (bot-triggered runs get no repository
# secrets) and would otherwise merge dependency bumps without a build check.
on: # yamllint disable-line rule:truthy
  push:
    branches: [main]
  pull_request: null

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Astro Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build
