name: Plumber
on:
  push:
    branches: [main]   # scope to the default branch so a PR push isn't scanned twice
  pull_request: null

permissions:
  contents: read

concurrency:
  group: plumber-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plumber:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Write scopes stay job-level (OpenSSF Scorecard flags workflow-level writes)
    permissions:
      contents: read
      security-events: write # required to upload SARIF to Code Scanning
      id-token: write # required to mint the OIDC id-token for the Plumber Score push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      # gitleaks powers the pipelineMustNotLeakSecretsInConfig control.
      # Checksum-verified release binary (no pipe-to-shell, no mutable tag).
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks
          rm gitleaks gitleaks.tar.gz

      - uses: getplumber/plumber@346a5299d477dc0a0e360521df7818c212bbe578 # v0.4.0
        with:
          min-points: 90
          score-push: true   # publish the Plumber Score badge (repo name + score become public)
