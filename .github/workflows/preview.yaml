name: Deploy Preview

on:
  push:
    branches-ignore:
      - main
      - master
      # Dependabot-triggered runs only receive Dependabot secrets, so
      # secrets.VERCEL_TOKEN is empty and `vercel pull` fails — and we don't
      # want deploy tokens in bot-triggered runs anyway. Dependency bumps are
      # still build-verified by the Build workflow (pull_request, no secrets).
      - "dependabot/**"

permissions:
  contents: read
  # Lets the deploy job post the preview URL on the branch's open PR
  pull-requests: write

# One preview deploy per branch: a newer push supersedes (cancels) the
# in-flight deploy so a stale commit can never finish last and win.
concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-preview:
    name: Deploy Preview
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Hash-locked Vercel CLI from the isolated .github/vercel manifest: the
      # deploy CLI runs with VERCEL_TOKEN in scope, so it must be pinned by
      # integrity hash — and kept out of the site's root dependency tree.
      - name: Install Vercel CLI
        run: npm ci --prefix .github/vercel

      - name: Pull Vercel Environment Information
        run: .github/vercel/node_modules/.bin/vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Project Artifacts
        run: .github/vercel/node_modules/.bin/vercel build --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy Project Artifacts to Vercel
        id: deploy
        run: |
          URL=$(.github/vercel/node_modules/.bin/vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Preview: $URL"

      # Surface the preview URL on the PR itself (sticky: edits the bot's
      # last comment on later pushes instead of stacking new ones). The
      # workflow triggers on push, so the PR is looked up from the branch.
      - name: Comment preview URL on PR
        if: ${{ steps.deploy.outputs.url != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          URL: ${{ steps.deploy.outputs.url }}
          BRANCH: ${{ github.ref_name }}
        run: |
          PR=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --state open --json number --jq '.[0].number')
          if [ -n "$PR" ] && [ "$PR" != "null" ]; then
            BODY="🔍 **Vercel preview** for \`$GITHUB_SHA\`: $URL"
            gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --edit-last --body "$BODY" \
              || gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body "$BODY"
          else
            echo "No open PR for branch $BRANCH; skipping comment."
          fi
