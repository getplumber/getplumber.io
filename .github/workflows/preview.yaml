name: Deploy Preview

on:
  push:
    branches-ignore:
      - main
      - master
      # Dependabot-triggered runs only receive Dependabot secrets, so
      # secrets.VERCEL_TOKEN is empty and `vercel pull` fails — and we don't
      # want deploy tokens in bot-triggered runs anyway. Dependency bumps are
      # still build-verified by the Build workflow (pull_request, no secrets).
      - "dependabot/**"

permissions:
  contents: read
  # The deploy step posts the preview URL back on the branch's pull request.
  pull-requests: write

# One preview deploy per branch: a newer push supersedes (cancels) the
# in-flight deploy so a stale commit can never finish last and win.
concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-preview:
    name: Deploy Preview
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Hash-locked Vercel CLI from the isolated .github/vercel manifest: the
      # deploy CLI runs with VERCEL_TOKEN in scope, so it must be pinned by
      # integrity hash — and kept out of the site's root dependency tree.
      - name: Install Vercel CLI
        run: npm ci --prefix .github/vercel

      - name: Pull Vercel Environment Information
        run: .github/vercel/node_modules/.bin/vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Project Artifacts
        run: .github/vercel/node_modules/.bin/vercel build --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy Project Artifacts to Vercel
        id: deploy
        run: |
          url="$(.github/vercel/node_modules/.bin/vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})"
          echo "Preview: $url"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Preview deployment: $url" >> "$GITHUB_STEP_SUMMARY"

      # Surface the preview URL on the pull request (one comment per PR, updated
      # on every push). The workflow runs on push, so a PR opened long after the
      # push gets its URL on the next push only.
      - name: Post the preview URL on the pull request
        if: steps.deploy.outputs.url != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          pr="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --state open --json number --jq '.[0].number // empty')"
          if [ -z "$pr" ]; then
            echo "No open pull request for $BRANCH, skipping the comment."
            exit 0
          fi
          marker="<!-- deploy-preview-url -->"
          body="$(printf '%s\n**Preview deployment** for %s: %s' "$marker" "${SHA:0:7}" "$PREVIEW_URL")"
          existing="$(gh api "repos/$GITHUB_REPOSITORY/issues/$pr/comments" --paginate \
            --jq ".[] | select(.body | startswith(\"$marker\")) | .id" | head -n 1)"
          if [ -n "$existing" ]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$existing" -f body="$body" > /dev/null
          else
            gh pr comment "$pr" --repo "$GITHUB_REPOSITORY" --body "$body"
          fi
