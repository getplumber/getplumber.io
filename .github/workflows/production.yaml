name: Deploy Production

# Deploy only on trusted history: a push to main/master on this repository.
# Do not use workflow_run + workflow_run.head_sha: fork PRs can name a branch
# "main", satisfy branches: [main], and pass a malicious head_sha while Lint
# (pull_request, no secrets) still succeeds.
on:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

# Serialize production deploys (never cancel one mid-flight) so two rapid
# merges cannot land out of order: GitHub keeps only the newest pending run.
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Hash-locked Vercel CLI from the isolated .github/vercel manifest: the
      # deploy CLI runs with VERCEL_TOKEN in scope, so it must be pinned by
      # integrity hash — and kept out of the site's root dependency tree.
      - name: Install Vercel CLI
        run: npm ci --prefix .github/vercel

      - name: Pull Vercel Environment Information
        run: .github/vercel/node_modules/.bin/vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Project Artifacts
        run: .github/vercel/node_modules/.bin/vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy Project Artifacts to Vercel
        run: .github/vercel/node_modules/.bin/vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}

      # Tell IndexNow-enabled engines (Bing, and through it AI assistants)
      # that the site changed. Non-blocking: a failed ping must not fail
      # the deploy.
      - name: Notify IndexNow
        run: node scripts/indexnow-submit.js
        continue-on-error: true
