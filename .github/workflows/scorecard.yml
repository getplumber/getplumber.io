name: OSSF Scorecard

on: # yamllint disable-line rule:truthy
  # Re-evaluate when branch protection changes, on pushes to main, and weekly
  branch_protection_rule: null
  push:
    branches: [main]
  schedule:
    - cron: "0 4 * * 1"

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write # required to upload SARIF to Code Scanning
      id-token: write # required by scorecard-action to publish results

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          # Publish to the OpenSSF REST API (powers the public Scorecard badge)
          publish_results: true

      - name: Upload SARIF to code scanning
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          sarif_file: results.sarif
