name: SEO Audit

on:
  schedule:
    # Run weekly on Sundays at 2 AM UTC
    - cron: "0 2 * * 0"
  workflow_dispatch:
    inputs:
      site_url:
        description: "Site URL to audit"
        required: false
        default: "https://getplumber.io"
      output_format:
        description: "Output format"
        required: false
        default: "json"
        type: choice
        options:
          - json
          - console

permissions:
  contents: read
  issues: write

jobs:
  seo-audit:
    name: SEO Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          # astro 7.4 needs >=22.23.4; the runner cache lags, so fetch the latest 22.x
          check-latest: true
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run SEO Audit
        id: seo-audit
        env:
          SITE_URL: ${{ github.event.inputs.site_url || 'https://getplumber.io' }}
          OUTPUT_FORMAT: ${{ github.event.inputs.output_format || 'json' }}
        run: |
          node scripts/seo-audit.js --url "$SITE_URL" --output "$OUTPUT_FORMAT" > seo-report.json || true
        continue-on-error: true

      - name: Upload SEO Report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: seo-report
          path: seo-report.json
          retention-days: 30

      # The audit step never fails (continue-on-error + `|| true`), so gate on
      # the report content itself rather than on failure().
      - name: Create Issue on Score Drop
        if: github.event_name == 'schedule'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const fs = require('fs');
            const report = JSON.parse(fs.readFileSync('seo-report.json', 'utf8'));

            if (report.score < 70 || report.totalIssues > 5) {
              const title = `SEO Score Alert: ${report.score}/100`;
              const body = `## SEO Audit Alert\n\n` +
                `**Current Score:** ${report.score}/100\n` +
                `**Total Issues:** ${report.totalIssues}\n` +
                `**Total Warnings:** ${report.totalWarnings}\n\n` +
                `Please review the SEO audit report and address critical issues.\n\n` +
                `[View Full Report](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`;

              github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: body,
                labels: ['seo', 'automated']
              });
            }
