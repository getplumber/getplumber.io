# Plumber policy for this repository: the Plumber default policy plus the
# overrides below, nothing else. Every control the default enables runs here,
# including the ones added after this file was first written.
#   plumber config resolve   # prints the full effective policy
#   plumber config diff      # shows these overrides against the default
version: "2.0"
extends: plumber:default

github:
  controls:
    # The default also protects master, release/*, production and dev; this
    # repository has one long-lived branch.
    branchMustBeProtected:
      namePatterns:
        - main

    # Tightened source policy: no curated publisher allowlist, no star-count
    # trust. Only GitHub-official actions, same-org actions and the one action
    # listed here are authorized.
    githubActionMustComeFromAuthorizedSources:
      includePlumberDefaults: false
      minimumStars: 0
      trustedGithubActions:
        - ossf/scorecard-action

    # Every repository of the organization runs the Plumber action.
    workflowMustIncludeRequiredActions:
      enabled: true
      required: getplumber/plumber
