<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 640" width="1080" height="640" role="img" aria-label="Sequence diagram of the signed score push: the CLI builds the report, mints two GitHub OIDC tokens, fetches the Sigstore trusted root, obtains a Fulcio certificate, signs the report, records the signature in Rekor, and posts the report with the bundle to the score service" style="color-scheme: light dark">
  <style>
    svg{--ink:#1f2328;--muted:#5d6670;--line:#c9cdd2;--lane:#e9ebe6;--sig:#0b7a75;--sigsoft:#d7eeec;--warn:#b45309;--warnsoft:#fbe9d2;--svc:#3b4ea8;--svcsoft:#dfe4f7;--box:#f7f6f2;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
    @media (prefers-color-scheme: dark){svg{--ink:#e6e8eb;--muted:#9aa3ad;--line:#3a4048;--lane:#1f242a;--sig:#4fc3bb;--sigsoft:#15302f;--warn:#f0a94a;--warnsoft:#3a2a12;--svc:#8fa0ea;--svcsoft:#1f2648;--box:#15181c}}
    text{fill:var(--ink);font-size:14px}
    .lane{fill:var(--lane)}
    .life{stroke:var(--line);stroke-width:1;stroke-dasharray:3 4}
    .actor{font-weight:600;font-size:15px}
    .sub{fill:var(--muted);font-size:12px}
    .b{font-weight:600}
    .msg{stroke:var(--ink);stroke-width:1.6;fill:none;marker-end:url(#arrow)}
    .msg.sig{stroke:var(--sig);marker-end:url(#arrow-sig)}
    .ret{stroke-dasharray:5 4}
    .num{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;font-weight:600;fill:var(--muted)}
    .box{fill:var(--sigsoft);stroke:var(--sig);stroke-width:1}
    .box.plain{fill:var(--box);stroke:var(--line)}
    .box.warn{fill:var(--warnsoft);stroke:var(--warn)}
    .box.svc{fill:var(--svcsoft);stroke:var(--svc)}
    .budget{fill:none;stroke:var(--sig);stroke-width:1;stroke-dasharray:2 3}
    .tsig{fill:var(--sig)}
    .twarn{fill:var(--warn)}
    .tsvc{fill:var(--svc)}
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" style="fill:var(--ink)"/></marker>
    <marker id="arrow-sig" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" style="fill:var(--sig)"/></marker>
  </defs>

  <g>
    <rect class="lane" x="30" y="20" width="160" height="44" rx="4"/><text class="actor" x="110" y="47" text-anchor="middle">Plumber CLI</text>
    <rect class="lane" x="225" y="20" width="150" height="44" rx="4"/><text class="actor" x="300" y="47" text-anchor="middle">GitHub OIDC</text>
    <rect class="lane" x="405" y="20" width="130" height="44" rx="4"/><text class="actor" x="470" y="47" text-anchor="middle">Sigstore TUF</text>
    <rect class="lane" x="575" y="20" width="130" height="44" rx="4"/><text class="actor" x="640" y="47" text-anchor="middle">Fulcio</text>
    <rect class="lane" x="745" y="20" width="130" height="44" rx="4"/><text class="actor" x="810" y="47" text-anchor="middle">Rekor</text>
    <rect class="lane" x="915" y="20" width="150" height="44" rx="4"/><text class="actor" x="990" y="47" text-anchor="middle">Score service</text>
  </g>
  <g class="life">
    <line x1="110" y1="64" x2="110" y2="620"/><line x1="300" y1="64" x2="300" y2="620"/><line x1="470" y1="64" x2="470" y2="620"/>
    <line x1="640" y1="64" x2="640" y2="620"/><line x1="810" y1="64" x2="810" y2="620"/><line x1="990" y1="64" x2="990" y2="620"/>
  </g>

  <rect class="box plain" x="40" y="84" width="220" height="32" rx="4"/>
  <text class="num" x="48" y="105">1</text><text class="b" x="66" y="105">Build the report</text>

  <line class="msg" x1="110" y1="146" x2="300" y2="146"/>
  <text class="num" x="118" y="140">2</text><text x="138" y="140">token A, for the score service</text>
  <line class="msg ret" x1="300" y1="162" x2="110" y2="162"/>

  <line class="msg sig" x1="110" y1="196" x2="300" y2="196"/>
  <text class="num" x="118" y="190">3</text><text x="138" y="190">token B, for Sigstore</text>
  <line class="msg sig ret" x1="300" y1="212" x2="110" y2="212"/>

  <rect class="budget" x="34" y="226" width="862" height="262" rx="6"/>
  <text class="sub tsig" x="44" y="242">60 s cap</text>

  <rect class="box" x="40" y="252" width="220" height="32" rx="4"/>
  <text class="num" x="48" y="273">4</text><text class="b" x="66" y="273">One-time key pair</text>

  <line class="msg sig" x1="110" y1="314" x2="470" y2="314"/>
  <text class="num" x="118" y="308">5</text><text x="138" y="308">trusted root</text>
  <line class="msg sig ret" x1="470" y1="330" x2="110" y2="330"/>

  <line class="msg sig" x1="110" y1="364" x2="640" y2="364"/>
  <text class="num" x="118" y="358">6</text><text x="138" y="358">certificate for the job identity</text>
  <line class="msg sig ret" x1="640" y1="380" x2="110" y2="380"/>

  <rect class="box" x="40" y="398" width="220" height="32" rx="4"/>
  <text class="num" x="48" y="419">7</text><text class="b" x="66" y="419">Sign the report</text>

  <line class="msg sig" x1="110" y1="458" x2="810" y2="458"/>
  <text class="num" x="118" y="452">8</text><text x="138" y="452">log entry</text>
  <line class="msg sig ret" x1="810" y1="474" x2="110" y2="474"/>

  <rect class="box" x="40" y="500" width="220" height="32" rx="4"/>
  <text class="num" x="48" y="521">9</text><text class="b" x="66" y="521">Bundle</text>

  <rect class="box warn" x="300" y="500" width="300" height="32" rx="4"/>
  <text class="twarn" x="312" y="521">Any failure in 3 to 9: one warning, unsigned push</text>

  <line class="msg" x1="110" y1="572" x2="990" y2="572"/>
  <text class="num" x="118" y="566">10</text><text x="138" y="566">POST report + bundle header</text>
  <line class="msg ret" x1="990" y1="588" x2="110" y2="588"/>

  <rect class="box svc" x="860" y="596" width="206" height="32" rx="4"/>
  <text class="num" x="868" y="617">11</text><text class="b tsvc" x="888" y="617">Verify offline</text>
</svg>
