        '503':
          description: 'The platform could not verify the session or determine the caller''s role (an infrastructure failure, not a refusal); retry later. During a provider outage a read may still be served from a bounded role cache (default 15 minutes past the cache TTL), a write never is.'
  /policy-templates:
