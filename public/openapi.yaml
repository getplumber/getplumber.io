# READ-API SURFACE (frontend Pages): proposed endpoints, entities, filters,
# pagination, and RBAC conventions for the read surface. Every path/field
# here is a PROPOSAL; promoted into path objects above once names are
# confirmed. The read surface is not required for the current walking
# skeleton. RBAC applies to every read.
