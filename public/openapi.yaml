openapi: 3.1.0
info:
  title: Plumber Platform API
  version: 2.6.0
  description: |-
    The HTTP API of the Plumber Platform, served by your Plumber instance under `/api/v1`.

    **Authentication.** Every operation needs a logged-in session (the `sessionCookie` scheme) unless it says otherwise; a few read operations also accept a personal API token as a bearer token. The role the operation requires (Member, Maintainer, OrgAdmin) is stated on each operation.

    **Lists.** An offset-paginated list answers `{items, page, per_page, total}`; a keyset-paginated one answers `{items, total, next_cursor}` and takes an opaque `after` cursor. `per_page` is clamped to its documented maximum. Every other query parameter is validated: an unknown parameter name, or a value outside a parameter's vocabulary, answers `400` naming it (`severity` is matched case-insensitively, every other vocabulary is case-sensitive).

    **Requests.** Unknown fields in a request body are ignored.

    **Honest states.** A missing or degraded analysis result is reported as such (`not evaluable`, `stale`, `degraded`); the platform never fabricates a score or a verdict.

    `version` is the Platform release this contract was published with (`0.0.0-dev` in the repository and in an unreleased build).
servers:
  - url: https://{instance}/api/v1
    variables:
      instance:
        default: plumber.example.com
paths:
  /healthz:
    get:
      operationId: healthz
      summary: Liveness probe (unauthenticated, for a Kubernetes-style orchestrator)
      description: |-
        Answers 200 as long as this process is up and serving HTTP. It consults no dependency
        (not the database, not Redis), so it only says whether the process is wedged, never
        whether it can currently serve: that is `/readyz`'s job.
      security: []
      responses:
        '200':
          description: The process is serving HTTP. This is the only status this endpoint returns.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [ok] }

  /readyz:
    get:
      operationId: readyz
      summary: Readiness probe (unauthenticated, for a Kubernetes-style orchestrator)
      description: |-
        Answers 200 only when the database is reachable. A 503 means this instance cannot serve
        reads or writes and should be pulled from the load-balancing pool.

        Redis reachability never affects the HTTP status or the `status` field; the payload still
        names `redis` (`ok` / `unreachable`) so monitoring can see it.

        `issuers` is a configuration warning for the operator, not a readiness fact: `ok` when
        every configured git instance can ingest pushes, `<n> instance(s) without a base URL
        cannot ingest` when some cannot, `no configured instance, nothing can ingest` before any
        instance is configured, or `unknown` when the check could not be read. It carries a
        count, never an instance name, it never flips the HTTP status or the `status` field, and
        it is present on the 503 body too.
      security: []
      responses:
        '200':
          description: The database is reachable. `redis` and `issuers` name their own state but never affect this status.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [ok] }
                  db: { type: string, enum: [ok] }
                  redis: { type: string, enum: [ok, unreachable] }
                  issuers: { type: string }
        '503':
          description: The database is unreachable; pull this instance from the pool.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [not_ready] }
                  db: { type: string, enum: [unreachable] }
                  redis: { type: string, enum: [ok, unreachable] }
                  issuers: { type: string }

  /pushes:
    post:
      operationId: createPush
      summary: Ingest a CLI analysis result (one push carries all policies' results for one run)
      description: |-
        The CLI pushes at the end of a job, authenticated by native CI OIDC. Project identity is taken from the verified OIDC claims, never from the body.

        The server, in order:

        - Verifies OIDC.
        - Applies an idempotency guard (job id) and an ordering guard (pipeline id + timestamps; the displayed result never regresses).
        - Accepts each policy score.
        - Updates freshness.
        - Emits an SSE `project.update` event.

        **Forward-tolerant**: unknown fields are ignored.
      security:
        - ciOIDC: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Push' }
      responses:
        '201':
          description: Ingested (new run); freshness updated, SSE emitted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PushAccepted' }
        '200':
          description: >
            Idempotent replay of a job already ingested (same job id): upserted, no duplicate, no
            regression. A replay of a job whose run first landed out of order keeps answering 202
            `kind: out_of_order` with `evaluated: false`. Also answered for `kind: re_check`, the
            platform's own re-check of an existing run: that run's results and score are updated
            in place, `recomputed` is true, `gate.evaluated` is true, and `freshness` reports the
            project's current `fresh` state while the displayed run (score, deployment_status) is
            left untouched.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PushAccepted' }
        '202':
          description: >
            Accepted but recorded as out-of-order (an older pipeline landed after a newer one):
            stored in history, the displayed result does not regress. Same PushAccepted body shape
            as 200/201, with `recomputed` false and `gate.evaluated` false with
            `gate.reason: out_of_order`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PushAccepted' }
        '400':
          description: >-
            The request body could not be read (the client disconnected before sending the full
            body). A body that was fully read and then failed validation is a `422`; a body that
            is too large is a `413`, checked first. Project state unchanged.
        '401':
          description: OIDC verification failed (missing/invalid token, wrong aud, unknown issuer). Project state unchanged.
        '413':
          description: >-
            The pushed body exceeds the size limit (16M). Checked both against a `Content-Length`
            header over the limit and against the body's actual byte count while reading, so a
            chunked or under-reported request also gets `413`, never a `400`. Project state
            unchanged.
        '415':
          description: >-
            `Content-Type` is not `application/json`. The media type is parsed, not prefix-matched:
            `application/json; charset=utf-8` is accepted, `application/json-patch+json` is
            refused. Checked after OIDC verification and before the body is read. Project state
            unchanged.
        '422':
          description: |-
            The envelope is invalid. Rejected here:

            - A missing `schema_version`, or an empty `results` array, unless the push carries the
              nothing-evaluated marker (`evaluation.nothing_evaluated: true`), which makes an empty
              result list a legitimate run. A push that sets the marker and also carries a
              non-empty `results` array is rejected too.
            - A finding's `data` or a policy result's `effective_config` nesting objects or arrays
              deeper than 100 levels.
            - An object inside a finding's `data` or a policy result's `effective_config` that
              references a CI/CD variable by name (`variableName` / `variable_name`) and also
              carries a value-shaped sibling key (`value`, `variableValue` / `variable_value`,
              `resolvedValue` / `resolved_value`, `envValue` / `env_value`) must declare that
              value's provenance on the same object via `valueProvenance` / `value_provenance`,
              with exactly one of `settings_secret` (a CI/CD variable the provider marks sensitive:
              GitLab hidden/masked, GitHub Secret), `settings_plain` (a CI/CD variable that is
              neither hidden nor masked) or `ci_file` (a literal written directly in the CI
              configuration, e.g. a `variables:` / `env:` / `with:` entry). A sensitive value is
              never accepted, declared or not. A value whose provenance is absent, not an exact
              match of one of the three tiers (including wrong casing), or over the per-value byte
              cap is rejected; only `settings_plain` or `ci_file`, within the cap, is stored. A
              plain `variables:` map with no variable-reference key is unaffected.
            - The optional `bom` section breaching one of its bounds: over 500 includes, 500
              images or 500 jobs, over 500 jobs on one image, over 64 services or 32 runner tags
              on one job, a string over 512 runes (1024 for a remote include URL), over 50
              advisories on one include, or a stored document over 256 KiB; or a `bom` with no
              `version`, or a `version` other than 1. The whole push is refused, never the section
              dropped.

            Every rejection returns the same generic message, with one exception: a variable value
            declaring no provenance (the shape a CLI without provenance support produces) answers
            "variable value at `<path>` declares no valueProvenance; a CLI version supporting
            provenance declarations is required for projects reporting variable values", where
            `<path>` is a fixed label and the pushed value is never echoed.
        '429':
          description: >-
            The rate limiter throttled this source IP. It is checked before OIDC verification, so
            an unauthenticated caller can get it too. `Retry-After` (seconds) says how long until
            the window frees at least one slot. The default budget is 600 pushes per minute per
            source IP.
          headers:
            Retry-After:
              schema: { type: integer }
              description: Seconds until the caller's own window frees at least one slot.
        '500':
          description: >-
            An internal failure persisting the push (e.g. a database error). Never a client-caused
            rejection: nothing about the guards, the ordering or the envelope can be concluded from
            it, and it carries no diagnostic body.
  /projects/{project_path}/context:
    get:
      operationId: getProjectContext
      summary: Resolved policy set + data collection snapshot for a project (one call, at analysis time)
      description: |-
        Served to the CLI (Bearer OIDC). One call returns the resolved policy set plus the data collection snapshot the CLI needs to evaluate certain controls.

        - The resolved policy set is never empty (falls back to [Plumber default]).
        - `snapshot.data` holds the collected project settings (branch protection, MR approval rules, CI variables) and may include `merged_yaml`, the resolved CI configuration, with an optional authoritative override from the CLI.
        - `snapshot.collected_at` says when the data collection snapshot was collected; it may be a cached read rather than a live call to the provider.
        - `snapshot.last_attempt_at` / `snapshot.last_attempt_outcome` say when the platform last tried to collect and how that try ended. Both are absent when no pass has ever run for the project.
        - An authenticated project always gets 200, even with no prior activity: the response is then the derived [Plumber default]. There is no 404 for the OIDC-attributed project.
      security:
        - ciOIDC: []
      parameters:
        - name: project_path
          in: path
          required: true
          schema: { type: string }
          description: 'Provider project path or opaque id.'
      responses:
        '200':
          description: Resolved context (never empty; falls back to [Plumber default] when no config is assigned yet).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectContext' }
        '400':
          description: 'Malformed project path or id parameter.'
        '401': { description: OIDC verification failed. }
        '403':
          description: 'The verified OIDC claim does not match {project_path}: a project may only read its own context.'
        '500': { description: 'An internal failure resolving the project context (e.g. a database error). Never a client-caused rejection.' }

  /projects/{project_path}/resolved-config:
    post:
      operationId: resolveProjectConfig
      summary: Resolve a project's CI configuration (bounded, cached by digest)
      description: |-
        Served to the CLI when its own computed CI-config digest diverges from the data collection snapshot's anchor. Self-only, like /context: the verified OIDC claim must match {project_path}. This is the only synchronous provider call a CLI request may trigger.

        - Cache hit on (project, config_digest, digest_version): returns the stored merged_yaml immediately, with no provider call.
        - Cache miss: concurrent identical requests share one resolution. Resolution is bounded by a timebox and a per-instance concurrency cap; exceeding either returns a typed 503, never a block and never a queue that outlives the caller's job.
        - The platform's own recomputed digest is authoritative for the cache key: the response always carries the platform-computed digest, and a mismatch with the request's config_digest is never an error.
        - `config_digest` / `digest_version` may be absent from the request (the CLI's own digest computation aborted, e.g. past the 50-file traversal limit or on a read failure). The platform then skips the cache lookup, resolves, and returns the result uncached, with `config_digest` / `digest_version` absent from the response too. They are also absent from the response alone when the platform's own recomputation aborts for the same reason: the merge still succeeds, but the result is not cached and resolves fresh on every run.
        - An invalid CI config (the provider reports the merge as invalid) is a user error, not a resolution failure: 200 with `valid: false` and a possibly-empty merged_yaml, never cached.
      security:
        - ciOIDC: []
      parameters:
        - name: project_path
          in: path
          required: true
          schema: { type: string }
          description: 'Provider project path or opaque id.'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResolveConfigRequest' }
      responses:
        '200':
          description: Resolved, from the cache or freshly; `source` says which.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResolvedConfig' }
        '400':
          description: 'Malformed project path or id parameter.'
        '401': { description: OIDC verification failed. }
        '403':
          description: 'The verified OIDC claim does not match {project_path}: a project may only resolve its own configuration.'
        '500': { description: 'An internal failure resolving the CI config outside the 503 cases (e.g. a database error persisting the cache entry).' }
        '503':
          description: 'Resolution unavailable: the timebox or the per-instance concurrency cap was exceeded, the git host is unreachable, or no org token is configured for this instance. The CLI treats this as `not_evaluable` for merged-yaml-dependent controls; it never blocks and never fabricates a result.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResolveUnavailable' }

  /events:
    get:
      operationId: streamEvents
      summary: Server-Sent Events stream (one per client; client-side filtering)
      description: |-
        SSE stream. One stream per client; the client filters.

        - Six event names. `project.update`: the project status dimensions, filtered to the
          projects the connecting user may read. `report.export`: the completion doorbell for an
          on-demand report export (createReportExport), delivered only to the session of the user
          who requested it; see `ReportExportEvent`. `stream.resync`: sent on reconnect when the
          client's `Last-Event-ID` is older than the server's replay window (see below), telling it
          to fully refetch whatever it was tracking before live streaming resumes; see
          `StreamResyncEvent`. `config.update`: published by a Maintainer's policy or portfolio
          write, delivered org-wide (the payload carries a policy/portfolio id, never a project);
          see `ConfigUpdateEvent`. `sync.update`: published at a sync run's queued/start/complete/
          fail transitions and, throttled, at listing progress, delivered org-wide; see
          `SyncUpdateEvent`. `fix.update`: published on every fix status transition (creation
          included), delivered org-wide; see `FixUpdateEvent`. `config.update`, `sync.update` and
          `fix.update` are notifications, never state carriers: follow up with a plain REST refetch
          (the changed policy/portfolio, `GET /sync/status`, or the affected issue's
          `latest_fix_status`).
        - The `event:` line names which one a given message is; the `data:` payload's shape follows:
          `project.update` conforms to `ProjectUpdateEvent`, `report.export` to `ReportExportEvent`,
          `stream.resync` to `StreamResyncEvent` (always `{}`: the event name is the entire signal),
          `config.update` to `ConfigUpdateEvent`, `sync.update` to `SyncUpdateEvent` (also always
          `{}`), `fix.update` to `FixUpdateEvent`.
        - Every event except `stream.resync` carries an `id:` line shaped `<nonce>-<seq>`. A client
          never parses it; it echoes the whole value back verbatim as `Last-Event-ID` on reconnect.
          It is SSE framing only, never part of the `data:` payload.
        - `Last-Event-ID` is honored on reconnect. The server keeps a bounded, in-memory window of
          the most recent 256 events. When the id was produced by the serving process and is still
          inside the window, every event published after it is replayed in order, through the same
          visibility filter as live events, before live streaming resumes. An id older than the
          window, an id from another server process or an earlier restart, or an unparseable
          header gets `stream.resync` before live streaming resumes. No `Last-Event-ID` header
          (including the very first connection): no replay, no resync. The server sends
          heartbeats.
        - Response body is `text/event-stream`.
        - Delivery beyond the 256-event replay window is best-effort, at-most-once: an event is
          dropped for a client whose buffer is full at that instant, and a client that reconnects
          with an id older than the window, or was not connected when an event fired, cannot
          recover it from this stream; `stream.resync` is the cue that this happened. The stream is
          a freshness signal, never the source of truth: `report.export` in particular names
          `getReportExport` as the authoritative status to poll when unsure.
        - Per-user concurrent stream cap (default 16): a user may hold at most this many streams
          open at once, counted per platform user rather than per session, so two tabs on the same
          account share one budget. The next attempt answers `429` with a JSON body naming the
          cap. Closing one of the user's own streams frees the slot immediately.
      security:
        - sessionCookie: []
      parameters:
        - { name: Last-Event-ID, in: header, required: false, schema: { type: string }, description: 'The `id:` (shaped `<nonce>-<seq>`) of the last event this client processed, echoed back verbatim on reconnect. See the operation description for the 256-event replay/resync behavior.' }
      responses:
        '200':
          description: Event stream.
          content:
            text/event-stream:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/ProjectUpdateEvent'
                  - $ref: '#/components/schemas/ReportExportEvent'
                  - $ref: '#/components/schemas/StreamResyncEvent'
                  - $ref: '#/components/schemas/ConfigUpdateEvent'
                  - $ref: '#/components/schemas/SyncUpdateEvent'
                  - $ref: '#/components/schemas/FixUpdateEvent'
        '401': { description: No live session. }
        '503':
          description: 'The platform could not verify your session (the session or user store is unreachable) or could not resolve your project visibility: an infrastructure failure, distinct from 401. Answered as an ordinary JSON error before the stream opens, never as a half-open stream. During a provider outage the stream may still connect from the role grace window (a role and visibility fact cached before the outage, by default 15 minutes past the cache TTL); a definite provider refusal is never served from it.'
        '403': { description: 'The provider refused your own token (401 or 403 from GitLab): log in again, or your account may have been blocked. The body is the fixed string "your access could not be verified with the provider: log in again, or your account may have been blocked"; distinct from the 503 infrastructure failure. This route has no role threshold of its own (a live session is enough), so this is the only 403 it serves.' }
        '429':
          description: 'The connecting user already has the maximum number of concurrent streams open. The body names the configured cap. Close another stream and retry.'
  /badge/{instance}/{project_path}:
    get:
      operationId: getProjectBadge
      summary: Public score badge (SVG), off by default
      description: |-
        Serves the project's score badge (grade A-E).

        - The path is `{instance}/{project_path}`: a Plumber install serves exactly one org, so
          there is no org segment. The former `{org_slug}/{instance}/{project_path}` form no longer
          resolves.
        - The badge is off by default. It is served only when all three hold: the org toggle
          (`PUT /settings/org` `badge_enabled`), the project toggle (`PUT /projects/{id}/badge`
          below), and the project's observed visibility on the provider is exactly `public`
          (`internal`, `private` and never-observed all refuse). Visibility is refreshed by the
          platform's sync pass, so a project made private on the provider stops serving its badge
          within the next sync cycle, not immediately.
        - The default badge reflects the score-bearing ref (default branch).
        - When the displayed score's run carried a degraded collection, the grade cell reads
          `<letter>*` (e.g. `B*`) instead of the bare letter, and the SVG's accessible text (its
          `title` and `aria-label`) appends " (degraded collection)". Colors and every no-grade
          state are unchanged.
        - A stale or no-result freshness is reflected as such, never a fabricated grade.
        - The 404 body is byte-identical across every refusal (unknown instance, unknown project
          path, org toggle off, project toggle off, non-public visibility, a malformed or
          undecodable path parameter, or an ambiguous match).
      security: []  # public when enabled
      parameters:
        - { name: instance, in: path, required: true, schema: { type: string }, description: 'The git instance name.' }
        - { name: project_path, in: path, required: true, schema: { type: string } }
        - { name: branch, in: query, required: false, schema: { type: string }, description: 'Optional ref; defaults to the score-bearing ref.' }
        - name: style
          in: query
          required: false
          schema: { type: string }
          description: 'Reserved for a future badge style; accepted and ignored today.'
      responses:
        '200':
          description: SVG badge.
          content:
            image/svg+xml: { schema: { type: string } }
        '404': { description: 'No public badge: unknown instance, unknown project path, org or project toggle off, non-public observed visibility, a malformed or undecodable path parameter, or an ambiguous match. The body is byte-identical across every case.' }
        '500': { description: 'An internal failure rendering the badge (e.g. a database error). Never a client-caused rejection.' }

  /projects/{id}/badge:
    put:
      operationId: updateProjectBadge
      summary: Enable/disable a project's own public score badge (OrgAdmin)
      description: |-
        Enables or disables the project's own half of the badge eligibility gate (see
        `GET /badge/{instance}/{project_path}` for the full gate: org toggle, project toggle and
        observed visibility `public`). Requires OrgAdmin.

        - `enabled` is required: an absent field answers 400 naming it; it never silently defaults
          to false or unchanged.
        - `{id}` must be visible to the caller; an invisible or unknown id answers the same 404.
        - The response echoes the badge_enabled value just stored.
        - Turning this on does not by itself make the badge public: the org toggle and the
          project's observed visibility must also hold.
      security:
        - sessionCookie: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProjectBadgeSettings' }
      responses:
        '200':
          description: The project's badge_enabled state, as stored.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectBadgeSettings' }
        '400': { description: '`enabled` absent (naming it), an unrecognized top-level field, or a malformed project id.' }
        '401': { description: No live session. }
        '403': { description: 'The caller is below OrgAdmin, or the provider refused the caller''s own token (401 or 403 from GitLab): log in again, or your account may have been blocked. In the second case the body is the fixed string "your access could not be verified with the provider: log in again, or your account may have been blocked"; distinct from the 503 infrastructure failure.' }
        '500': { description: 'An internal failure completing the request (e.g. a database error), never a client-caused rejection. The body is the fixed string "sync request failed"; the detail is logged server-side only. Distinct from 503 (a session or role-derivation failure).' }
        '503':
          description: 'The platform could not verify your session, could not determine your role, or could not resolve your visible project set (the session store or the provider was unreachable): an infrastructure failure, distinct from 401 (no live session) and 403 (role below the required threshold). A write is never served from the role grace window and always answers 503 during a provider outage.'
        '404': { description: 'Unknown project id, or a project not visible to the caller (indistinguishable from unknown).' }

  /projects/{id}/official-component:
    put:
      operationId: updateProjectOfficialComponent
      summary: Curate a project as an official component repo (Maintainer)
      description: |-
        Marks or unmarks this project as an "official" component repo. Requires Maintainer. Same single-field toggle shape as `updateProjectBadge`: a required boolean body key, the response echoing the stored value.

        - `official` is required: an absent field answers 400 naming it; it never silently defaults to false or unchanged.
        - The write is not gated on the project's own `is_component_repo` value: `official_component_repo` and `is_component_repo` are independent flags, never derived from one another (see `InventoryProject.official_component_repo`).
        - `{id}` must be visible to the caller: an unknown id, a project belonging to a different org, and an invisible project all answer the same 404.
        - The response echoes the official value just stored.
      security:
        - sessionCookie: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProjectOfficialComponentSettings' }
      responses:
        '200':
          description: The project's official_component_repo state, as stored.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectOfficialComponentSettings' }
        '400': { description: '`official` absent (naming it), an unrecognized top-level field, or a malformed project id.' }
        '401': { description: No live session. }
        '403': { description: 'The caller is below Maintainer, or the provider refused the caller''s own token (401 or 403 from GitLab): log in again, or your account may have been blocked. In the second case the body is the fixed string "your access could not be verified with the provider: log in again, or your account may have been blocked"; distinct from the 503 infrastructure failure.' }
        '404': { description: 'Unknown project id, a project belonging to a different org, or a project not visible to the caller - all three indistinguishable.' }
        '500': { description: 'An internal failure completing the request (e.g. a database error), never a client-caused rejection. The body is the fixed string "sync request failed"; the detail is logged server-side only. Distinct from 503 (a session or role-derivation failure).' }
        '503':
          description: 'The platform could not verify your session, could not determine your role, or could not resolve your visible project set (the session store or the provider was unreachable): an infrastructure failure, distinct from 401 (no live session) and 403 (role below the required threshold). A write is never served from the role grace window and always answers 503 during a provider outage.'
  /openapi.yaml:
    get:
      operationId: getOpenApiSpec
      summary: Serve this OpenAPI contract itself (Member-gated, raw YAML)
      description: |-
        Returns this OpenAPI contract verbatim as YAML. Requires an authenticated session at Member level.

        - Response headers include `X-Content-Type-Options: nosniff`, so the response is treated as data, never as HTML.
      security:
        - sessionCookie: []
      responses:
        '200':
          description: The OpenAPI contract, verbatim.
          content:
            application/yaml:
              schema: { type: string }
        '401': { description: No live session. }
        '403': { description: 'The caller is below Member, or the provider refused the caller''s own token (401 or 403 from GitLab): log in again, or your account may have been blocked. In the second case the body is the fixed string "your access could not be verified with the provider: log in again, or your account may have been blocked"; distinct from the 503 infrastructure failure.' }
        '503':
          description: 'The platform could not verify your session or could not determine your role (the session store or the provider was unreachable): an infrastructure failure, distinct from 401 (no live session) and 403 (role below the required threshold). During a provider outage a GET or HEAD may still be answered from the role grace window (a role cached before the outage, by default 15 minutes past the cache TTL); a write never is.'
  /auth/instances:
    get:
      operationId: listLoginInstances
      summary: List the git instances a browser can log in against
      description: |-
        Unauthenticated: the login page uses it to build its instance picker before any session exists. Only instances an OrgAdmin has finished configuring an OAuth application for are returned, the same predicate /auth/login enforces (a 409 there means the instance would not have appeared here).

        The response never carries a token, authorization code, client secret, session id, PKCE verifier or any other secret-adjacent field: only what a login picker needs to render one clickable option per instance.

        Returns an empty list before any instance has been configured (a fresh install): a valid, ordinary response, not an error.
      security: []
      responses:
        '200':
          description: The login-capable git instances, ordered by instance name.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginInstanceList' }

  /auth/login:
    get:
      operationId: startLogin
      summary: Start the browser login flow against one git instance
      description: |-
        Entry point of the browser login, and the only way to obtain the session cookie every other endpoint below requires.

        This is a browser navigation, not an XHR call: send the user here and let the browser follow the redirect and keep the cookies. Fetching it from application code will not log anyone in.

        - `instance_id` names which configured git instance to authenticate against. That instance must already have an OAuth application configured, which an OrgAdmin does beforehand.
        - Sets a short-lived `plumber_oauth_state` cookie binding this login attempt to this browser. The callback refuses to continue without it, so cookies must survive the round trip to the git instance.
        - A login attempt may sit at the consent screen for 10 minutes. Past that the callback rejects it and the user starts again.
        - No session is required to call this, since this is how a session is obtained.
      security: []
      parameters:
        - { name: instance_id, in: query, required: true, schema: { type: string, format: uuid }, description: 'The git instance to authenticate against.' }
      responses:
        '302':
          description: Redirect to the git instance's OAuth consent screen.
          headers:
            Location:
              schema: { type: string }
              description: The git instance's consent URL.
            Set-Cookie:
              schema: { type: string }
              description: '`plumber_oauth_state`: HttpOnly, SameSite=Lax, Path=/, expiring with the 10 minute attempt window. `Secure` follows the instance''s own TLS configuration, so on a plain-HTTP self-hosted deployment the cookie is set without it.'
        '400': { description: '`instance_id` is absent or is not a UUID.' }
        '404': { description: No such instance. }
        '409': { description: 'That instance has no OAuth application configured, so nobody can log in through it yet.' }
        '429':
          description: >-
            The rate limiter throttled this source IP. The whole login flow (this route plus
            /auth/callback) shares one per-IP budget. `Retry-After` (seconds) says how long until
            the window frees at least one slot.
          headers:
            Retry-After:
              schema: { type: integer }
              description: Seconds until the caller's own window frees at least one slot.

  /auth/callback:
    get:
      operationId: completeLogin
      summary: Complete the login and open the session
      description: |-
        The address the git instance redirects the browser back to after consent, and the redirect URI each instance's OAuth application must be registered with. It is called by the browser, never by application code.

        On success it opens the session, sets the `plumber_session` cookie, and redirects to `/`. It returns no body: read who the session belongs to from the endpoints that serve it.

        - Single use. A login attempt completes exactly once, so replaying the same `code` and `state` pair fails, as does a `state` older than 10 minutes.
        - The `plumber_oauth_state` cookie set at login must be present and match `state`. That is checked first, before anything else happens. The cookie is cleared on every outcome, success or failure alike.
        - Beyond what starting a login against the same instance already tells you, no further step is distinguished: a refused code exchange and an unreadable user profile collapse into the same 502, with nothing said about which of the two failed.
      security: []
      parameters:
        - { name: code, in: query, required: true, schema: { type: string }, description: 'Authorization code issued by the git instance.' }
        - { name: state, in: query, required: true, schema: { type: string }, description: 'The state issued at login. Must match the plumber_oauth_state cookie.' }
      responses:
        '302':
          description: Login complete. The session is open.
          headers:
            Location:
              schema: { type: string }
              description: Always `/`.
            Set-Cookie:
              schema: { type: string }
              description: '`plumber_session`: HttpOnly, SameSite=Lax, Path=/, expiring after the configured session lifetime. `Secure` follows the instance''s own TLS configuration, so on a plain-HTTP self-hosted deployment the cookie is set without it.'
        '400': { description: '`state` is malformed, does not match the cookie, or has already been used or has expired. Note that an absent or empty `code` is not rejected here: it reaches the git instance and comes back as the 502 below.' }
        '404': { description: The instance named by the state no longer exists. }
        '409': { description: That instance has no OAuth application configured. }
        '502': { description: 'The git instance refused the code exchange, or its user profile could not be read. No session was opened and nothing was stored.' }
        '429':
          description: >-
            The rate limiter throttled this source IP. This route shares one per-IP budget with
            /auth/login. `Retry-After` (seconds) says how long until the window frees at least one
            slot.
          headers:
            Retry-After:
              schema: { type: integer }
              description: Seconds until the caller's own window frees at least one slot.

  /auth/logout:
    post:
      operationId: logout
      summary: End the current session
      description: |-
        Ends the session named by the `plumber_session` cookie and expires that cookie in the browser.

        - Always answers 204, including when there was no live session to end. Logging out is never allowed to fail from the browser's point of view, so the outcome does not depend on whether the cookie was still valid.
      security: []
      responses:
        '204':
          description: The session is ended, or there was none. Either way the cookie is expired.
          headers:
            Set-Cookie:
              schema: { type: string }
              description: '`plumber_session`: same HttpOnly, SameSite=Lax, Path=/ attributes, with a zero lifetime so the browser drops it.'

  /user/invalidate-cache:
    post:
      operationId: invalidateUserCache
      summary: Clear the caller's own cached role/access facts
      description: |-
        Clears every cached role/access fact stored for the calling user, so the next check re-derives them live from the git provider instead of waiting out the cache's TTL.

        Use this right after your access on the git provider changed (added to a group, promoted, removed) and you need the Platform to notice immediately.

        - Requires only an authenticated session (any logged-in user may clear their own cache).
        - Only clears the caller's own cache; there is no endpoint to clear another user's.
      security:
        - sessionCookie: []
      responses:
        '204': { description: The caller's cached role/access facts are cleared. }
        '401': { description: No live session. }
        '500': { description: 'An internal failure completing the request (e.g. a database error), never a client-caused rejection. The body is the fixed string "unable to invalidate cache"; the detail is logged server-side only. Distinct from 503 (a session or role-derivation failure).' }
        '503': { description: 'The platform could not verify your session right now (the session or user store is unreachable): an infrastructure failure, distinct from 401 (no live session).' }
        '429':
          description: >-
            The rate limiter throttled this session. It is keyed per session, never per IP, and
            only checked after the session is verified (an unauthenticated request sees 401). The
            default budget is 20 calls per minute per session. `Retry-After` (seconds) says how
            long until the window frees at least one slot.
          headers:
            Retry-After:
              schema: { type: integer }
              description: Seconds until the caller's own window frees at least one slot.

  /me:
    get:
      operationId: me
      summary: The caller's own session identity (any authenticated user)
      description: |-
        Returns the caller's own name, provider username, avatar, and derived role, so a client can render "logged in as" without a separate round trip per field.

        - Requires only an authenticated session; there is no minimum role threshold, as for `/me/role`.
        - `role` is derived live, the same way `/me/role` derives it, never a value stamped at login. When that derivation fails the response is 503, not 403.
        - `username` is nullable: null until this user's next login records it.
        - `id`, `provider`, `instance` and `instance_id` are the caller's platform user id and the (provider, instance name, instance id) of the git instance they are logged into; see CurrentUser's field descriptions, including `instance_id`'s occasionally-null lookup.
        - `org_ui` carries the org-wide UI preferences a client needs at every role (today exactly one: `community_link_hidden`). It is always present, since a Member or Maintainer cannot read `GET /settings/org`.
      security:
        - sessionCookie: []
      responses:
        '200':
          description: The caller's own session identity.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CurrentUser' }
        '401': { description: No live session. }
        '500': { description: 'An internal failure completing the request (e.g. a database error), never a client-caused rejection. The body is the fixed string "authorization request failed"; the detail is logged server-side only. Distinct from 503 (a session or role-derivation failure).' }
        '503':
          description: 'The platform could not verify your session or could not determine your role (the session store or the provider was unreachable): an infrastructure failure, distinct from 401 (no live session) and 403 (role below the required threshold). During a provider outage a GET or HEAD may still be answered from the role grace window (a role cached before the outage, by default 15 minutes past the cache TTL); a write never is.'
  /me/role:
    get:
      operationId: myRole
      summary: The caller's own derived role for their instance (any authenticated user)
      description: |-
        Returns the role the platform has just derived for the calling user on their own instance, so a client can decide what to show (e.g. whether to offer the Settings > Authorization grant/revoke actions) without provoking a 403 first.

        - Requires only an authenticated session; there is no minimum role threshold.
        - The role is derived live, the same way every gated route derives it, never a value stamped at login. If that derivation fails (the git instance is unreachable or missing its base URL, the caller's stored access token cannot be used, or the authorization-grant list cannot be read) this endpoint answers 503, never 403. Treat that 503 as "role currently unknown, retry", not as a role of None.
      security:
        - sessionCookie: []
      responses:
        '200':
          description: The caller's derived role.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CurrentUserRole' }
        '401': { description: No live session. }
        '500': { description: 'An internal failure completing the request (e.g. a database error), never a client-caused rejection. The body is the fixed string "authorization request failed"; the detail is logged server-side only. Distinct from 503 (a session or role-derivation failure).' }
        '503':
          description: 'The platform could not verify your session or could not determine your role (the session store or the provider was unreachable): an infrastructure failure, distinct from 401 (no live session) and 403 (role below the required threshold). During a provider outage a GET or HEAD may still be answered from the role grace window (a role cached before the outage, by default 15 minutes past the cache TTL); a write never is.'
  /me/provider-token:
    get:
      operationId: myProviderToken
      summary: The caller's own current GitLab OAuth access token, freshly refreshed (Member)
      description: |-
        Returns the calling user's own current GitLab OAuth access token for their instance,
        refreshed the same way the session refresh is, so the token is always current, never a
        stale stored value.

        - Lets a browser client read the provider directly, including private-project template or
          component content it could not otherwise reach.
        - Requires a session at Member level: this route hands back a live provider credential,
          so a session whose role could not be derived is refused with the same `403` every other
          Member-gated read answers.
        - `Cache-Control: no-store` on every response; the token value is never logged.
        - The org token has no equivalent endpoint: this endpoint only ever serves the caller's
          own user credential.
        - A refresh failure (no stored token, no OAuth application configured for the caller's
          instance, a refresh the provider rejects, or a failure persisting the refreshed tokens)
          answers a 5xx error asking the caller to log in again, never a stale or absent token
          served as if it were fresh.
      security:
        - sessionCookie: []
      responses:
        '200':
          description: The caller's own current GitLab OAuth access token.
          headers:
            Cache-Control:
              schema: { type: string, enum: [no-store] }
              description: Always `no-store`; this body is a live credential, never cached by any intermediary.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProviderToken' }
        '401': { description: No live session. }
        '403': { description: 'The caller is below Member, or the provider refused the caller''s own token (401 or 403 from GitLab): log in again, or your account may have been blocked. In the second case the body is the fixed string "your access could not be verified with the provider: log in again, or your account may have been blocked"; distinct from the 503 infrastructure failure.' }
        '502':
          description: >-
            The caller's provider token could not be refreshed (no stored token, no OAuth
            application configured for the caller's instance, or the provider rejected the
            refresh, e.g. a revoked or already-consumed refresh token). The body is the fixed
            string "unable to refresh your provider token, please re-log-in": log in again.
        '500': { description: 'An internal failure completing the request (e.g. a database error persisting the refreshed token), never a client-caused rejection. The body is the fixed string "authorization request failed"; the detail is logged server-side only. Distinct from 502 (a provider-refresh failure) and 503 (a session-verification failure).' }
        '503': { description: 'The platform could not verify your session right now (the session or user store is unreachable): an infrastructure failure, distinct from 401 (no live session) and 502 (a provider-refresh failure).' }

  /me/tokens:
    get:
      operationId: listMyApiTokens
      summary: The caller's own platform API tokens (any authenticated user)
      description: |-
        Lists the calling user's own platform API tokens, newest first, including revoked and expired
        ones (`revoked_at` / `expires_at` say which). The token value is never returned: only
        `display_prefix` (the first 12 characters, `plmb_` + 7) is readable after creation.
        Session cookie only: a platform API token cannot list or mint tokens.
      security: [ { sessionCookie: [] } ]
      responses:
        '200': { description: The caller's tokens., content: { application/json: { schema: { $ref: '#/components/schemas/ApiTokenList' } } } }
        '401': { description: No live session. }
    post:
      operationId: createMyApiToken
      summary: Mint a platform API token for the caller (any authenticated user)
      description: |-
        Mints a read-only platform API token for the calling user and returns its plaintext once; it is
        never shown again. The token is accepted only by the MCP endpoint (`POST /api/v1/mcp`,
        `Authorization: Bearer plmb_...`), never by a REST route, and carries the caller's own identity:
        every MCP tool applies the same role and visibility rules as the session cookie. At most 10
        active (unrevoked, unexpired) tokens per user; past the cap the call answers 409. `scope` is
        `read` only in this version. The creation is recorded in the configuration audit log as
        `api_token` / `created`, with the token's name as label.
      security: [ { sessionCookie: [] } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ApiTokenCreateRequest' } } } }
      responses:
        '201': { description: 'The minted token, plaintext included this one time.', headers: { Cache-Control: { schema: { type: string }, description: 'Always `no-store`.' } }, content: { application/json: { schema: { $ref: '#/components/schemas/ApiTokenCreated' } } } }
        '400':
          description: 'A malformed body, an unknown field, a name absent, empty or over 100 characters, or `expires_at` not in the future; the fixed string names the problem.'
        '401': { description: No live session. }
        '409': { description: The caller already has 10 active tokens; revoke one first. }
  /me/tokens/{id}:
    delete:
      operationId: revokeMyApiToken
      summary: Revoke one of the caller's own platform API tokens (any authenticated user)
      description: |-
        Revokes one of the caller's own tokens by id: the next MCP request carrying it answers 401. An
        unknown id, another user's id and an already-revoked id all answer the same 404. The revocation
        is recorded in the configuration audit log as `api_token` / `deleted`.
      security: [ { sessionCookie: [] } ]
      parameters: [ { name: id, in: path, required: true, schema: { type: string, format: uuid } } ]
      responses:
        '204': { description: Revoked. }
        '401': { description: No live session. }
        '404':
          description: 'Unknown id, another user''s id, or an already-revoked id (indistinguishable); the body is the fixed string "token not found".'
  /users:
    get:
      operationId: getUsers
      summary: Batch user identity lookup by id, org-scoped (Member)
      description: |-
        Resolves up to 100 platform user ids to display identity (id, name, username, avatar_url), so a client holding raw owner or actor ids (issue owner, audit actor) can render them in one request. An id that is unknown or belongs to a different org is silently omitted from `items`. Email is never included. Requires Member or above.
      security:
        - sessionCookie: []
      parameters:
        - name: ids
          in: query
          required: true
          style: form
          explode: true
          schema: { type: array, items: { type: string, format: uuid }, minItems: 1, maxItems: 100 }
          description: 'Repeated `ids=<uuid>&ids=<uuid>...`, 1 to 100 entries. An id that is unknown, or belongs to a different org, is silently omitted from items.'
      responses:
        '200':
          description: The resolved identities for every requested id the caller's org actually owns.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserRefs' }
        '400': { description: '`ids` missing, empty, over 100 entries or containing a malformed uuid, or an undocumented query parameter was supplied (named in the body).' }
        '401': { description: No live session. }
        '403':
          description: 'The caller is below Member, or the provider refused the caller''s token; log in again, or the account may have been blocked.'
        '500':
          description: 'An internal failure, not caused by the request; the body is the fixed string "users request failed".'
        '503':
          description: 'The platform could not verify the session or determine the caller''s role (session store or provider unreachable). During a provider outage a GET or HEAD may still be served from a role cached before the outage (a bounded grace window, 15 minutes past the cache TTL by default); a write always answers 503.'
  /version:
    get:
      operationId: getVersion
      summary: The platform's own version and update-check status (any authenticated user)
      description: |-
        Returns this backend's build stamp (`backend_version`, `git_sha`) and the stored result of the last daily update check, so a client can show the running version and, when relevant, an outdated banner. Any authenticated user may read it; there is no minimum role. An unstamped build reports `"dev"`/`"unknown"`. `update_check` is never computed on this request; see `UpdateCheck` for its status vocabulary.
      security:
        - sessionCookie: []
      responses:
        '200':
          description: This backend's own version and update-check status.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VersionInfo' }
        '401': { description: No live session. }
        '500':
          description: 'An internal failure, not caused by the request; the body is the fixed string "unable to read update-check status".'
        '503': { description: 'The platform could not verify the session right now (the session store is unreachable).' }

  /instances:
    get:
      operationId: listInstances
      summary: The org's connected git instances (Member)
      description: |-
        Every connected git instance of the caller's org, ordered by (provider, name), with only id, provider, name and base_url: none of the token or OAuth state `GET /settings/instances` carries. `base_url` is null until an OrgAdmin configures it. Unpaginated. Requires Member or above.
      security:
        - sessionCookie: []
      responses:
        '200':
          description: The caller's org's connected git instances.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemberInstanceList' }
        '401': { description: No live session. }
        '403':
          description: 'The caller is below Member, or the provider refused the caller''s token; log in again, or the account may have been blocked.'
        '500':
          description: 'An internal failure, not caused by the request; the body is the fixed string "settings update failed".'
        '503':
          description: 'The platform could not verify the session or determine the caller''s role (session store or provider unreachable). During a provider outage a GET or HEAD may still be served from a role cached before the outage (a bounded grace window, 15 minutes past the cache TTL by default); a write always answers 503.'
  /settings/instances:
    get:
      operationId: listSettingsInstances
      summary: Instance settings list, paginated (OrgAdmin)
      description: |-
        Lists every configured git instance of the caller's org, ordered by (provider, instance), with offset pagination (`page`, `per_page`; `total` counts every match across every page). Token and OAuth state appear as metadata and boolean flags only; the token value itself is never returned. Requires OrgAdmin.
      security:
        - sessionCookie: []
      parameters:
        - { name: page, in: query, required: false, schema: { type: integer, default: 1 }, description: 'Minimum 1; values below 1 are clamped up to 1.' }
        - { name: per_page, in: query, required: false, schema: { type: integer, default: 20 }, description: 'Capped at 100; values above 100 are clamped down.' }
      responses:
        '200':
          description: One page of the caller's org's instances.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InstanceSettingsList' }
        '400': { description: 'An unknown query parameter was supplied, naming it.' }
        '401': { description: No live session. }
        '403':
          description: 'The caller is below OrgAdmin, or the provider refused the caller''s token; log in again, or the account may have been blocked.'
        '500':
          description: 'An internal failure, not caused by the request; the body is the fixed string "settings update failed".'
        '503':
          description: 'The platform could not verify the session or determine the caller''s role (session store or provider unreachable). During a provider outage a GET or HEAD may still be served from a role cached before the outage (a bounded grace window, 15 minutes past the cache TTL by default); a write always answers 503.'
    post:
      operationId: createInstance
      summary: Create a git instance (OrgAdmin)
      description: |-
        Registers a new git instance for the caller's org (provider, instance name, base_url) with no token or OAuth app configured yet; add those afterwards through the instance settings PUT endpoints. `base_url` must be a parseable absolute http(s) URL. Requires OrgAdmin.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateInstanceRequest' }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreatedID' }
        '400': { description: 'Validation failed: provider/instance/base_url empty, or base_url is not a parseable absolute http(s) URL.' }
        '401': { description: No live session. }
        '403':
          description: 'The caller is below OrgAdmin, or the provider refused the caller''s token; log in again, or the account may have been blocked.'
        '500':
          description: 'An internal failure, not caused by the request; the body is the fixed string "settings update failed".'
        '503':
          description: 'The platform could not verify the session or determine the caller''s role (session store or provider unreachable). During a provider outage a GET or HEAD may still be served from a role cached before the outage (a bounded grace window, 15 minutes past the cache TTL by default); a write always answers 503.'
        '409': { description: 'An instance with the same (org, provider, instance) already exists.' }

  /sync:
    post:
      operationId: triggerSync
      summary: Manually trigger a sync run for one instance (Maintainer)
      description: |-
        Enqueues an asynchronous sync run for `instance_id` in the caller's org; poll `GET /sync/status` or `GET /sync/history` for its progress. `instance_id` must be the instance the caller is logged into: another instance of the caller's own org answers 409 with the remedy, an unknown or foreign instance answers 404. A run already pending or running for the instance also answers 409. Requires Maintainer.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SyncTriggerRequest' }
      responses:
        '202': { description: Sync run enqueued. }
        '400': { description: Malformed request body or instance_id (not a valid uuid). }
        '401': { description: No live session. }
        '403':
          description: 'The caller is below Maintainer, or the provider refused the caller''s token; log in again, or the account may have been blocked.'
        '500':
          description: 'An internal failure, not caused by the request; the body is the fixed string "sync request failed".'
        '503':
          description: 'The platform could not verify the session or determine the caller''s role (session store or provider unreachable). During a provider outage a GET or HEAD may still be served from a role cached before the outage (a bounded grace window, 15 minutes past the cache TTL by default); a write always answers 503.'
        '404': { description: 'Unknown instance id, or an instance belonging to a different org - indistinguishable.' }
        '409': { description: 'Either a sync run is already pending or running for this instance, or instance_id belongs to the caller''s own org but is not the session''s own (login) instance - the body names which, and for the latter names the remedy (log in through the requested instance).' }

  /sync/status:
    get:
      operationId: syncStatus
      summary: Latest sync run for the caller's org (Member)
      description: |-
        The most recent sync run across all of the caller's org's instances.

        - `state` is one of `in_progress`, `completed`, or `failed`.
        - Includes counts and dates for the run.
        - When `state` is `failed`, `error` is a short provider-failure summary; it never includes credentials or other secrets.
        - Requires an authenticated session at Member level or above.
      security:
        - sessionCookie: []
      responses:
        '200':
          description: The latest sync run.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SyncStatus' }
        '401': { description: No live session. }
        '403':
          description: 'The caller is below Member, or the provider refused the caller''s token; log in again, or the account may have been blocked.'
        '500':
          description: 'An internal failure, not caused by the request; the body is the fixed string "sync request failed".'
        '503':
          description: 'The platform could not verify the session or determine the caller''s role (session store or provider unreachable). During a provider outage a GET or HEAD may still be served from a role cached before the outage (a bounded grace window, 15 minutes past the cache TTL by default); a write always answers 503.'
        '404': { description: No sync run has ever been recorded for this org. }

  /sync/history:
    get:
      operationId: syncHistory
      summary: Sync run history for the caller's org, newest first, paginated (Member)
      description: |-
        Every sync run for the caller's org, newest first (`started_at` descending, `id` as tiebreak), with the same per-row shape as `GET /sync/status`; a failed run's `error` is a short summary that never includes credentials. Offset pagination with `page` and `per_page`; `total` counts every run. The former `limit` parameter is no longer accepted and answers 400. Requires Member or above.
      security:
        - sessionCookie: []
      parameters:
        - { name: page, in: query, required: false, schema: { type: integer, default: 1 }, description: 'Minimum 1; values below 1 are clamped up to 1.' }
        - { name: per_page, in: query, required: false, schema: { type: integer, default: 20 }, description: 'Capped at 100; values above 100 are clamped down.' }
      responses:
        '200':
          description: One page of the org's sync run history, newest first.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SyncStatusList' }
        '400': { description: 'An unknown query parameter was supplied, naming it (including the removed `limit`).' }
        '401': { description: No live session. }
        '403':
          description: 'The caller is below Member, or the provider refused the caller''s token; log in again, or the account may have been blocked.'
        '500':
          description: 'An internal failure, not caused by the request; the body is the fixed string "sync request failed".'
        '503':
          description: 'The platform could not verify the session or determine the caller''s role (session store or provider unreachable). During a provider outage a GET or HEAD may still be served from a role cached before the outage (a bounded grace window, 15 minutes past the cache TTL by default); a write always answers 503.'
  /projects:
    get:
      operationId: listProjects
      summary: Visibility-filtered asset inventory, keyset-paginated (Member)
      description: |-
        The project inventory of the git instance the caller is logged into, filtered to what the caller can see on the provider. By default only live, unarchived projects are listed (the same population as `GET /overview`); `archived=true` and `provider_deleted=true` each opt their own population back in.

        Keyset pagination: `after` is the opaque cursor from a previous response's `next_cursor` (never parse it); `per_page` defaults to 20 and is capped at 100; `total` counts every visible row matching every filter, across every page. A malformed `after` answers 400; a cursor minted under a different `sort`/`order` restarts from the first page of the requested sort instead of erroring.

        Sort: `sort` picks the key (default `path`), `order` the direction (default `asc`), `id` ascending is always the final tiebreak.
        - `path`: by `project_path`.
        - `score_points`: by the displayed score; a project with no scored run sorts last regardless of `order`.
        - `component_ref`: by the pinned component reference as a version: semver refs by semver precedence (`1.2.10` after `1.2.9`), non-semver refs after them (by string), an empty ref last.
        - `last_activity_at`: by the row's own timestamp; a null value sorts last.
        - `worst_branch_score`: by `worst_live_branch_score_points`; a project with no live scorable branch sorts last. It is independent of the displayed score.

        Filters combine: every parameter narrows the page and `total`; a repeated parameter OR-s its values. Each parameter below describes its own matching. Requires Member or above.
      security:
        - sessionCookie: []
      parameters:
        - name: deployment_status
          in: query
          required: false
          style: form
          explode: true
          schema: { type: array, items: { $ref: '#/components/schemas/DeploymentStatus' } }
          description: 'Optional multi-value filter: repeated `deployment_status=<value>&deployment_status=<value>...`, each value from the DeploymentStatus vocabulary, multiple values OR-ed together. Omitted means no filter.'
        - name: freshness
          in: query
          required: false
          style: form
          explode: true
          schema: { type: array, items: { $ref: '#/components/schemas/Freshness' } }
          description: 'Optional multi-value filter, the same repeated shape as deployment_status: `freshness=<value>&freshness=<value>...`, each value from the Freshness vocabulary, multiple values OR-ed together. Omitted means no filter.'
        - name: version_check
          in: query
          required: false
          style: form
          explode: true
          schema: { type: array, items: { $ref: '#/components/schemas/VersionCheck' } }
          description: 'Optional multi-value filter, the same repeated shape as deployment_status: `version_check=<value>&version_check=<value>...`, each value from the VersionCheck vocabulary, multiple values OR-ed together. It narrows on the project''s stored version_check outcome, so `per_page=1&version_check=skipped` gives the fleet count in `total`. A project that pins no component matches no value. Omitted means no filter.'
        - name: coverage
          in: query
          required: false
          schema: { $ref: '#/components/schemas/CoverageState' }
          description: 'Filter rows by derived coverage state.'
        - name: archived
          in: query
          required: false
          schema: { type: boolean, default: false }
          description: 'Defaults to false: archived rows are excluded (the same population GET /overview uses). true opts them back in, independently of provider_deleted; a row returned this way still carries its own archived/provider_deleted flags. Any value other than "true" or "false" is a 400.'
        - name: provider_deleted
          in: query
          required: false
          schema: { type: boolean, default: false }
          description: 'Defaults to false: provider-deleted rows are excluded (the same population GET /overview uses). true opts them back in, independently of archived; a row returned this way still carries its own archived/provider_deleted flags. Any value other than "true" or "false" is a 400.'
        - name: q
          in: query
          required: false
          schema: { type: string }
          description: 'Case-insensitive literal substring match against the project path or the project''s display name (the `name` field of the response): trimmed, % and _ match literally, a multi-word phrase matches only as an exact substring. A row matching on either is returned and `total` counts the same population. A project with an empty `name` matches on its path only.'
        - name: policy_id
          in: query
          required: false
          schema: { type: string, format: uuid }
          description: 'Projects this policy governs: direct assignment, reached through a portfolio the policy is attached to (explicit membership or a group: rule), or, when the policy applies to all, every live project of the org within its scope filter whatever its deployment status; archived and provider-deleted projects excluded. Coverage, the stale and no-result counts and licence seats still count onboarded projects only. The same set policy_ids on each row lists.'
        - { name: portfolio_id, in: query, required: false, schema: { type: string, format: uuid }, description: 'Projects in the portfolio''s resolved membership (explicit membership or a group: rule prefix match), the same set portfolio_ids on each row is drawn from.' }
        - { name: language, in: query, required: false, schema: { type: string }, description: 'Matches a key of the row''s languages map, case-insensitively. A row with no languages collected yet never matches.' }
        - { name: last_active_since, in: query, required: false, schema: { type: string, format: date }, description: 'Inclusive lower bound on last_activity_at (UTC calendar date). A row with no last_activity_at is excluded.' }
        - { name: last_active_before, in: query, required: false, schema: { type: string, format: date }, description: 'Inclusive upper bound on last_activity_at (UTC calendar date). A row with no last_activity_at is excluded.' }
        - { name: created_since, in: query, required: false, schema: { type: string, format: date }, description: 'Inclusive lower bound on provider_created_at, the project''s creation date on its git provider (UTC calendar date). A row whose creation date is not known yet is excluded.' }
        - { name: created_before, in: query, required: false, schema: { type: string, format: date }, description: 'Inclusive upper bound on provider_created_at, the project''s creation date on its git provider (UTC calendar date). A row whose creation date is not known yet is excluded.' }
        - { name: has_onboarding_error, in: query, required: false, schema: { type: boolean }, description: 'Tri-state filter on whether the row carries a stored last_onboarding_error. Omitted means no filter; true keeps only projects that have one; false keeps only projects that do not. Any other value is a 400.' }
        - { name: is_component_repo, in: query, required: false, schema: { type: boolean }, description: 'Optional filter on the row''s is_component_repo flag. Omitted means no filter. Any value other than "true" or "false" is a 400.' }
        - { name: official_component_repo, in: query, required: false, schema: { type: boolean }, description: 'Optional filter on the row''s official_component_repo flag, independent of is_component_repo. Omitted means no filter. Any value other than "true" or "false" is a 400.' }
        - { name: path_prefix, in: query, required: false, schema: { type: string }, description: 'Segment-anchored path filter: matches a project_path equal to, or nested under, this prefix at a full path-segment boundary (bigtech never matches bigtech-500/...).' }
        - { name: direct_children_only, in: query, required: false, schema: { type: boolean }, description: 'Requires path_prefix; narrows to projects exactly one path segment below it. Supplied without path_prefix, answers 400 naming the dependency.' }
        - name: sort
          in: query
          required: false
          schema: { type: string, enum: [score_points, component_ref, path, last_activity_at, worst_branch_score], default: path }
          description: 'Sort key for the keyset walk; defaults to path. See the operation description for the per-key semantics.'
        - { name: order, in: query, required: false, schema: { type: string, enum: [asc, desc], default: asc }, description: 'Sort direction, paired with sort. Defaults to asc.' }
        - { name: per_page, in: query, required: false, schema: { type: integer, default: 20 }, description: 'Capped at 100; values above 100 clamp down; zero, negative, or malformed values fall back to the default (20).' }
        - name: after
          in: query
          required: false
          schema: { type: string }
          description: 'Opaque cursor from a previous response''s next_cursor; never parse it. Omitted means the first page. A malformed value is a 400; a well-formed value minted under a different sort/order restarts from the first page of the requested sort instead of erroring.'
      responses:
        '200':
          description: One page of the caller's visible slice of the org's asset inventory.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InventoryList' }
        '400': { description: 'A deployment_status, freshness, version_check, coverage, sort or order value outside its vocabulary; archived, provider_deleted, has_onboarding_error, is_component_repo or official_component_repo not "true" or "false"; direct_children_only without path_prefix; a malformed policy_id, portfolio_id, date bound or after cursor (a mismatched sort/order is not an error); or an undocumented query parameter (named in the body).' }
        '401': { description: No live session. }
        '403':
          description: 'The caller is below Member, or the provider refused the caller''s token; log in again, or the account may have been blocked.'
        '500':
          description: 'An internal failure, not caused by the request; the body is the fixed string "sync request failed".'
        '503':
          description: 'The platform could not verify the session, determine the caller''s role, or resolve the caller''s visible project set (session store or provider unreachable). During a provider outage a GET or HEAD may still be served from a role cached before the outage (a bounded grace window, 15 minutes past the cache TTL by default); a write always answers 503.'
  /projects/ids:
    get:
      operationId: listProjectIds
      summary: Lean id and path projection of the inventory (Member)
      description: |-
        The lean projection of `listProjects`: `{id, path}` rows only, ordered by path ascending, for draining every project id that matches a filter. Same scope, same default population, same filters with identical meaning and validation, same visibility filtering and the same `total` as `listProjects` for the same filters. Keyset pagination with the same opaque `after` cursor; `per_page` defaults to 100 and is capped at 1000. There is no `sort` or `order` parameter; supplying one answers 400. Requires Member or above.
      security:
