openapi: 3.1.0
info:
  title: Plumber Platform API (v0 draft)
  version: 0.0.1-draft
  description: |-
    Contract for the Plumber Platform control plane.

    **Proposal notice**: only the core vocabulary is frozen. Everything else below (paths, casing, envelope field names, pagination params) is a proposal and may change before v1 of this API; do not treat a path or field name here as settled unless it is called out as frozen.

    - Frozen: the three status-dimension field names (`deployment_status`, `freshness`, issue `status`) and their exact state strings.
    - Frozen: the push-shape principles (`results[]` one-per-policy, `score{letter, points}` with SIGNED points, `effective_config` per result, `collection.collected_at`).
    - Frozen: the bare word "status" is reserved for the issue dimension, hence the SSE event is `project.update`, NOT `project.status`.

    **Guarantees** this contract keeps:

    - Never a false verdict: a degraded or missing collection surfaces an honest state, never a fabricated score.
    - Forward-tolerant: unknown fields in a request are ignored, and newer schema versions are accepted.
servers:
  - url: https://{instance}/api/v1
    variables:
      instance:
        default: plumber.example.com
security:
  - ciOIDC: []

paths:
  /pushes:
    post:
      operationId: createPush
      summary: Ingest a CLI analysis result (one push carries all policies' results for one run)
      description: |-
        The CLI pushes at end of job, authenticated by native CI OIDC. Project identity is taken from the VERIFIED OIDC claims (repo claim = attribution / anti-spoof), never from the body.

        The server, in order:

        - Verifies OIDC.
        - Applies an idempotency guard (job id) and an ordering guard (pipeline id + timestamps; the displayed result never regresses).
        - Accepts each policy score.
        - Updates freshness.
        - Emits an SSE `project.update` event.

        **Forward-tolerant**: unknown fields are ignored.
      security:
        - ciOIDC: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Push' }
      responses:
        '201':
          description: Ingested (new run) - freshness updated, SSE emitted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PushAccepted' }
        '200':
          description: Idempotent replay (same job id) - upserted, no duplicate, no regression.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PushAccepted' }
        '202':
          description: >
            Accepted but recorded as out-of-order (an older pipeline landed after a newer one):
            stored in history, the displayed result does NOT regress.
        '401':
          description: OIDC verification failed (missing/invalid token, wrong aud, unknown issuer). Project state unchanged.
        '422':
          description: Envelope invalid (missing schema_version, empty results) - see forward-tolerance rules.

  /projects/{project_path}/context:
    get:
      operationId: getProjectContext
      summary: Resolved policy set + data collection snapshot for a project (one call, at analysis time)
      description: |-
        Served to the CLI (Bearer OIDC). One call returns the resolved policy set plus the data collection snapshot the CLI needs to evaluate certain controls.

        - The resolved policy set is never empty (falls back to [Plumber default]).
        - `snapshot.data` holds the collected project settings (branch protection, MR approval rules, CI variables) and MAY include `merged_yaml`, the resolved CI configuration, with an optional authoritative override from the CLI.
        - `snapshot.collected_at` says when the data collection snapshot was collected; it may be a cached read rather than a live call to the provider.
        - An authed project ALWAYS gets 200: even with no prior activity for that project, the response is the derived [Plumber default]. There is no 404 for the OIDC-attributed project.
      security:
        - ciOIDC: []
      parameters:
        - { name: project_path, in: path, required: true, schema: { type: string }, description: 'Provider project path or opaque id (proposal).' }
      responses:
        '200':
          description: Resolved context (never empty; falls back to [Plumber default] when no config is assigned yet).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectContext' }
        '401': { description: OIDC verification failed. }

  /events:
    get:
      operationId: streamEvents
      summary: Server-Sent Events stream (one per client; client-side filtering)
      description: |-
        SSE stream. One stream per client; the client filters.

        - Event name is `project.update`, NOT `project.status`.
        - Supports `Last-Event-ID` on reconnect; the server sends heartbeats.
        - Response body is `text/event-stream`; the data payload of each event conforms to `ProjectUpdateEvent`.
      parameters:
        - { name: Last-Event-ID, in: header, required: false, schema: { type: string } }
      responses:
        '200':
          description: Event stream.
          content:
            text/event-stream:
              schema: { $ref: '#/components/schemas/ProjectUpdateEvent' }

  /badge/{project_path}:
    get:
      operationId: getProjectBadge
      summary: Public score badge (SVG) - provider-integrating output, OFF by default
      description: |-
        Serves the project's score badge (grade A-E).

        - Provider-integrating outputs are OFF by default and must be explicitly enabled.
        - The default badge reflects the score-bearing ref (default branch).
        - Honest states: a stale/failed/no-result freshness is reflected, never a fabricated grade.
      security: []  # public when enabled
      parameters:
        - { name: project_path, in: path, required: true, schema: { type: string } }
        - { name: branch, in: query, required: false, schema: { type: string }, description: 'Optional ref; defaults to the score-bearing ref.' }
        - { name: style, in: query, required: false, schema: { type: string }, description: 'Badge style (proposal).' }
      responses:
        '200':
          description: SVG badge.
          content:
            image/svg+xml: { schema: { type: string } }
        '404': { description: No public badge (disabled or project not integrated). }

  /openapi.yaml:
    get:
      operationId: getOpenApiSpec
      summary: Serve this OpenAPI contract itself (Member-gated, raw YAML)
      description: |-
        Returns this OpenAPI contract verbatim as YAML. Requires an authenticated session at Member level.

        - Response headers include `X-Content-Type-Options: nosniff`, so the response is treated as data, never as HTML.
      security:
        - sessionCookie: []
      responses:
        '200':
          description: The OpenAPI contract, verbatim.
          content:
            application/yaml:
              schema: { type: string }
        '401': { description: No live session. }
        '403': { description: Session role below Member. }

  /settings/instances:
    get:
      operationId: listSettingsInstances
      summary: OrgAdmin instance settings list (org-token + OAuth-app state, never secret material)
      description: |-
        Lists every configured git instance scoped to the caller's own org.

        - Token/OAuth state is surfaced as metadata and boolean flags only (e.g. token configured, kind api, expires 2027-01-31); the token value itself is never returned.
        - Requires an authenticated session at OrgAdmin level.
      security:
        - sessionCookie: []
      responses:
        '200':
          description: The caller's org's instances.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/InstanceSettings' }
        '401': { description: No live session. }
        '403': { description: Session role below OrgAdmin. }
    post:
      operationId: createInstance
      summary: Create a git instance (OrgAdmin)
      description: |-
        Registers a new git instance scoped to the caller's own org: provider, instance name, and base_url, with no token or OAuth app configured yet (added afterwards via the two PUT endpoints above).

        - `base_url` MUST be a parseable absolute http(s) URL; this is a scheme/format check only, not a private-range or SSRF check.
        - Requires an authenticated session at OrgAdmin level.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateInstanceRequest' }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreatedID' }
        '400': { description: 'Validation failed: provider/instance/base_url empty, or base_url is not a parseable absolute http(s) URL.' }
        '401': { description: No live session. }
        '403': { description: Session role below OrgAdmin. }
        '409': { description: 'An instance with the same (org, provider, instance) already exists.' }

  /sync:
    post:
      operationId: triggerSync
      summary: Manually trigger a sync run for one instance (Maintainer)
      description: |-
        Triggers an asynchronous sync run for the given `instance_id`, scoped to the caller's own org. Poll `GET /sync/status` or `GET /sync/history` for its progress.

        - `instance_id` must belong to the caller's org (404 otherwise; unknown and foreign-org instances are indistinguishable).
        - A run already pending or running for this instance answers 409 rather than queuing a second concurrent run.
        - Requires an authenticated session at Maintainer level.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SyncTriggerRequest' }
      responses:
        '202': { description: Sync run enqueued. }
        '400': { description: Malformed request body or instance_id (not a valid uuid). }
        '401': { description: No live session. }
        '403': { description: Session role below Maintainer. }
        '404': { description: Unknown instance id, or an instance belonging to a different org. }
        '409': { description: A sync run is already pending or running for this instance. }

  /sync/status:
    get:
      operationId: syncStatus
      summary: Latest sync run for the caller's org (Member)
      description: |-
        The most recent sync run across all of the caller's org's instances.

        - `state` is one of `in_progress`, `completed`, or `failed`.
        - Includes counts and dates for the run.
        - When `state` is `failed`, `error` is a short provider-failure summary; it never includes credentials or other secrets.
        - Requires an authenticated session at Member level or above.
      security:
        - sessionCookie: []
      responses:
        '200':
          description: The latest sync run.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SyncStatus' }
        '401': { description: No live session. }
        '403': { description: Session role below Member. }
        '404': { description: No sync run has ever been recorded for this org. }

  /sync/history:
    get:
      operationId: syncHistory
      summary: Sync run history for the caller's org (Member)
      description: |-
        Every sync run for the caller's org, newest first, capped by `limit` (default 20).

        - Same response shape as `GET /sync/status`; when a run's `state` is `failed`, `error` is a short provider-failure summary and never includes credentials or other secrets.
        - Requires an authenticated session at Member level or above.
      security:
        - sessionCookie: []
      parameters:
        - { name: limit, in: query, required: false, schema: { type: integer, default: 20 }, description: 'Max rows returned (proposal).' }
      responses:
        '200':
          description: The org's sync run history, newest first.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/SyncStatus' }
        '401': { description: No live session. }
        '403': { description: Session role below Member. }

  /projects:
    get:
      operationId: listProjects
      summary: Visibility-filtered asset inventory (Member)
      description: |-
        The caller's org's discovered asset inventory, filtered to what the requesting user can see on the provider: a project the caller cannot read on the provider is never returned here, even though this is otherwise an org-wide resource.

        - Requires an authenticated session at Member level or above.
      security:
        - sessionCookie: []
      parameters:
        - { name: deployment_status, in: query, required: false, schema: { $ref: '#/components/schemas/DeploymentStatus' }, description: 'Optional exact-match filter.' }
      responses:
        '200':
          description: The caller's visible slice of the org's asset inventory.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/InventoryProject' }
        '400': { description: 'deployment_status is not one of the frozen vocabulary values.' }
        '401': { description: No live session. }
        '403': { description: Session role below Member. }

  /settings/instances/{id}/token:
    put:
      operationId: updateInstanceToken
      summary: Rotate an instance's org (analysis) token - validate first, then store (OrgAdmin only)
      description: |-
        The candidate token is validated with a test call against the git host BEFORE anything is stored.

        - Insufficient scope or an invalid/expired candidate fails validation naming what is wrong; the previously active token is left untouched (no partial switch).
        - On success the token is stored and never displayed again.
        - `{id}` must belong to the caller's own org (404 otherwise, same surface as "does not exist", never leaking cross-org existence).
      security:
        - sessionCookie: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateInstanceTokenRequest' }
      responses:
        '204': { description: Validated and stored; the prior token (if any) is replaced. }
        '400': { description: 'Candidate rejected: invalid/expired, or insufficient scope (message names the missing scope, e.g. "api or read_api").' }
        '401': { description: No live session. }
        '403': { description: Session role below OrgAdmin. }
        '404': { description: Unknown instance id, or an instance belonging to a different org. }
        '409': { description: 'Instance has no base_url configured yet (base_url is set via the oauth-app endpoint above; a token cannot be validated against an unknown host).' }
        '502': { description: 'Validation unavailable: the git host could not be reached, or answered with something other than a clear accept/reject.' }

  /settings/instances/{id}/oauth-app:
    put:
      operationId: updateInstanceOAuthApp
      summary: Configure an instance's per-instance OAuth app (OrgAdmin only)
      description: |-
        Stores the admin-entered OAuth app `client_id`, `client_secret` (never echoed back after this write), and `base_url`.

        - The base URL never comes from a caller again after this write.
        - `{id}` must belong to the caller's own org (404 otherwise).
      security:
        - sessionCookie: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateInstanceOAuthAppRequest' }
      responses:
        '204': { description: Stored. }
        '400': { description: Malformed request body. }
        '401': { description: No live session. }
        '403': { description: Session role below OrgAdmin. }
        '404': { description: Unknown instance id, or an instance belonging to a different org. }

  /config/policies:
    get:
      operationId: listPolicies
      summary: List the caller's org's policies (metadata + counts, proposal)
      description: |-
        Every policy defined for the caller's org.

        - [Plumber default] is never in this list: it is derived, report-only, never persisted, not editable.
        - Requires an authenticated session at Member level or above.
      security:
        - sessionCookie: []
      responses:
        '200':
          description: The caller's org's policies.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PolicySummary' }
        '401': { description: No live session. }
        '403': { description: Session role below Member. }
    post:
      operationId: createPolicy
      summary: Create a policy (metadata only - content and assignments are separate calls)
      description: |-
        Creates a policy with no requirements/controls and no assignments yet (added afterwards via `policies/{id}/content` and `policies/{id}/assignments`).

        - `name` is mandatory, non-empty.
        - `color` defaults server-side (#3b82f6) when omitted or empty.
        - `enforcement` must be `block` or `report`.
        - A create never marks anything stale: nothing is assigned to it yet, so there is no downstream effect.
        - Requires an authenticated session at Maintainer level.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PolicyMetaRequest' }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreatedID' }
        '400': { description: 'Validation failed, naming the field (e.g. "name is required", "enforcement must be block or report").' }
        '401': { description: No live session. }
        '403': { description: Session role below Maintainer. }

  /config/policies/{id}:
    get:
      operationId: getPolicy
      summary: Full policy detail - metadata, requirements/controls, and assignments
      description: |-
        `{id}` must belong to the caller's own org (404 otherwise; unknown ids and ids belonging to a different org are indistinguishable).

        - Requires Member level or above.
      security:
        - sessionCookie: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Full policy detail.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PolicyDetail' }
        '400': { description: Malformed policy id (not a valid uuid). }
        '401': { description: No live session. }
        '403': { description: Session role below Member. }
        '404': { description: Unknown policy id, or a policy belonging to a different org. }
    put:
      operationId: updatePolicyMeta
      summary: Update a policy's metadata (name, description, color, enforcement)
      description: |-
        Metadata only; requirements/controls and assignments have their own PUT endpoints below.

        - A successful update marks every currently-assigned project stale and emits `project.update` for each.
        - Last-save-wins: concurrent edits are not merged, the most recent write wins.
        - Requires Maintainer.
      security:
        - sessionCookie: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PolicyMetaRequest' }
      responses:
        '204': { description: Updated; affected projects staled, project.update emitted for each. }
        '400': { description: 'Validation failed, naming the field.' }
        '401': { description: No live session. }
        '403': { description: Session role below Maintainer. }
        '404': { description: Unknown policy id, or a policy belonging to a different org. }
    delete:
      operationId: deletePolicy
      summary: Delete a policy (cascades its requirements, controls, and assignments)
      description: |-
        The affected set is captured before the cascade: every project that was assigned this policy, directly or via a portfolio, goes stale.

        - Requires Maintainer.
      security:
        - sessionCookie: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Deleted; affected projects staled, project.update emitted for each. }
        '400': { description: Malformed policy id (not a valid uuid). }
        '401': { description: No live session. }
        '403': { description: Session role below Maintainer. }
        '404': { description: Unknown policy id, or a policy belonging to a different org. }

  /config/policies/{id}/content:
    put:
      operationId: replacePolicyContent
      summary: Full replace of a policy's requirements and controls (whole form)
      description: |-
        The request body is the complete desired state, never a diff; the replace is atomic.

        - Position is derived from array order for both requirements and controls, never a caller-supplied index.
        - `control.config` must be valid JSON.
        - Control TYPE existence is NOT validated.
        - A successful replace marks every currently-assigned project stale: content changed, so every project this policy already covers must re-run.
        - Requires Maintainer.
      security:
        - sessionCookie: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PolicyContentRequest' }
      responses:
        '204': { description: Replaced; affected projects staled, project.update emitted for each. }
        '400': { description: 'Validation failed, naming the field (e.g. a requirement with an empty name, or a control with malformed config).' }
        '401': { description: No live session. }
        '403': { description: Session role below Maintainer. }
        '404': { description: Unknown policy id, or a policy belonging to a different org. }

  /config/policies/{id}/assignments:
    put:
      operationId: replacePolicyAssignments
      summary: Full-set replace of a policy's project and portfolio assignments
      description: |-
        The request body is the complete desired assignment set, never a diff.

        - Both directions, entering and leaving, go stale; the caller never computes the diff itself.
        - Requires Maintainer.
      security:
        - sessionCookie: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PolicyAssignments' }
      responses:
        '204': { description: Replaced; the union of entering and leaving projects staled, project.update emitted for each. }
        '400': { description: 'Validation failed (e.g. a malformed project or portfolio id).' }
        '401': { description: No live session. }
        '403': { description: Session role below Maintainer. }
        '404': { description: Unknown policy id, or a policy belonging to a different org. }
        '409': { description: 'A referenced project_id or portfolio_id belongs to a different org than the policy. No partial write; the whole replace rolls back.' }

  /config/portfolios:
    get:
      operationId: listPortfolios
      summary: List the caller's org's portfolios (metadata + counts, proposal)
      description: |-
        Every portfolio defined for the caller's org.

        - Requires Member level or above.
      security:
        - sessionCookie: []
      responses:
        '200':
          description: The caller's org's portfolios.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PortfolioSummary' }
        '401': { description: No live session. }
        '403': { description: Session role below Member. }
    post:
      operationId: createPortfolio
      summary: Create a portfolio (metadata only - members and rules are separate calls)
      description: |-
        Creates an empty portfolio (no explicit members, no group: rules yet).

        - `name` is mandatory, non-empty.
        - `color` defaults server-side (#10b981) when omitted or empty.
        - Requires Maintainer.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PortfolioMetaRequest' }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreatedID' }
        '400': { description: 'Validation failed, naming the field (e.g. "name is required").' }
        '401': { description: No live session. }
        '403': { description: Session role below Maintainer. }

  /config/portfolios/{id}:
    get:
      operationId: getPortfolio
      summary: Full portfolio detail - metadata, members, group rules, and the resolved-project preview
      description: |-
        `resolved_projects` is the live preview: explicit members UNION every project matching a group: rule, computed at read time.

        - `{id}` must belong to the caller's own org (404 otherwise).
        - Requires Member level or above.
      security:
        - sessionCookie: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Full portfolio detail.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PortfolioDetail' }
        '400': { description: Malformed portfolio id (not a valid uuid). }
        '401': { description: No live session. }
        '403': { description: Session role below Member. }
        '404': { description: Unknown portfolio id, or a portfolio belonging to a different org. }
    put:
      operationId: updatePortfolioMeta
      summary: Update a portfolio's metadata (name, color)
      description: |-
        Metadata only; members and rules have their own PUT endpoints below.

        - Every config edit marks every project the portfolio currently resolves to (explicit members UNION group: rule matches) stale and emits `project.update` for each, same as policy metadata updates. Name/color changes are no exception.
        - Last-save-wins: concurrent edits are not merged, the most recent write wins.
        - Requires Maintainer.
      security:
        - sessionCookie: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PortfolioMetaRequest' }
      responses:
        '204': { description: Updated; affected projects staled, project.update emitted for each. }
        '400': { description: 'Validation failed, naming the field.' }
        '401': { description: No live session. }
        '403': { description: Session role below Maintainer. }
        '404': { description: Unknown portfolio id, or a portfolio belonging to a different org. }
    delete:
      operationId: deletePortfolio
      summary: Delete a portfolio (projects stay onboarded; policy links through it dissolve)
      description: |-
        Deleting a portfolio never touches the projects that were its members: they stay onboarded.

        - The affected set is captured before the cascade: every project that lost policy coverage because it resolved through this portfolio goes stale.
        - Requires Maintainer.
      security:
        - sessionCookie: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Deleted; affected projects staled, project.update emitted for each. }
        '400': { description: Malformed portfolio id (not a valid uuid). }
        '401': { description: No live session. }
        '403': { description: Session role below Maintainer. }
        '404': { description: Unknown portfolio id, or a portfolio belonging to a different org. }

  /config/portfolios/{id}/members:
    put:
      operationId: replacePortfolioMembers
      summary: Full-set replace of a portfolio's explicit member projects
      description: |-
        The request body is the complete desired member set, never a diff.

        - Both directions, entering and leaving, go stale (group: rule matches are unaffected by this call and stay resolved independently).
        - Requires Maintainer.
      security:
        - sessionCookie: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PortfolioMembersRequest' }
      responses:
        '204': { description: Replaced; the union of entering and leaving projects staled, project.update emitted for each. }
        '400': { description: 'Validation failed (e.g. a malformed project id).' }
        '401': { description: No live session. }
        '403': { description: Session role below Maintainer. }
        '404': { description: Unknown portfolio id, or a portfolio belonging to a different org. }
        '409': { description: 'A referenced project_id belongs to a different org than the portfolio. No partial write; the whole replace rolls back.' }

  /config/portfolios/{id}/rules:
    put:
      operationId: replacePortfolioRules
      summary: "Full-set replace of a portfolio's group: path rules"
      description: |-
        A rule is a group path prefix (e.g. `team-a`), not a reference to a group object. A project belongs if its path equals the rule or sits under it: `team-a` matches `team-a/api` and `team-a/sub/web`, but never `team-alpha`. Matching is dynamic: projects that later appear under the path join automatically.

        - A path with a typo is accepted and simply matches nothing.
        - Rules track the path string, not the group's identity: if a group is renamed on the provider, the rule stops matching until it is updated to the new path.
        - The request body is the complete desired rule set, never a diff.
        - Both directions, entering and leaving, go stale (explicit members are unaffected by this call).
        - Duplicate `group_path` values collapse rather than causing an error.
        - Requires Maintainer.
      security:
        - sessionCookie: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PortfolioRulesRequest' }
      responses:
        '204': { description: Replaced; the union of entering and leaving projects staled, project.update emitted for each. }
        '400': { description: 'Validation failed (e.g. an empty group_path).' }
        '401': { description: No live session. }
        '403': { description: Session role below Maintainer. }
        '404': { description: Unknown portfolio id, or a portfolio belonging to a different org. }

components:
  securitySchemes:
    ciOIDC:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |-
        Native CI OIDC id_token (GitLab id_tokens / GitHub id-token: write).

        - Verified per provider/instance: JWKS signature, aud, and accepted issuer (configured per instance, never hardcoded), plus project identity claims (repo claim = attribution/anti-spoof).
        - Multiple identity providers are supported.
        - Token lifetimes differ by provider (GitLab 3600s vs GitHub 300s).
    sessionCookie:
      type: apiKey
      in: cookie
      name: plumber_session
      description: |-
        Browser session cookie, set by the OAuth login callback.

        - RBAC-gated endpoints additionally require a minimum role; the settings endpoints here require OrgAdmin.
        - This is enforced server-side, not expressible as an OpenAPI scope.

  schemas:
    Push:
      type: object
      required: [schema_version, provider, instance, project, ref, pipeline, results]
      properties:
        schema_version: { type: integer, minimum: 1, description: 'Ingestion-contract version (>=1). Newer accepted (forward-tolerant).' }
        provider: { type: string, description: 'e.g. gitlab | github (proposal). Body is informational for identity; OIDC claims are authoritative.' }
        instance: { type: string, description: 'e.g. gitlab.com (proposal).' }
        project:
          type: object
          properties:
            path: { type: string }
            id: { type: string, description: 'Stable provider id (survives renames).' }
        ref:
          type: object
          properties:
            branch: { type: string }
            tag: { type: string }
            sha: { type: string }
        pipeline:
          type: object
          description: 'Drives the idempotency guard (job_id) and ordering guard (id + timestamps).'
          properties:
            id: { type: string }
            job_id: { type: string }
        cli:
          type: object
          properties:
            version: { type: string }
            component_version: { type: string }
        collection: { $ref: '#/components/schemas/CollectionMeta' }
        results:
          type: array
          description: 'One entry PER POLICY (multi-policy coexistence). Never a merged policy.'
          items: { $ref: '#/components/schemas/PolicyResult' }
    PolicyResult:
      type: object
      required: [policy, findings]
      properties:
        policy: { type: string, description: 'Policy identifier (proposal). [Plumber default] is report-only, never persisted.' }
        effective_config:
          type: object
          description: 'What the CLI actually ran for this policy.'
        findings:
          type: array
          items: { $ref: '#/components/schemas/Finding' }
        score:
          allOf:
            - $ref: '#/components/schemas/Score'
          description: "The CLI's pushed score, used as the policy's score."
    Finding:
      type: object
      required: [control, status]
      properties:
        control: { type: string }
        version: { type: string, description: 'Control version; weights and points live in the versioned control definition.' }
        requirement: { type: string }
        status:
          type: string
          enum: [pass, fail, not_evaluable]
          description: |-
            Finding OUTCOME (the enum is `pass | fail | not_evaluable`).

            - `not_evaluable` is EXPLICIT for degraded/silent controls, never omitted: it contributes zero points and is excluded from the denominator, and never closes its issue.
            - There is NO per-control fail-mode dial: degraded is single and non-configurable.
            - Enforcement (`block | report`) lives on the policy, not the finding.
        data:
          type: object
          description: 'Control-specific payload plus canonical fields (code/severity/message/job/file/line/url). Unknown keys are kept raw rather than dropped.'
    Score:
      type: object
      required: [letter, points]
      properties:
        letter: { type: string, description: 'Grade A-E. "Compliance %" does not exist in v2.', examples: [A, B, C, D, E] }
        points: { type: integer, description: 'SIGNED: negative values are kept, with no clamping at ingestion or storage. Any zero-floor is applied only for display.' }
    CollectionMeta:
      type: object
      description: 'Honest degradation signal.'
      properties:
        degraded: { type: boolean }
        snapshot_collected_at: { type: string, format: date-time, description: 'collected_at of the data collection snapshot the CLI consumed (a cached value, not a live read from the provider).' }
        missing_fields: { type: array, items: { type: string } }
    PushAccepted:
      type: object
      properties:
        project: { type: string }
        freshness: { $ref: '#/components/schemas/Freshness' }
        global_score:
          allOf: [ { $ref: '#/components/schemas/Score' } ]
          description: 'Average of the policies'' points. Display/aggregation only, never used for enforcement.'
        recomputed: { type: boolean, description: 'Whether the platform recomputed the score from the pushed findings; false means the pushed score was used as-is.' }
    Policy:
      type: object
      required: [name, enforcement]
      properties:
        name: { type: string, description: 'Policy identifier/display name. [Plumber default] is the derived, report-only fallback: never persisted, not deletable.' }
        enforcement:
          type: string
          enum: [block, report]
          description: 'Enforcement dial: block or report. There is NO fail_mode field: degraded controls are single and non-configurable (see Finding.status).'
    ProjectContext:
      type: object
      required: [schema_version, project, policies, snapshot]
      properties:
        schema_version: { type: integer }
        project: { type: string, description: 'Resolved project path (matches the {project_path} route parameter).' }
        policies:
          type: array
          description: 'Resolved policy set - NEVER empty (falls back to [Plumber default], report-only).'
          items: { $ref: '#/components/schemas/Policy' }
        snapshot:
          type: object
          properties:
            collected_at: { type: string, format: date-time }
            data:
              type: object
              description: 'The collected project settings: branch protection rules, MR approval rules, CI variables. MAY include `merged_yaml`, the resolved CI configuration, with an optional authoritative override from the CLI.'
              properties:
                branch_protection: { type: object }
                mr_approvals: { type: object }
                variables: { type: object }
                merged_yaml: { type: string, nullable: true }
    ProjectUpdateEvent:
      type: object
      description: 'Payload of the `project.update` SSE event. NOT `project.status`.'
      required: [project]
      properties:
        project: { type: string }
        deployment_status: { $ref: '#/components/schemas/DeploymentStatus' }
        freshness: { $ref: '#/components/schemas/Freshness' }
        score:
          allOf: [ { $ref: '#/components/schemas/Score' } ]
          description: 'Present only when it changed.'
        previous:
          type: object
          description: 'Prior deployment_status/freshness/score for transition display.'
    DeploymentStatus:
      type: string
      description: 'Frozen vocabulary: these exact strings are stable and will not change.'
      enum: [missing, to integrate, in progress, onboarded, lost, unboarding, unboarded]
    Freshness:
      type: string
      description: 'Frozen vocabulary: these exact strings are stable and will not change. Backend-managed; `running` is never a terminal state.'
      enum: [fresh, stale, running, failed, no result received]
    InstanceSettings:
      type: object
      description: 'OrgAdmin settings view of one configured git instance: metadata and flags only, NEVER a secret.'
      required: [id, provider, instance, token_set, oauth_app_set]
      properties:
        id: { type: string, format: uuid }
        provider: { type: string }
        instance: { type: string }
        base_url: { type: string, nullable: true, description: 'Provider instance base URL; null until an OAuth app is configured.' }
        token_kind:
          type: string
          nullable: true
          enum: [api, read_api]
          description: 'Derived from the validated token''s scopes, never caller input. Null when no token is configured.'
        token_expires_at: { type: string, format: date-time, nullable: true }
        oauth_client_id: { type: string, nullable: true, description: 'Public OAuth app client id (not a secret); null until configured.' }
        token_set: { type: boolean, description: 'True when an org token is configured. The token value itself is never returned.' }
        oauth_app_set: { type: boolean, description: 'True when a per-instance OAuth app is configured. The client secret value is never returned.' }
    UpdateInstanceTokenRequest:
      type: object
      required: [token]
      properties:
        token: { type: string, description: 'Plaintext candidate org token, validated against the git host before storage; never echoed back.' }
    UpdateInstanceOAuthAppRequest:
      type: object
      required: [client_id, client_secret, base_url]
      properties:
        client_id: { type: string, description: 'Public OAuth app client id.' }
        client_secret: { type: string, description: 'Plaintext OAuth app client secret; never echoed back.' }
        base_url: { type: string, description: 'Provider instance base URL (e.g. https://gitlab.example.com); the server-side source for OAuth endpoints and token validation.' }

    CreateInstanceRequest:
      type: object
      description: 'Body of createInstance: registers a git instance with no token or OAuth app configured yet (added afterwards via the existing PUT endpoints).'
      required: [provider, instance, base_url]
      properties:
        provider: { type: string, description: 'e.g. gitlab (GitHub instances are not supported by this endpoint yet).' }
        instance: { type: string, description: 'e.g. gitlab.example.com - the instance NAME, distinct from base_url.' }
        base_url: { type: string, description: 'Provider instance base URL. MUST be a parseable absolute http(s) URL (a scheme/format check only, not a private-range or SSRF check).' }
    SyncTriggerRequest:
      type: object
      description: 'Body of triggerSync: names the instance to sync.'
      required: [instance_id]
      properties:
        instance_id: { type: string, format: uuid, description: 'Must belong to the caller''s own org (404 otherwise).' }
    SyncState:
      type: string
      description: 'The sync run''s current lifecycle stage.'
      enum: [in_progress, completed, failed]
    SyncStatus:
      type: object
      description: 'One sync run''s status.'
      required: [id, instance_id, scheduled, state, started_at, updated_at, project_count, group_count]
      properties:
        id: { type: string, format: uuid }
        instance_id: { type: string, format: uuid }
        scheduled: { type: boolean, description: 'True for a scheduled run, false for a manually triggered run.' }
        state: { $ref: '#/components/schemas/SyncState' }
        started_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        completed_at: { type: string, format: date-time, nullable: true, description: 'Null while state is in_progress.' }
        project_count: { type: integer }
        group_count: { type: integer }
        error: { type: string, description: 'A short provider-failure summary, present only when state is failed; never includes credentials or other secrets.' }
    InventoryProject:
      type: object
      description: 'One entry in the visibility-filtered asset inventory (see listProjects).'
      required: [id, path, deployment_status, freshness, has_plumber_yaml, archived, provider_deleted, score_letter, score_points]
      properties:
        id: { type: string, format: uuid }
        path: { type: string }
        deployment_status: { $ref: '#/components/schemas/DeploymentStatus' }
        freshness: { $ref: '#/components/schemas/Freshness' }
        has_plumber_yaml: { type: boolean, description: 'Discovery flag only: whether a Plumber config file was found. Does not by itself assign any policy.' }
        archived: { type: boolean }
        provider_deleted: { type: boolean, description: 'True when the project was flagged as removed on the provider; the project is never actually deleted from this inventory.' }
        score_letter: { type: string, description: 'Empty string when the project has never been scored.' }
        score_points: { type: integer }

    ConfigEnforcement:
      type: string
      enum: [block, report]
      description: 'Enforcement dial: `block` or `report`, same vocabulary as `Policy.enforcement` above. There is NO `fail_mode`: degraded controls are single and non-configurable.'
    CreatedID:
      type: object
      description: 'The 201 body for every config create endpoint below.'
      required: [id]
      properties:
        id: { type: string, format: uuid }
    PolicySummary:
      type: object
      description: 'One row of the policies list: metadata and counts only, never the full requirements/controls (see PolicyDetail).'
      required: [id, name, color, enforcement, requirement_count, control_count]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        color: { type: string }
        enforcement: { $ref: '#/components/schemas/ConfigEnforcement' }
        requirement_count: { type: integer }
        control_count: { type: integer, description: 'Total controls across all requirements.' }
        assigned_project_count: { type: integer, description: 'Direct project assignments (not counting projects reached only via a portfolio).' }
        assigned_portfolio_count: { type: integer }
    PolicyMetaRequest:
      type: object
      description: 'Request body for both createPolicy (POST) and updatePolicyMeta (PUT) - same fields either way.'
      required: [name, enforcement]
      properties:
        name: { type: string, description: 'Mandatory, non-empty.' }
        description: { type: string }
        color: { type: string, description: 'Optional; server default #3b82f6 applied when omitted or empty.' }
        enforcement: { $ref: '#/components/schemas/ConfigEnforcement' }
    PolicyDetail:
      type: object
      description: 'The full getPolicy body: metadata + the requirements/controls tree + resolved assignment id sets.'
      required: [id, name, color, enforcement, requirements, assignments]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        color: { type: string }
        enforcement: { $ref: '#/components/schemas/ConfigEnforcement' }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        requirements:
          type: array
          items: { $ref: '#/components/schemas/RequirementDetail' }
        assignments: { $ref: '#/components/schemas/PolicyAssignments' }
    RequirementDetail:
      type: object
      description: 'One requirement as read back (carries its stable id; contrast RequirementInput, which never does - position is array order, not a caller id).'
      required: [id, name, controls]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        controls:
          type: array
          items: { $ref: '#/components/schemas/ControlDetail' }
    ControlDetail:
      type: object
      description: 'One control instance as read back.'
      required: [id, type, version, config]
      properties:
        id: { type: string, format: uuid }
        type: { type: string }
        version: { type: string }
        config: { type: object }
    PolicyContentRequest:
      type: object
      description: 'Body of replacePolicyContent (PUT .../content): the complete desired requirements/controls tree, never a diff.'
      required: [requirements]
      properties:
        requirements:
          type: array
          items: { $ref: '#/components/schemas/RequirementInput' }
    RequirementInput:
      type: object
      description: 'One requirement in a content replace. No id: position is derived from array order.'
      required: [name, controls]
      properties:
        name: { type: string, description: 'Mandatory, non-empty.' }
        description: { type: string }
        controls:
          type: array
          items: { $ref: '#/components/schemas/ControlInput' }
    ControlInput:
      type: object
      description: 'One control instance in a content replace. Weights and points are not included here; they live in the versioned control library.'
      required: [type, version, config]
      properties:
        type: { type: string, description: 'Control type identifier. Existence is NOT validated at this layer.' }
        version: { type: string }
        config: { type: object, description: 'Arbitrary control config; must be valid JSON. Not otherwise validated.' }
    PolicyAssignments:
      type: object
      description: 'The full-set-replace body for replacePolicyAssignments, and the assignments field of PolicyDetail on read. Both directions of the diff (entering + leaving) are computed server-side; the caller only ever sends the desired end state.'
      required: [project_ids, portfolio_ids]
      properties:
        project_ids: { type: array, items: { type: string, format: uuid } }
        portfolio_ids: { type: array, items: { type: string, format: uuid } }
    PortfolioSummary:
      type: object
      description: 'One row of the portfolios list: metadata and counts only, never the full members/rules (see PortfolioDetail).'
      required: [id, name, color, member_count, rule_count, resolved_project_count]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        color: { type: string }
        member_count: { type: integer, description: 'Explicit members only.' }
        rule_count: { type: integer, description: 'group: path rules.' }
        resolved_project_count: { type: integer, description: 'Live resolution: explicit members UNION every project matching a rule, deduplicated.' }
    PortfolioMetaRequest:
      type: object
      description: 'Request body for both createPortfolio (POST) and updatePortfolioMeta (PUT).'
      required: [name]
      properties:
        name: { type: string, description: 'Mandatory, non-empty.' }
        color: { type: string, description: 'Optional; server default #10b981 applied when omitted or empty.' }
    ProjectRef:
      type: object
      description: 'Minimal project identity - id plus its path, enough to render a resolved-preview row without a second lookup.'
      required: [id, path]
      properties:
        id: { type: string, format: uuid }
        path: { type: string }
    PortfolioDetail:
      type: object
      description: 'The full getPortfolio body: metadata, explicit member ids, group rules, and the live resolved-project preview.'
      required: [id, name, color, members, rules, resolved_projects]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        color: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        members:
          type: array
          items: { type: string, format: uuid }
          description: 'Explicit member project ids only (contrast resolved_projects, which also includes rule matches).'
        rules:
          type: array
          items: { type: string }
          description: |-
            Each rule is a group path prefix (e.g. `team-a`), not a reference to a group object. A project belongs if its path equals the rule or sits under it: `team-a` matches `team-a/api` and `team-a/sub/web`, but never `team-alpha`. Matching is dynamic, so projects that later appear under the path join automatically.

            - A path with a typo is accepted and simply matches nothing.
            - Rules track the path string, not the group's identity: if a group is renamed on the provider, the rule stops matching until it is updated to the new path.
        resolved_projects:
          type: array
          items: { $ref: '#/components/schemas/ProjectRef' }
          description: 'Live preview: members UNION every project matching a rule, computed at read time, not stored.'
    PortfolioMembersRequest:
      type: object
      description: 'Body of replacePortfolioMembers: the complete desired explicit-member set, never a diff.'
      required: [project_ids]
      properties:
        project_ids: { type: array, items: { type: string, format: uuid } }
    PortfolioRulesRequest:
      type: object
      description: 'Body of replacePortfolioRules: the complete desired rule set, never a diff.'
      required: [group_paths]
      properties:
        group_paths: { type: array, items: { type: string }, description: 'Group path prefixes; see PortfolioDetail.rules for matching semantics. Replaces the complete rule set, never a diff.' }

