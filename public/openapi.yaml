        '400': { description: '`ids` missing/empty/over 100 entries/containing a malformed uuid, a malformed from/to date, from after to, a resolved range over 400 days, or an undocumented query parameter was supplied (naming it).' }
        '401': { description: No live session. }
        '403':
          description: 'The caller is below Member, or the provider refused the caller''s token (the fixed body "your access could not be verified with the provider: log in again, or your account may have been blocked"); log in again.'
        '500':
          description: 'An internal failure (for example a database error), never a client-caused rejection; the body is the fixed string "config write failed" with no diagnostic detail, or "trend unavailable" when the org''s timezone cannot be resolved.'
        '503':
          description: 'The platform could not verify the caller''s session or determine the caller''s role (an infrastructure failure, not a refusal); retry later. During a provider outage a GET or HEAD may still be served from a role cached before the outage (by default up to 15 minutes past the cache TTL); a write is never served that way.'
  /config/portfolios/{id}:
    get:
      operationId: getPortfolio
      summary: Full portfolio detail - metadata, projects, group rules, and the resolved-project preview
      description: |-
        `resolved_projects` is the first page of the live resolved set: explicit projects UNION every project matching a group: rule, computed at read time, capped at 100, ordered by project_path then id.

        - `{id}` must belong to the caller's own org (404 otherwise).
