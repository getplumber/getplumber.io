        - name: issue_type
          in: query
          required: false
          style: form
          explode: true
          schema: { type: array, items: { type: string, pattern: '^ISSUE-[0-9]{3}$' }, maxItems: 100 }
          description: 'Multi-value: repeat `issue_type=<value>` to OR exact values, at most 100. The issue''s own ISSUE-nnn code (IssueSummary.code, the key of GET /issue-types): what fired, whereas control_type filters the owning control, which may own several issue types. Every value must match ^ISSUE-[0-9]{3}$; any other value answers 400 naming the field. Omitted means no filter. Narrows the candidate set of every daily point.'
        - name: severity
          in: query
