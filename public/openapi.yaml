        - { name: is_component_repo, in: query, required: false, schema: { type: boolean }, description: 'The same optional filter listProjects declares.' }
        - { name: official_component_repo, in: query, required: false, schema: { type: boolean }, description: 'The same optional filter listProjects declares.' }
        - { name: path_prefix, in: query, required: false, schema: { type: string }, description: 'The same segment-anchored path filter listProjects declares (the parameter a group toggle binds); bigtech never matches bigtech-500/....' }
        - { name: direct_children_only, in: query, required: false, schema: { type: boolean }, description: 'The same narrowing listProjects declares: requires path_prefix (400 naming the dependency when supplied without it), and matches projects exactly one path segment below it.' }
        - { name: per_page, in: query, required: false, schema: { type: integer, default: 100 }, description: 'Capped at 1000; values above 1000 clamp down; zero, negative, or malformed values fall back to the default (100). This raised cap is this operation''s alone: listProjects and listProjectsTree still cap at 100.' }
        - { name: after, in: query, required: false, schema: { type: string }, description: 'Opaque cursor from a previous response''s next_cursor, the same cursor shape listProjects mints, over the (project_path, id) order. A malformed value is a 400; a cursor minted for a different sort restarts from the first page.' }
