  /issues/status:
    post:
      operationId: setIssuesStatus
      summary: Batch manual status move (Maintainer)
      description: |-
        Applies one manual status move to every issue in the batch, with per-issue results: `{updated: [id...], failed: [{id, reason}...]}`, always 200. Requires Maintainer.

        - Allowed moves: `Detected` <-> `In progress`, `Detected` or `In progress` -> `Dismissed`, `Dismissed` -> `Detected`. `Fixed` cannot be set manually (it is automatic, on the next push); naming it fails that issue with `forbidden_transition`.
        - Per-issue failure reasons: `not_found` (an unknown, foreign-org or invisible-project id), `forbidden_transition`, `already_in_status`.
        - Each applied move is recorded in the issue's history with the caller as actor and the optional `comment`.
        - `issue_ids` must be non-empty and at most 500 entries, `to_status` one of the status vocabulary, and `comment` within the length bound; otherwise 400 and nothing is written.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IssueStatusRequest' }
      responses:
        '200':
          description: Per-issue batch results.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IssueBatchResult' }
        '400': { description: 'Empty issue_ids, issue_ids over the 500-item cap, an unrecognized to_status, or a comment over the length bound.' }
        '401': { description: No live session. }
        '403':
          description: 'The caller is below Maintainer, or the provider refused the caller''s token; the body says to log in again, or that your account may have been blocked.'
        '500':
          description: 'An internal error; the body is the fixed string "issues request failed".'
        '503':
          description: 'The platform could not verify your session or your role with the provider: an infrastructure failure, retry later. During a provider outage a GET or HEAD may still be served from a role cached before the outage (grace window, default 15 minutes past the cache TTL); a write always answers 503.'
  /issues/{id}/comment:
    post:
      operationId: addIssueComment
      summary: Comment-only triage entry, no status change (Member, visible only)
      description: |-
        Adds a comment to the issue's history without changing its status, with the caller as actor. The issue must belong to the caller's org and to a project the caller can see (404 otherwise). Requires Member.

        - `comment` is required: absent, empty or whitespace-only answers 400, as does a comment over the length bound. An unrecognized top-level field answers 400 naming it.
      security:
