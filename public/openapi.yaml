  /projects/{id}/dependencies:
    get:
      operationId: getProjectDependencies
      summary: One project's bill of materials, grouped by kind (Member, visible only)
      description: |-
        Returns what one project's pipeline depends on, grouped by resource kind, each entry carrying how many other visible projects use the same resource. Requires Member; the project must be visible to the caller.

        - The bill comes from the project's latest default-branch run that pushed one, plus the CI/CD variables of its latest project snapshot; runs on other branches never contribute. A push without a bill of materials leaves the previous one in place, so `run_id` names the run the bill actually came from. An unboarded project answers empty arrays until its next default-branch push or snapshot refresh after re-onboarding.
        - `by_kind` always carries every DependencyKind as a key: a project with no bill and no variables answers six empty arrays with `run_id` and `last_seen` both null. `run_id` describes the pushed half alone, `last_seen` whichever half refreshed most recently.
        - Every `key`, `version` and `attrs` member is the CLI's own value, served unchanged. A variable entry carries the metadata read from the provider (masked, protected, hidden, environment, type, origin); the value is never stored or served.
        - `consumer_count` counts visible projects only. An unknown id, a project of a different org and an invisible project all answer the same 404.
        - Not paginated: the bill is bounded at ingest and served whole.
