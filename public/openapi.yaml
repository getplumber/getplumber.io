        - { name: from, in: query, required: false, schema: { type: string, format: date-time }, description: 'RFC3339 lower bound against last_activity. A malformed value answers 400.' }
        - { name: to, in: query, required: false, schema: { type: string, format: date-time }, description: 'RFC3339 upper bound (inclusive) against last_activity. A malformed value answers 400.' }
      responses:
        '200':
          description: One page of the org's users, most recently active first.
