      summary: Coverage rollup over the caller's visible projects (Member)
      description: |-
        The coverage rollup (adoption counts) over the caller's visible projects. Requires Member.

        - Counts cover live, unarchived projects only: archived and provider-deleted projects are always excluded (unlike `GET /projects`, whose `archived`/`provider_deleted` parameters restore them there).
        - Counts are scoped to the caller's own org, provider and instance (the git instance they are logged into), never narrowed to one portfolio or policy. `GET /sync/status` is scoped to the org alone.
        - `score_points`/`score_letter` are the org-wide score average, a different scope: not narrowed to the login instance and not visibility-filtered (see `Overview.score_points`).
      security:
