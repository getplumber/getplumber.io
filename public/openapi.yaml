      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IssueCommentRequest' }
      responses:
        '204': { description: Comment recorded. }
        '400': { description: 'comment genuinely absent, an unrecognized top-level field (named), an empty or whitespace-only comment, or a comment over the length bound.' }
        '401': { description: No live session. }
        '403':
          description: 'The caller is below Member, or the provider refused the caller''s token; the body says to log in again, or that your account may have been blocked.'
        '500':
          description: 'An internal error; the body is the fixed string "issues request failed".'
        '503':
          description: 'The platform could not verify your session or your role with the provider: an infrastructure failure, retry later. During a provider outage a GET or HEAD may still be served from a role cached before the outage (grace window, default 15 minutes past the cache TTL); a write always answers 503.'
        '404': { description: 'Unknown id, an issue of a different org, or an issue whose project is not visible to the caller; indistinguishable.' }

  /issues/owner:
    post:
      operationId: setIssuesOwner
      summary: Batch manual owner assignment (Maintainer)
      description: |-
        Sets or clears `owner` for every issue in the batch, with the same per-issue result shape as setIssuesStatus: `{updated: [id...], failed: [{id, reason}...]}`, always 200. Requires Maintainer.

        - `owner` is the platform user id of an existing user of the caller's org, or the empty string to unassign; anything else answers 422 for the whole request.
        - An assignment is not a status move and writes no history entry.
        - Per-issue failure reason: `not_found` only (an unknown, foreign-org or invisible-project id).
        - `issue_ids` must be non-empty and at most 500 entries (400 otherwise, nothing written).
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IssueOwnerRequest' }
      responses:
        '200':
          description: Per-issue batch results.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IssueBatchResult' }
        '400': { description: 'Empty issue_ids, or issue_ids over the 500-item cap.' }
        '401': { description: No live session. }
        '403':
          description: 'The caller is below Maintainer, or the provider refused the caller''s token; the body says to log in again, or that your account may have been blocked.'
        '500':
          description: 'An internal error; the body is the fixed string "issues request failed".'
        '503':
          description: 'The platform could not verify your session or your role with the provider: an infrastructure failure, retry later. During a provider outage a GET or HEAD may still be served from a role cached before the outage (grace window, default 15 minutes past the cache TTL); a write always answers 503.'
        '422': { description: 'owner is neither empty nor the id of an existing platform user of the caller''s org: a malformed value, or an unknown or foreign-org user id.' }

  /issues/fix:
    post:
      operationId: triggerFix
      summary: Batch fix trigger, one fix per accepted item (Member, visible only)
      description: |-
        Triggers a fix for every item in the batch, with per-item results, always 200: `{accepted: [{issue_id, fix_id}], rejected: [{issue_id, reason}]}`. Requires Member; the acting user's own git rights are what the provider enforces when the fix runs, and a provider refusal surfaces as the fix's own failure.

        - `items` must be non-empty and at most 100 entries (400 otherwise, nothing accepted).
        - `inputs`, when present on an item, is capped at 1 KB per string value and 4 KB per item; an oversized item answers 400 for the whole request. Accepted inputs are stored verbatim on the fix.
        - Two `inputs` keys are interpreted (see `FixItemRequest.inputs`): `group` (the chosen alternative, a 0-based index as a string) and `components` (per-component input values, keyed by the component path `getFixInputs` serves). A malformed `group` or `components` answers 400 for the whole request; every other key is stored uninterpreted.
        - A required component input with no value makes the fix itself fail (`required input <name> has no value for <path>` in the fix's `error`), opening no branch and no merge request; call `getFixInputs` first to know which values to collect.
        - Rejection reasons: `not_found` (an unknown, foreign-org or invisible-project issue), `not_fixable` (no fix exists for the issue's control, the issue is not `Detected`/`In progress`, or the fix cannot apply on this git instance, in which case `detail` says why), `duplicate_pending` (a fix for this issue is still `pending` or `mr_opened`; once it is `done`, `failed` or `merged`, a new trigger is accepted).
        - A missing or unusable write token is never a rejection: it surfaces as the fix's own `failed` status (see `listFixHistory`).
        - Every accepted item creates one `pending` fix owned by the caller and enqueues it; if the enqueue fails the fix stays `pending` and is picked up later.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FixTriggerRequest' }
      responses:
        '200':
          description: Per-item batch results.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FixTriggerResult' }
        '400':
          description: 'Malformed body, empty items, items over the 100-item cap, an item''s inputs over a bound (body "inputs exceed the allowed bounds": 4 KB per item, 1 KB per string value at any depth, a list over 64 entries, or a component path over 512 bytes), a non-string `inputs.group` (body "inputs.group must be a string"), an `inputs.components` that is not an object of objects of scalars or lists of scalars, or whose input names are not plain YAML keys of at most 128 bytes, or whose values are not printable text (body "inputs.components must be an object of objects"), or a requiring policy whose `required` expression is past the supported bounds (that bound''s own message). Every check runs for every item before any is accepted: the whole request fails, never a partial accept.'
        '401': { description: No live session. }
        '403':
          description: 'The caller is below Member, or the provider refused the caller''s token; the body says to log in again, or that your account may have been blocked.'
        '500':
          description: 'An internal error; the body is the fixed string "fix request failed".'
        '503':
          description: 'The platform could not verify your session or your role with the provider: an infrastructure failure, retry later. During a provider outage a GET or HEAD may still be served from a role cached before the outage (grace window, default 15 minutes past the cache TTL); a write always answers 503.'
  /issues/fix/merge:
    post:
      operationId: mergeFixes
      summary: Batch-merge open merge-request fixes with the caller's own token (Member, visible only)
      description: |-
        Merges the open merge request of every fix in the batch with the calling user's own provider token, so their git rights are what the provider enforces; a provider refusal surfaces as the item's own failure. Per-item results, always 200: `{merged: [fix_id...], failed: [{id, reason}]}`. Requires Member.

        - `fix_ids` must be non-empty and at most 100 entries (400 otherwise).
        - Failure reasons: `not_found` (an unknown, foreign-org or invisible-project fix), `not_mergeable` (the fix is not currently `mr_opened`: it never opened a merge request, or it already merged, failed or was closed), `merge_failed` (the provider rejected the merge: insufficient rights, unresolved discussions, conflicts, or an unavailable write token).
        - A successful merge moves the fix from `mr_opened` to `merged` and marks the project `running` (unless it already is); the merge itself triggers the pipeline, and no separate re-check is enqueued.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FixMergeRequest' }
      responses:
        '200':
          description: Per-item batch results.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FixMergeResult' }
        '400': { description: 'Malformed body, empty fix_ids, or fix_ids over the 100-item cap.' }
        '401': { description: No live session. }
        '403':
          description: 'The caller is below Member, or the provider refused the caller''s token; the body says to log in again, or that your account may have been blocked.'
        '500':
          description: 'An internal error; the body is the fixed string "fix request failed".'
        '503':
          description: 'The platform could not verify your session or your role with the provider: an infrastructure failure, retry later. During a provider outage a GET or HEAD may still be served from a role cached before the outage (grace window, default 15 minutes past the cache TTL); a write always answers 503.'
  /issues/fix/history:
    get:
      operationId: listFixHistory
      summary: Paginated fix history, over the caller's visible projects (Member)
      description: |-
        Every fix of the caller's org, provider and instance on projects the caller can see, newest first (`created_at` descending). Every filter is optional and AND-combined. Requires Member.

        - `project` is an exact provider project path; an unknown or invisible path answers an empty page, never an error.
        - `user` and `issue_id` are exact-match ids; `status` is an exact match against the fix-status vocabulary.
        - `page` (default 1, minimum 1) and `per_page` (default 20, capped at 100) paginate after visibility and filters; `total` is that count.
      security:
        - sessionCookie: []
      parameters:
        - { name: project, in: query, required: false, schema: { type: string }, description: 'Exact provider project path.' }
        - { name: user, in: query, required: false, schema: { type: string, format: uuid }, description: 'Exact-match filter against the fix''s acting user id.' }
        - { name: issue_id, in: query, required: false, schema: { type: string, format: uuid }, description: 'Exact-match filter against the fixed issue''s id.' }
        - { name: status, in: query, required: false, schema: { $ref: '#/components/schemas/FixStatus' }, description: 'Exact-match filter.' }
        - { name: page, in: query, required: false, schema: { type: integer, default: 1 }, description: 'Minimum 1; values below 1 are clamped up to 1.' }
        - { name: per_page, in: query, required: false, schema: { type: integer, default: 20 }, description: 'Capped at 100; values above 100 are clamped down.' }
      responses:
        '200':
          description: One page of the caller's visible fix history.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FixHistoryList' }
        '400': { description: An unrecognized status filter value. }
        '401': { description: No live session. }
        '403':
          description: 'The caller is below Member, or the provider refused the caller''s token; the body says to log in again, or that your account may have been blocked.'
        '500':
          description: 'An internal error; the body is the fixed string "fix request failed".'
        '503':
          description: 'The platform could not verify your session or your role with the provider: an infrastructure failure, retry later. During a provider outage a GET or HEAD may still be served from a role cached before the outage (grace window, default 15 minutes past the cache TTL); a write always answers 503.'
  /issues/{issue_id}/fix-inputs:
    get:
      operationId: getFixInputs
      summary: The inputs the components a fix would add declare (Member, visible only)
      description: |-
        For one issue, the alternatives its requiring policy configures and, per distinct component, the inputs that component declares (`spec.inputs`), read from the component template at the ref the fix would pin. Call it before `triggerFix` to know which values to collect. Requires Member.

        - Only a merge-request-mode "pipeline must include component" issue (ISSUE-408) on an onboarded project has inputs to describe; every other case, including an unknown or invisible issue and a project that is not onboarded, answers 404 with the body `no fix inputs for this issue`.
        - `groups` lists the policy's required alternatives in the same order and 0-based indexing `triggerFix`'s `inputs.group` uses. A policy with no required entries answers 200 with both lists empty.
        - `components` carries one entry per distinct component path, in first-appearance order, capped at 20 (422 beyond).
        - `readable: false` means the component's ref or template could not be read, or its spec is too large to describe; `error` says why in one sentence. `ref` is omitted when the ref itself could not be resolved. A spec is refused whole (never trimmed) when it declares more than 64 inputs, an input name over 128 bytes or outside `^[A-Za-z0-9_][A-Za-z0-9_.-]*$`, an option value over 256 bytes, or more than 64 KB of input metadata in total; a fix refuses the same components with the same message.
        - `required` means the spec declares no `default`. `type` is the spec's own type (`string`, `number`, `boolean` or `array`), `string` when omitted.
        - This is a live, rate-limited provider read: when the rate window is full or the org token cannot be used it answers 503 (`component specs unavailable, retry`); when the provider stalls past the deadline it answers 503 (`the provider did not answer in time`), never a partial answer.
        - Answers are cached: a successful one for ten minutes, a failed one for one minute; a rate-limit refusal is not cached.
      security:
        - sessionCookie: []
      parameters:
        - { name: issue_id, in: path, required: true, schema: { type: string, format: uuid }, description: 'The issue whose fix would add the components described.' }
      responses:
        '200':
          description: The alternatives, and the declared inputs of each component entry.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FixInputsResponse' }
        '400': { description: 'issue_id is not a uuid, ANY query parameter was supplied (this read declares none, and an unrecognized name is named rather than silently discarded), or the requiring policy''s own `required` expression is past the bounds this platform expands (the same sentence triggerFix answers for it).' }
        '401': { description: No live session. }
        '403':
          description: 'The caller is below Member, or the provider refused the caller''s token; the body says to log in again, or that your account may have been blocked.'
        '404': { description: 'No fix inputs for this issue: the caller cannot see it, its fix adds no component, or its project is not onboarded; the cases are indistinguishable. The body is the fixed string "no fix inputs for this issue".' }
        '422': { description: 'The configured alternatives name more than 20 distinct components. The response body is the fixed string "too many components to describe".' }
        '500':
          description: 'An internal error; the body is the fixed string "fix request failed".'
        '503':
          description: 'Either the platform could not verify your session or your role with the provider (an infrastructure failure, retry later), or the component specs could not be read: the body is the fixed string "component specs unavailable, retry" when the org token is unusable or the provider rate window is full, and "the provider did not answer in time" when the read ran out of its deadline; nothing partial is served.'
  /dependencies:
    get:
      operationId: listDependencies
      summary: The pipeline resources of one kind, with who uses them (Member)
      description: |-
        One page of the resources the org's pipelines depend on, of one kind at a time: components, templates (project, remote or provider-template includes), container images, service images, runner tags or CI/CD variables, with who uses each and at which version. Requires Member.

        - Every row, count and version tally is cut to the caller's visible projects: a resource is listed only when at least one visible project uses it, and no count reveals an invisible project.
        - Keys, versions and flags are the CLI's own values, served unchanged. `outdated_count` counts the uses the CLI reported as not up to date; a bill without that flag contributes nothing. Variables come from the project snapshot and their value is never stored or served, only the provider's metadata.
        - `kind` is required and single-valued; there is no all-kinds listing. A value outside the DependencyKind vocabulary answers 400 naming the field and the allowed set.
        - `q` is a case-insensitive literal substring filter on the resource key (trimmed; `%` and `_` match literally).
        - `sort`: `consumers` (default) lists the most-used resources first, `key` lists them alphabetically; the resource id is the final tiebreak, so pagination never skips or repeats a row.
        - Keyset pagination: `after` is the `next_cursor` of a previous response; `per_page` defaults to 20 and is capped at 100 (values above 100 clamp down; zero, negative or malformed values fall back to the default). A malformed `after` answers 400; a cursor whose sort differs from the request's `sort` restarts at the first page of the new sort.
        - `total` counts every visible row matching every filter, across every page.
        - A project's entries come from its latest default-branch push carrying a bill of materials; a push without one leaves them unchanged, so a project can still be counted for a resource it has since removed. Runs on other branches never contribute.
        - Any undocumented query parameter answers 400 naming it.
      security:
        - sessionCookie: []
      parameters:
        - name: kind
          in: query
          required: true
          schema: { $ref: '#/components/schemas/DependencyKind' }
          description: 'Required, single-valued: the resource kind to list; there is no all-kinds listing. A value outside the vocabulary answers 400 naming the field and the allowed set.'
        - { name: q, in: query, required: false, schema: { type: string }, description: 'Case-insensitive substring match on the resource key, literal (trimmed; % and _ match literally, never as wildcards); multi-word phrases match only as exact substrings. Omitted means no filter.' }
        - { name: sort, in: query, required: false, schema: { type: string, enum: [consumers, key], default: consumers }, description: 'Ordering key for the keyset walk. consumers (default) lists the most-used resources first; key lists them alphabetically. The resource id is the final tiebreak on either key. Any other value 400s naming the field and the allowed set.' }
        - { name: per_page, in: query, required: false, schema: { type: integer, default: 20 }, description: 'Capped at 100; values above 100 clamp down; zero, negative or malformed values fall back to the default (20).' }
        - { name: after, in: query, required: false, schema: { type: string }, description: 'Opaque cursor from a previous response next_cursor. Omitted means the first page. A malformed value is a 400; a well-formed value whose encoded sort differs from the request sort resets cleanly to the first page of the new sort.' }
      responses:
        '200':
          description: One page of the caller's visible slice of the org's pipeline resources of that kind.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DependencyResourceList' }
        '400': { description: 'kind is absent or not a DependencyKind value, sort is not an allowed value (naming the field and the allowed set), after is malformed (a cursor with a mismatched sort is not an error), or an undocumented query parameter was supplied (named in the body).' }
        '401': { description: No live session. }
        '403':
          description: 'The caller is below Member, or the provider refused the caller''s token; the body says to log in again, or that your account may have been blocked.'
        '500':
          description: 'An internal error; the body is the fixed string "dependencies request failed".'
        '503':
          description: 'The platform could not verify your session or your role with the provider: an infrastructure failure, retry later. During a provider outage a GET or HEAD may still be served from a role cached before the outage (grace window, default 15 minutes past the cache TTL); a write always answers 503.'
  /dependencies/{id}:
    get:
      operationId: getDependency
      summary: One pipeline resource, its consumers and its neighbourhood (Member, visible only)
      description: |-
        One pipeline resource: the attributes the CLI reported, the projects that use it (paginated) and a small neighbourhood graph. Requires Member.

        - `consumers`, every count and the whole `neighbourhood` are cut to the caller's visible projects; a resource only invisible projects use answers the same 404 as an unknown id, and invisible consumers are absent, never counted, never drawn.
        - `key`, every `version` and every `attrs` member are the CLI's own values, served unchanged. `outdated` on a neighbourhood edge is true only when the CLI reported the use as not up to date. A variable edge carries provider metadata only (masked, protected, environment, origin), never the value.
        - A consuming project is one distinct visible project (`consumer_count`); a consumer edge is one use by one project in one job (`edge_count`, `consumer_edges_total`, one entry of `consumers[]`), so `consumer_edges_total` can exceed `consumer_count`.
        - `consumers` is offset-paginated with `page` and `per_page`, ordered by project path then project id; `consumer_edges_total` counts every visible consumer edge across every page. It is not the standard list envelope.
        - `neighbourhood` is capped at 200 project nodes; beyond that it carries `truncated: true`. The resource itself is the one further node, and the edges are those of the nodes served.
        - A project's edges come from its latest default-branch push carrying a bill of materials; a push without one leaves them unchanged, so a project can still be listed as a consumer of something it has since removed. `run_id` on each consumer names the run its edge came from. Runs on other branches never contribute.
        - An unknown id, a resource of a different org, and a resource no visible project uses all answer the same 404.
      security:
        - sessionCookie: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: page, in: query, required: false, schema: { type: integer, default: 1 }, description: 'Page of the consumers half. Minimum 1; values below 1 are clamped up to 1.' }
        - { name: per_page, in: query, required: false, schema: { type: integer, default: 20 }, description: 'Consumers per page. Capped at 100; values above 100 are clamped down; zero, negative or malformed values fall back to the default (20).' }
      responses:
        '200':
          description: The resource with its visible consumers and its neighbourhood.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DependencyResourceDetail' }
        '400': { description: 'Malformed resource id (not a valid uuid), or an undocumented query parameter was supplied (named in the body).' }
        '401': { description: No live session. }
        '403':
          description: 'The caller is below Member, or the provider refused the caller''s token; the body says to log in again, or that your account may have been blocked.'
        '404': { description: 'Unknown resource id, a resource belonging to a different org, or a resource no project visible to the caller uses - all three indistinguishable.' }
        '500':
          description: 'An internal error; the body is the fixed string "dependencies request failed".'
        '503':
          description: 'The platform could not verify your session or your role with the provider: an infrastructure failure, retry later. During a provider outage a GET or HEAD may still be served from a role cached before the outage (grace window, default 15 minutes past the cache TTL); a write always answers 503.'
  /settings/instances/{id}:
    delete:
      operationId: deleteInstance
      summary: Delete a git instance (OrgAdmin only)
      description: |-
        Permanently removes a git instance registration. Requires OrgAdmin.

        - Refused with 409 unless the instance has no projects and is not the session's own login instance; the body names which condition blocks.
        - `{id}` must belong to the caller's org (404 otherwise, indistinguishable from an unknown id).
      security:
        - sessionCookie: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Deleted. }
        '400':
          description: 'Malformed id path parameter.'
        '401': { description: No live session. }
        '403':
          description: 'The caller is below OrgAdmin, or the provider refused the caller''s token (the body says to log in again).'
        '500':
          description: 'Internal failure; the body is the fixed string "settings update failed" with no further detail.'
        '503':
          description: 'The platform could not verify the session or determine the caller''s role (an infrastructure failure, not a refusal); retry later. During a provider outage a read may still be served from a bounded role cache (default 15 minutes past the cache TTL), a write never is.'
        '404': { description: 'Unknown instance id, or an instance belonging to a different org.' }
        '409': { description: 'Refused: the instance still has one or more projects, or it is the session''s own (login) instance; the body names which.' }

  /settings/instances/{id}/token:
    put:
      operationId: updateInstanceToken
      summary: Rotate an instance's org token (OrgAdmin only)
      description: |-
        Validates the candidate token against the git host before storing it. Requires OrgAdmin.

        - A token with insufficient scope, or an invalid or expired one, fails validation naming what is wrong; the previously active token is left untouched.
        - On success the token is stored and never displayed again.
        - `{id}` must belong to the caller's org (404 otherwise, indistinguishable from an unknown id).
      security:
        - sessionCookie: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateInstanceTokenRequest' }
      responses:
        '200': { description: 'Token validated and stored, but the instance is a group scope whose root group could not be resolved with it (e.g. the path does not exist or is not visible to the token). The token is kept (not rolled back) and the instance stays pending; the body carries a short diagnostic and the resolution is retried on the next token update.' }
        '204': { description: Validated and stored; the prior token (if any) is replaced. For a pending group instance this also means the root group was resolved. }
        '400':
          description: 'Candidate rejected: invalid or expired, or insufficient scope; the token must carry the `api` scope (the message names it).'
        '401': { description: No live session. }
        '403':
          description: 'The caller is below OrgAdmin, or the provider refused the caller''s token (the body says to log in again).'
        '500':
          description: 'Internal failure; the body is the fixed string "settings update failed" with no further detail.'
        '503':
          description: 'The platform could not verify the session or determine the caller''s role (an infrastructure failure, not a refusal); retry later. During a provider outage a read may still be served from a bounded role cache (default 15 minutes past the cache TTL), a write never is.'
        '404': { description: 'Unknown instance id, or an instance belonging to a different org.' }
        '409': { description: 'Instance has no base_url configured yet (base_url is set via the oauth-app endpoint above; a token cannot be validated against an unknown host).' }
        '502': { description: 'Validation unavailable: the git host could not be reached, or answered with something other than a clear accept/reject.' }

  /settings/instances/{id}/root-group:
    put:
      operationId: updateInstanceRootGroup
      summary: Re-point a group-scoped instance at another root group (OrgAdmin only)
      description: |-
        Replaces the root group path of a group-scoped instance, for recovery when the configured root group was deleted, renamed or made unreadable. Requires OrgAdmin.

        - Only a `group`-scoped instance accepts this write (409 otherwise).
        - The new path replaces `root_group_path`; `root_group_id` and `root_group_name` are cleared, so the instance is pending again.
        - Resolution is attempted immediately with the stored org token (204 when resolved); when it cannot resolve yet, or no token is stored, the write still lands (200 with a short diagnostic) and the next sync run resolves the path.
        - Projects discovered under the previous root group are not deleted; the next sync re-scopes discovery under the new root.
        - `{id}` must belong to the caller's org (404 otherwise).
      security:
        - sessionCookie: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateInstanceRootGroupRequest' }
      responses:
        '200': { description: 'Path stored and the instance is pending: the root group could not be resolved yet with the stored token, or no token is stored. The body carries a short diagnostic; the next sync run (or the next token update) retries.' }
        '204': { description: Path stored and the root group resolved. }
        '400':
          description: 'root_group_path is required: a non-empty group path of at most 1024 characters with no control characters; otherwise the body is the fixed string "root_group_path is too long or malformed".'
        '401': { description: No live session. }
        '403':
          description: 'The caller is below OrgAdmin, or the provider refused the caller''s token (the body says to log in again).'
        '404': { description: 'Unknown instance id, or an instance belonging to a different org.' }
        '409': { description: The instance is not group-scoped; only a group scope has a root group to re-point. }
        '500': { description: 'An internal failure completing the request. The response body is the fixed string "settings update failed".' }
        '503':
          description: 'The platform could not verify the session or determine the caller''s role (an infrastructure failure, not a refusal); retry later. During a provider outage a read may still be served from a bounded role cache (default 15 minutes past the cache TTL), a write never is.'
  /settings/instances/{id}/oauth-app:
    put:
      operationId: updateInstanceOAuthApp
      summary: Configure an instance's per-instance OAuth app (OrgAdmin only)
      description: |-
        Stores the instance's OAuth app `client_id`, `client_secret` (never echoed back) and `base_url`. Requires OrgAdmin.

        - `base_url` must be a parseable absolute http(s) URL.
        - `{id}` must belong to the caller's org (404 otherwise).
      security:
        - sessionCookie: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateInstanceOAuthAppRequest' }
      responses:
        '204': { description: Stored. }
        '400': { description: 'Validation failed: client_id/client_secret/base_url empty, or base_url is not a parseable absolute http(s) URL.' }
        '401': { description: No live session. }
        '403':
          description: 'The caller is below OrgAdmin, or the provider refused the caller''s token (the body says to log in again).'
        '500':
          description: 'Internal failure; the body is the fixed string "settings update failed" with no further detail.'
        '503':
          description: 'The platform could not verify the session or determine the caller''s role (an infrastructure failure, not a refusal); retry later. During a provider outage a read may still be served from a bounded role cache (default 15 minutes past the cache TTL), a write never is.'
        '404': { description: 'Unknown instance id, or an instance belonging to a different org.' }

  /settings/instances/{id}/component:
    put:
      operationId: updateInstanceComponent
      summary: Configure the component an onboarding action adds to a project (OrgAdmin only)
      description: |-
        Sets the component that onboarding adds to a project's CI file: a project path on this instance and, optionally, an immutable ref to pin. Answers 200 with a `verification` object saying whether the pin could be checked against the provider; an unverified result never blocks the write. Requires OrgAdmin.

        - `component_path` must be present: a bare project path (no URL scheme, host or `@`), or `""` to clear the setting. An absent `component_path`, or an unrecognized top-level key, is a 400.
        - `component_ref`, when present and non-empty, must be an immutable pin, never `latest`, `main`, `master` or `HEAD` (case-insensitive). Absent or `""` selects the resolved mode: the platform resolves the newest immutable tag of the component repository when it opens the onboarding MR and refreshes it as releases land.
        - A `component_ref` with an empty `component_path` is a 422: it names nothing to pin.
        - `verification.status` is `verified` when the pinned version resolved against the provider and declares the platform input (or when the setting is cleared); it is `unverified`, with `reason` naming why, when resolution could not complete (no token or base_url configured yet, the component template unreadable at this ref, the provider unreachable, or a resolved-mode save, where nothing is checked).
        - `{id}` must belong to the caller's org (404 otherwise, indistinguishable from an unknown id).
      security:
        - sessionCookie: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateInstanceComponentRequest' }
      responses:
        '200':
          description: 'Stored (or cleared, when both fields are explicitly empty), with the verification outcome for this write.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ComponentVerification' }
        '400':
          description: 'Malformed body, an unrecognized top-level field, or `component_path` absent (the body names it); an absent `component_ref` is not a 400, it selects the resolved mode.'
        '401': { description: No live session. }
        '403':
          description: 'The caller is below OrgAdmin, or the provider refused the caller''s token (the body says to log in again).'
        '500':
          description: 'Internal failure; the body is the fixed string "settings update failed" with no further detail.'
        '503':
          description: 'The platform could not verify the session or determine the caller''s role (an infrastructure failure, not a refusal); retry later. During a provider outage a read may still be served from a bounded role cache (default 15 minutes past the cache TTL), a write never is.'
        '404': { description: 'Unknown instance id, or an instance belonging to a different org.' }
        '422':
          description: 'Validation failed: a floating ref, a path carrying a scheme, host or `@`, a path outside the project-path charset, a ref with an empty path, or the pinned version resolved but its spec does not declare the platform input (the body names the missing input). A resolution that fails for any other reason never blocks the write.'
  /settings/instances/{id}/component/version-check:
    get:
      operationId: checkInstanceComponentVersion
      summary: Check the pinned onboarding component against its latest published version (OrgAdmin only)
      description: |-
        Reports the instance's currently pinned component (`component_path`/`component_ref` as stored) alongside the newest published tag of the component repository, resolved against the provider at request time. Requires OrgAdmin.

        - `current.path`/`current.ref` echo the stored values verbatim, both `""` when nothing is configured.
        - `checked` is `true` only when the newest tag was actually resolved this request; otherwise `checked` is `false`, `latest` is `null` and `reason` is one of: `"no component configured for this instance"`, `"no org token configured yet"`, `"no base_url configured for this instance yet"`, `"component repository unreachable"`, `"could not resolve a published version for the component repository"`. `reason` is `""` exactly when `checked` is `true`.
        - `latest`, when `checked` is `true`, is `{version, ref}` (both the resolved tag name); `changelog_url` is the tags-page link for that version on the provider, nullable in the schema but never null in practice.
        - `latest` is the newest semver-parseable tag of the whole component repository, not a per-component lookup: a repository hosting several components may report a release that did not touch the pinned one.
        - No caching: every call re-resolves against the provider.
        - `{id}` must belong to the caller's org (404 otherwise).
      security:
        - sessionCookie: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: The instance's current component pin and its resolved latest-version check.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ComponentVersionCheck' }
        '400': { description: Malformed instance id (not a valid uuid). }
        '401': { description: No live session. }
        '403':
          description: 'The caller is below OrgAdmin, or the provider refused the caller''s token (the body says to log in again).'
        '500':
          description: 'Internal failure; the body is the fixed string "settings request failed" with no further detail.'
        '503':
          description: 'The platform could not verify the session or determine the caller''s role (an infrastructure failure, not a refusal); retry later. During a provider outage a read may still be served from a bounded role cache (default 15 minutes past the cache TTL), a write never is.'
        '404': { description: 'Unknown instance id, or an instance belonging to a different org.' }

  /settings/org:
    get:
      operationId: getOrgSettings
      summary: The org settings document (Member)
      description: |-
        Returns the caller's org's settings: the six automation and UI toggles, the branch and commit prefixes Plumber uses, and the org time zone (each field is described on the OrgSettings schema). The booleans default to false, the prefixes to empty, and `timezone` to "UTC". Requires Member.
      security:
        - sessionCookie: []
      responses:
        '200':
          description: The caller's org's settings.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrgSettings' }
        '401': { description: No live session. }
        '403':
          description: 'The caller is below Member, or the provider refused the caller''s token (the body says to log in again).'
        '500':
          description: 'Internal failure; the body is the fixed string "org settings request failed" with no further detail.'
        '503':
          description: 'The platform could not verify the session or determine the caller''s role (an infrastructure failure, not a refusal); retry later. During a provider outage a read may still be served from a bounded role cache (default 15 minutes past the cache TTL), a write never is.'
    put:
      operationId: updateOrgSettings
      summary: Replace the org settings document (Maintainer)
      description: |-
        Replaces the caller's org's settings as a whole and returns the stored value. Requires Maintainer.

        - All nine fields are required on every write; an absent or null field is rejected.
        - `branch_prefix` and `commit_prefix` are validated (400 naming the field); a trailing "/" is appended to `branch_prefix` when absent, so "acme-sec" and "acme-sec/" are stored identically.
        - `timezone` must be an IANA zone name; an unrecognized name, "" or "Local" is a 400 naming "timezone", and a name the database does not know answers 400 "timezone: unknown to the database".
        - Changing `timezone` re-rolls the org's trend days from the earliest surviving run over the following rollup ticks (7 days per hourly tick by default); older days keep their previous day boundary (at most one day off, never deleted).
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrgSettings' }
      responses:
        '200':
          description: The stored org settings.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrgSettings' }
        '400': { description: 'Malformed request body, a required field absent or null, or an invalid branch_prefix/commit_prefix/timezone (the body names the failing field).' }
        '401': { description: No live session. }
        '403':
          description: 'The caller is below Maintainer, or the provider refused the caller''s token (the body says to log in again).'
        '500':
          description: 'Internal failure; the body is the fixed string "org settings request failed" with no further detail.'
        '503':
          description: 'The platform could not verify the session or determine the caller''s role (an infrastructure failure, not a refusal); retry later. During a provider outage a read may still be served from a bounded role cache (default 15 minutes past the cache TTL), a write never is.'
  /settings/licence:
    get:
      operationId: getLicenceStatus
      summary: The org's licence status (Member)
      description: |-
        Returns the caller's org's licence state: whether a valid key is installed (`licensed`), whether it has expired (`expired`), the key's claimed `owner`/`expires_at`/`level`/`project_limit`, and the usage counted against the limit. Requires Member.

        - When `licensed` is true, those four fields carry the values claimed by the installed key; `expired` says whether they are in effect (false) or the platform has fallen back to the free tier (true).
        - When `licensed` is false (no key, or an invalid signature), the free tier is reported: `owner` and `expires_at` are `""`, `level` is 0, `project_limit` is 10.
        - `usage.counted` and `usage.project_ids` cover every project in deployment state `in progress`, `onboarded` or `unboarding`, plus any project with a live onboarding attempt in status `pending` or `mr_opened`; a project mid-onboarding counts once.
        - `over_limit` and `remaining` are computed against the limit in effect (the free tier's 10 while the key is expired), not necessarily `project_limit`: `over_limit` is `usage.counted > limit`, `remaining` is `max(0, limit - usage.counted)`. The limit is surfaced, never gated: only the onboarding wizard refuses past it (422).
        - The licence key material is never returned by any read.
      security:
        - sessionCookie: []
      responses:
        '200':
          description: The caller's org's licence status.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LicenceStatus' }
        '401': { description: No live session. }
        '403':
          description: 'The caller is below Member, or the provider refused the caller''s token (the body says to log in again).'
        '500':
          description: 'Internal failure; the body is the fixed string "licence request failed" with no further detail.'
        '503':
          description: 'The platform could not verify the session or determine the caller''s role (an infrastructure failure, not a refusal); retry later. During a provider outage a read may still be served from a bounded role cache (default 15 minutes past the cache TTL), a write never is.'
    put:
      operationId: applyLicence
      summary: Apply or clear the org's licence key (OrgAdmin)
      description: |-
        Validates and stores `key` as the caller's org's licence key, or clears the stored key when `key` is the empty string. Requires OrgAdmin.

        - A key whose signature does not validate, is not valid base64, or is already expired at apply time is rejected (400).
        - A key that expires after install is not rejected: from its `expires_at` on, the platform serves the free tier (project limit 10, level 0) on every read, and `expired` on the licence status read reports it.
        - The key value is never returned by any read.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApplyLicenceRequest' }
      responses:
        '204': { description: 'Stored (or cleared, when `key` is the empty string).' }
        '400': { description: 'Malformed body, `key` not valid base64, signature validation failed, or the key is structurally valid but already expired at apply time.' }
        '401': { description: No live session. }
        '403':
          description: 'The caller is below OrgAdmin, or the provider refused the caller''s token (the body says to log in again).'
        '500':
          description: 'Internal failure; the body is the fixed string "licence request failed" with no further detail.'
        '503':
          description: 'The platform could not verify the session or determine the caller''s role (an infrastructure failure, not a refusal); retry later. During a provider outage a read may still be served from a bounded role cache (default 15 minutes past the cache TTL), a write never is.'
  /settings/ai:
    get:
      operationId: getAISettings
      summary: The org's AI/LLM connection settings (Member)
      description: |-
        Returns where the caller's org's own LLM lives (provider and connection fields) plus three presence booleans, `api_key_set`, `bedrock_access_keys_set` and `bedrock_api_key_set`; secret values are never returned. Requires Member.

        - The platform does not call an LLM with this configuration; it only stores it.
        - `provider` defaults to `openai` until an OrgAdmin configures one; `enabled` stays false until the provider's completeness set is met (see updateAISettings).
        - `bedrock_session_token` is writable but its presence is not reported by any read.
      security:
        - sessionCookie: []
      responses:
        '200':
          description: The caller's org's AI settings.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AISettings' }
        '401': { description: No live session. }
        '403':
          description: 'The caller is below Member, or the provider refused the caller''s token (the body says to log in again).'
        '500':
          description: 'Internal failure; the body is the fixed string "AI settings request failed" with no further detail.'
        '503':
          description: 'The platform could not verify the session or determine the caller''s role (an infrastructure failure, not a refusal); retry later. During a provider outage a read may still be served from a bounded role cache (default 15 minutes past the cache TTL), a write never is.'
    put:
      operationId: updateAISettings
      summary: Partial update of the org's AI/LLM connection settings (OrgAdmin)
      description: |-
        Partial update: every field is optional, an absent field keeps its stored value, and an explicit empty string clears it. `enabled` is the one non-string field and keeps its value when absent. Requires OrgAdmin.

        - The platform does not call an LLM with this configuration; it only stores it.
        - `enabled` can only be true when the provider's completeness set is met by the state resulting from this write (stored values included): for `openai`, `endpoint`, `model`, `model_light` and an api key; for `bedrock`, `bedrock_region`, `bedrock_model`, `bedrock_model_light` and either `bedrock_api_key` or the pair `bedrock_access_key_id` + `bedrock_secret_access_key`. The check runs on every write whose resulting `enabled` is true, so clearing a required field on an enabled org is a 400 naming it.
        - `provider`, when supplied, must be `openai` or `bedrock`; `bedrock_auth_method`, when supplied, must be `""`, `apiKey` or `accessKeys`.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateAISettingsRequest' }
      responses:
        '204': { description: 'Stored (partial update applied field by field).' }
        '400': { description: 'Malformed body, an invalid provider/bedrock_auth_method enum value, or `enabled: true` requested while its provider''s completeness set is not met (the body names the missing fields).' }
        '401': { description: No live session. }
        '403':
          description: 'The caller is below OrgAdmin, or the provider refused the caller''s token (the body says to log in again).'
        '500':
          description: 'Internal failure; the body is the fixed string "AI settings request failed" with no further detail.'
        '503':
          description: 'The platform could not verify the session or determine the caller''s role (an infrastructure failure, not a refusal); retry later. During a provider outage a read may still be served from a bounded role cache (default 15 minutes past the cache TTL), a write never is.'
  /onboarding/status:
    get:
      operationId: getOnboardingStatus
      summary: The onboarding wizard's status (Member)
      description: |-
        Returns the caller's org's stored onboarding "done" flag plus eight signals derived live from existing data (each is described on the OnboardingStatus schema). Requires Member.

        - `token_set`: any git instance of the org has an org token stored.
        - `sync_has_run`: a sync run has completed successfully for the org.
        - `any_project_onboarded`: any project has deployment status `onboarded`.
        - `licence_set`: a licence key is stored and its signature validates; expiry is not checked, unlike `licensed` on the licence status read.
        - `component_set`: any git instance has a `component_path` configured (the ref is not required).
        - `any_policy_created`: at least one policy exists for the org.
        - `ai_configured`: the AI settings are currently enabled.
        - `licence_exceeded`: the counted projects exceed the project limit in effect (the free tier's 10 while the key is expired), the same figure the licence status read reports as `over_limit`.
      security:
        - sessionCookie: []
      responses:
        '200':
          description: The caller's org's onboarding status.
          content:
