  /settings/authorization/synced-groups:
    get:
      operationId: listSyncedGroups
      summary: List the org's synced git groups, as last synced (Maintainer)
      description: |-
        Lists every git group sync has observed for the caller's org across every connected instance, as last synced (no provider call), in the standard page envelope: `{items: [{provider_group_id, full_path, name}], page, per_page, total}`. Requires Maintainer.

        - Values reflect the group as of its last sync; a group synced or renamed more recently is not yet reflected. Being listed here does not guarantee `createAuthorizedMaintainerGroup` accepts the group: one synced under a different instance or org, or not synced yet, still gets a 422 there.
        - `page` (default 1, minimum 1) and `per_page` (default 20, capped at 100) paginate.
        - `provider` and `instance` filter independently; omitted, the listing is org-wide.
        - `q` is a case-insensitive literal substring filter on `name` or `full_path`. Filters and pagination combine.
        - An unknown query parameter is a 400 naming it.
      security:
        - sessionCookie: []
      parameters:
        - { name: page, in: query, required: false, schema: { type: integer, default: 1 }, description: 'Minimum 1; values below 1 are clamped up to 1.' }
        - { name: per_page, in: query, required: false, schema: { type: integer, default: 20 }, description: 'Capped at 100; values above 100 are clamped down.' }
        - { name: provider, in: query, required: false, schema: { type: string }, description: 'Filter on the group''s provider, independent of instance; omitted means every provider.' }
        - { name: instance, in: query, required: false, schema: { type: string }, description: 'Filter on the group''s instance, independent of provider; omitted means every instance.' }
        - { name: q, in: query, required: false, schema: { type: string }, description: 'Substring match against name or full_path, case-insensitive, literal (trimmed; % and _ match literally, never as wildcards; a raw NUL byte is a 400). Omitted means no filter.' }
      responses:
        '200':
          description: One page of the caller's org's synced groups, as last synced.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SyncedGroupList' }
        '400': { description: 'q contains a raw NUL byte (naming the parameter and the code point), or an unknown query parameter was supplied, naming it.' }
        '401': { description: No live session. }
        '403':
          description: 'The caller is below Maintainer, or the provider refused the caller''s token (the body says to log in again).'
        '500':
          description: 'Internal failure; the body is the fixed string "authorization request failed" with no further detail.'
        '503':
          description: 'The platform could not verify the session or determine the caller''s role (an infrastructure failure, not a refusal); retry later. During a provider outage a read may still be served from a bounded role cache (default 15 minutes past the cache TTL), a write never is.'
  /controls:
