        - { name: per_page, in: query, required: false, schema: { type: integer, default: 20 }, description: 'Capped at 100; values above 100 are clamped down.' }
        - { name: q, in: query, required: false, schema: { type: string }, description: 'Substring match against name, case-insensitive, literal (trimmed; % and _ match literally, never as wildcards); multi-word phrases match only as exact substrings.' }
      responses:
