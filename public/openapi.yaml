  /catalog/components:
    get:
      operationId: listCatalogComponents
      summary: The instance's CI/CD catalog resources as the org's own token sees them (Member)
      description: |-
        The CI/CD catalog resources of the org's git instance as the org's own token sees them, refreshed by sync; the source for the required-templates/required-components picker.

        - Scoped to the caller's own org, provider and instance.
        - `q` is a case-insensitive substring match against the resource's name and full path.
        - `page` (default 1, minimum 1, values below 1 are clamped up) and `per_page` (default 20, capped at 100) paginate the instance's catalog resources; `total` reflects every match under the current filters, not just the page size.
        - `sort`/`order`: closed, case-sensitive enums. `sort=name` (the default) orders by the resource's name; `sort=recent` orders by `seen_at` (when sync last saw it). `id` is always the final tiebreak so pagination stays stable.
        - `latest_version` is the empty string when the resource carries no known versions; `versions` is always an array, never null.
        - `namespace` is the group path the resource lives under, derived from its full path (the empty string for a resource with no group). `verification_level` is the provider's own value, verbatim; the empty string means the instance did not answer it, not that the resource is unverified. `version_components` carries the component names each known version publishes, in the same order as `versions` (`version_components[i].version == versions[i]`). `components` is the latest version's components (`version_components[0].components`), served flat; it is `[]` when the resource has no versions or the components were not answered.
        - Requires an authenticated session at Member level or above.
      security:
        - sessionCookie: []
      parameters:
        - { name: q, in: query, required: false, schema: { type: string }, description: 'Case-insensitive substring match against the resource name and full path.' }
        - { name: page, in: query, required: false, schema: { type: integer, default: 1 }, description: 'Minimum 1; values below 1 are clamped up to 1.' }
        - { name: per_page, in: query, required: false, schema: { type: integer, default: 20 }, description: 'Capped at 100; values above 100 are clamped down.' }
        - { name: sort, in: query, required: false, schema: { type: string, enum: [name, recent], default: name }, description: 'Sort key. name orders by the resource name (the default); recent orders by seen_at. id is always the final tiebreak. Any other value is a 400 naming the field and the allowed set.' }
        - { name: order, in: query, required: false, schema: { type: string, enum: [asc, desc], default: asc }, description: 'Sort direction, paired with sort. Default asc. Any other value is a 400 naming the field and the allowed set.' }
        - name: scope
          in: query
          required: false
          schema: { type: string, enum: [all, mine, official, gitlab_maintained], default: all }
          description: 'Closed, case-sensitive enum narrowing which catalog resources are listed. `all` (the default) is every resource the org token saw in this instance''s catalog. `mine` is every resource whose `namespace` is, or sits under, one of the org''s own synced group paths on this instance (segment-anchored prefix, as for portfolio group rules: `acme` matches `acme/platform/x`, never `acme-other/x`); it is the org token''s reach, not the calling member''s. `official` is every resource whose project on this instance a Maintainer marked as an official component repo (`PUT /projects/{id}/official-component`): the org''s own vocabulary, independent of the provider''s. `gitlab_maintained` is every resource whose `verification_level` is `GITLAB_MAINTAINED` or `GITLAB_PARTNER_MAINTAINED`; `VERIFIED_CREATOR_MAINTAINED`, `VERIFIED_CREATOR_SELF_MANAGED` and `UNVERIFIED` are outside it. On an instance that never answered the level, `gitlab_maintained` returns nothing. Any other value is a 400 naming the field and the allowed set.'
      responses:
        '200':
          description: One page of the instance's cataloged CI/CD components.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CatalogComponentList' }
        '400': { description: 'sort, order or scope is not one of its own closed, case-sensitive vocabulary values, naming the field and the allowed set.' }
        '401': { description: No live session. }
        '403':
          description: 'The caller is below Member, or the provider refused the caller''s token (the fixed body "your access could not be verified with the provider: log in again, or your account may have been blocked"); log in again.'
        '500':
          description: 'An internal failure (for example a database error), never a client-caused rejection; the body is the fixed string "catalog request failed" with no diagnostic detail.'
        '503':
          description: 'The platform could not verify the caller''s session or determine the caller''s role (an infrastructure failure, not a refusal); retry later. During a provider outage a GET or HEAD may still be served from a role cached before the outage (by default up to 15 minutes past the cache TTL); a write is never served that way.'
