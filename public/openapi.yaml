        - { name: per_page, in: query, required: false, schema: { type: integer, default: 20 }, description: 'Capped at 100; values above 100 are clamped down.' }
        - { name: project, in: query, required: false, schema: { type: string }, description: 'Exact provider project path.' }
        - { name: actor, in: query, required: false, schema: { type: string, format: uuid }, description: 'Exact-match filter against the platform user id; a system-triggered fix never matches. A malformed value answers 400.' }
