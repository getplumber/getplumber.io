              schema: { $ref: '#/components/schemas/OnboardingStatus' }
        '401': { description: No live session. }
        '403':
          description: 'The caller is below Member, or the provider refused the caller''s token (the body says to log in again).'
        '500':
          description: 'Internal failure; the body is the fixed string "onboarding status request failed" with no further detail.'
        '503':
          description: 'The platform could not verify the session or determine the caller''s role (an infrastructure failure, not a refusal); retry later. During a provider outage a read may still be served from a bounded role cache (default 15 minutes past the cache TTL), a write never is.'
    put:
      operationId: updateOnboardingStatus
      summary: Mark the onboarding wizard done or not done (OrgAdmin)
      description: |-
        Stores the caller's org's onboarding "done" flag exactly as given; marking done and reverting to not-done are both valid. The derived signals of the status read are unaffected. Requires OrgAdmin.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateOnboardingStatusRequest' }
      responses:
        '204': { description: Stored. }
        '400': { description: 'Malformed body, or an unrecognized top-level field (named).' }
        '401': { description: No live session. }
        '403':
          description: 'The caller is below OrgAdmin, or the provider refused the caller''s token (the body says to log in again).'
        '500':
          description: 'Internal failure; the body is the fixed string "onboarding status request failed" with no further detail.'
        '503':
          description: 'The platform could not verify the session or determine the caller''s role (an infrastructure failure, not a refusal); retry later. During a provider outage a read may still be served from a bounded role cache (default 15 minutes past the cache TTL), a write never is.'
  /settings/authorization/groups:
