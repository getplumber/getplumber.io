        '403':
          description: 'The caller is below Member, or the provider refused the caller''s token; log in again, or the account may have been blocked.'
        '500':
          description: 'An internal failure, not caused by the request; the body is the fixed string "onboard request failed".'
        '503':
          description: 'The platform could not verify the session, determine the caller''s role, or resolve the caller''s visible project set (session store or provider unreachable). During a provider outage a GET or HEAD may still be served from a role cached before the outage (a bounded grace window, 15 minutes past the cache TTL by default); a write always answers 503.'
  /projects/tree:
    get:
      operationId: listProjectsTree
      summary: 'One level of the group tree: direct subgroups plus direct child projects (Member)'
      description: |-
        One level of the group tree of the git instance the caller is logged into, in a single request. `parent_path` names the level; omitted or empty means the root. The response has two halves, both scoped and visibility-filtered exactly like `listProjects`. Requires Member or above.

        - `groups`: the direct subgroups of `parent_path`, derived from project paths (a segment with no project under it is not a node). `path` is the group's full path; `name` is the provider's group name when one has been synced, else the last path segment. `project_count` counts every project anywhere below the group that the caller can see and that matches every filter of the request. A subgroup whose every project is invisible to the caller is not listed.
        - `projects`: the direct child projects of `parent_path`, exactly one path segment below it (segment-anchored: `parent_path=bigtech` yields `bigtech/api`, never `bigtech` itself, `bigtech/api/web` or `bigtech-500/anything`). At the root level this is normally empty.

        The full `listProjects` filter family applies to both halves with identical meaning and validation; `path_prefix` and `direct_children_only` are not accepted here. `sort`/`order`, `per_page` and the opaque `after` cursor paginate the `projects` half only (keyset, no `page`); the `groups` half is not paginated (see `groups_truncated`) and is ordered by `groups_sort`. A `parent_path` with nothing under it, or one the caller cannot see into, answers 200 with two empty halves and `total: 0`, never 404.
      security:
        - sessionCookie: []
      parameters:
        - { name: parent_path, in: query, required: false, schema: { type: string }, description: 'The level to read. Omitted or empty means the root level. Segment-anchored: bigtech never matches bigtech-500/.... A value with no children answers empty halves, never a 404.' }
        - { name: groups_sort, in: query, required: false, schema: { type: string, enum: [name, project_count], default: name }, description: 'Orders the groups half: name (default) is display name ascending; project_count is descendant count descending. Both tie-break on path ascending.' }
        - name: deployment_status
          in: query
          required: false
          style: form
          explode: true
          schema: { type: array, items: { $ref: '#/components/schemas/DeploymentStatus' } }
          description: 'The same multi-value filter listProjects declares, with identical meaning and validation.'
        - name: freshness
          in: query
          required: false
          style: form
          explode: true
          schema: { type: array, items: { $ref: '#/components/schemas/Freshness' } }
          description: 'The same multi-value filter listProjects declares, with identical meaning and validation.'
        - name: version_check
          in: query
          required: false
          style: form
          explode: true
          schema: { type: array, items: { $ref: '#/components/schemas/VersionCheck' } }
          description: 'The same multi-value filter listProjects declares, with identical meaning and validation.'
        - { name: coverage, in: query, required: false, schema: { $ref: '#/components/schemas/CoverageState' }, description: 'The same filter listProjects declares.' }
        - { name: archived, in: query, required: false, schema: { type: boolean, default: false }, description: 'The same default-excluded population toggle listProjects declares. Narrows both halves.' }
        - { name: provider_deleted, in: query, required: false, schema: { type: boolean, default: false }, description: 'The same default-excluded population toggle listProjects declares. Narrows both halves.' }
        - { name: q, in: query, required: false, schema: { type: string }, description: 'The same substring filter over the project path or the display name listProjects declares. It narrows the counts too: a group''s count reflects only the descendants that match.' }
        - { name: policy_id, in: query, required: false, schema: { type: string, format: uuid }, description: 'The same governed-set filter listProjects declares: direct assignment, portfolio-reached, or, for an all policy, every live project of the org within its scope filter whatever its deployment status, archived and provider-deleted projects excluded; coverage, the stale and no-result counts and licence seats still count onboarded projects only.' }
        - { name: portfolio_id, in: query, required: false, schema: { type: string, format: uuid }, description: 'The same resolved-membership filter listProjects declares.' }
        - { name: language, in: query, required: false, schema: { type: string }, description: 'The same languages-key filter listProjects declares.' }
        - { name: last_active_since, in: query, required: false, schema: { type: string, format: date }, description: 'The same inclusive lower bound listProjects declares.' }
        - { name: last_active_before, in: query, required: false, schema: { type: string, format: date }, description: 'The same inclusive upper bound listProjects declares.' }
        - { name: created_since, in: query, required: false, schema: { type: string, format: date }, description: 'The same inclusive provider_created_at lower bound listProjects declares.' }
        - { name: created_before, in: query, required: false, schema: { type: string, format: date }, description: 'The same inclusive provider_created_at upper bound listProjects declares.' }
        - { name: has_onboarding_error, in: query, required: false, schema: { type: boolean }, description: 'The same tri-state last_onboarding_error filter listProjects declares.' }
        - { name: is_component_repo, in: query, required: false, schema: { type: boolean }, description: 'The same optional filter listProjects declares.' }
        - { name: official_component_repo, in: query, required: false, schema: { type: boolean }, description: 'The same optional filter listProjects declares.' }
        - { name: sort, in: query, required: false, schema: { type: string, enum: [score_points, component_ref, path, last_activity_at, worst_branch_score], default: path }, description: 'Sort key for the projects half only (the same five keys and per-key semantics listProjects documents). The groups half has its own groups_sort.' }
        - { name: order, in: query, required: false, schema: { type: string, enum: [asc, desc], default: asc }, description: 'Sort direction for the projects half, paired with sort.' }
        - { name: per_page, in: query, required: false, schema: { type: integer, default: 20 }, description: 'Page size for the projects half. Capped at 100; values above 100 clamp down; zero, negative, or malformed values fall back to the default (20).' }
        - { name: after, in: query, required: false, schema: { type: string }, description: 'Opaque cursor for the projects half, from a previous response''s next_cursor, the same cursor listProjects mints, including its restart on a sort/order mismatch. A malformed value is a 400.' }
      responses:
        '200':
          description: One level of the group tree - its direct subgroups and its direct child projects.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectsTree' }
        '400': { description: 'A groups_sort, sort, order, deployment_status, freshness, version_check or coverage value outside its vocabulary; a boolean filter not "true" or "false"; a malformed policy_id, portfolio_id, date bound or after cursor; a parent_path carrying a control character; or an undocumented query parameter (named in the body; this includes path_prefix, direct_children_only and page, which this operation does not accept).' }
        '401': { description: No live session. }
        '403':
          description: 'The caller is below Member, or the provider refused the caller''s token; log in again, or the account may have been blocked.'
        '500':
          description: 'An internal failure, not caused by the request; the body is the fixed string "sync request failed".'
        '503':
          description: 'The platform could not verify the session, determine the caller''s role, or resolve the caller''s visible project set (session store or provider unreachable). During a provider outage a GET or HEAD may still be served from a role cached before the outage (a bounded grace window, 15 minutes past the cache TTL by default); a write always answers 503.'
