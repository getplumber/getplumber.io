  /config/policies/scope-preview:
    post:
      operationId: previewPolicyScope
      summary: Preview the projects an unsaved (or saved) scope filter would govern, without writing anything
      description: |-
        Resolves the projects a scope filter would govern, without writing anything: a read despite the POST verb, using the same predicate the saved `scope_filter` uses, so preview and save never diverge. Requires Maintainer.

        - Exactly one of `policy_id` (preview against that policy's saved direct and portfolio assignments) or the explicit form (`project_ids` and/or `portfolio_ids`) must be supplied; both or neither is a 400.
        - `scope_filter` is required but nullable: null previews the unfiltered candidate set (`matched_count` equals the candidate count, `unclassified_count` is 0).
        - `page` (default 1, minimum 1) and `per_page` (default 20, capped at 100) ride the request body; `total` always equals `matched_count`.
        - `items` only lists the projects the caller can see; `matched_count`/`excluded_count`/`unclassified_count` are org-level. In the explicit form, submitted `project_ids` the caller cannot see are dropped before resolution and count nowhere, indistinguishable from unknown ids; `portfolio_ids` are not filtered.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PolicyScopePreviewRequest' }
      responses:
        '200':
          description: The would-be governed project set for the given (unsaved or saved) filter.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PolicyScopePreviewResponse' }
        '400': { description: 'Validation failed: `scope_filter` absent entirely (it is required; an explicit null is valid and previews the unfiltered candidate set), neither or both of policy_id/explicit ids supplied, a cap exceeded (project_ids over 500, portfolio_ids over 100), or an invalid scope_filter payload (the same caps/rules PolicyScopeFilter documents) - naming the field.' }
        '401': { description: No live session. }
        '403':
          description: 'The caller is below Maintainer, or the provider refused the caller''s token (the body says to log in again).'
        '404': { description: 'Unknown policy_id, or a policy_id belonging to a different org.' }
        '500':
          description: 'Internal failure; the body is the fixed string "config write failed" with no further detail.'
        '503':
          description: 'The platform could not verify the session or determine the caller''s role (an infrastructure failure, not a refusal); retry later. During a provider outage a read may still be served from a bounded role cache (default 15 minutes past the cache TTL), a write never is. The visible project set may fail to resolve for the same reason.'
  /config/policies/score-history:
    get:
      operationId: policyScoreHistoryBatch
      summary: Daily score trend for several policies in one call (Member)
      description: |-
        The batch form of `GET /config/policies/{id}/score-history`: several policies' daily score series, in org-calendar days, in one call. Per requested id the semantics are those of the single-policy read: 90-day default range, 400-day cap, `from` not after `to`, gaps stay gaps, ascending days, one live point for today when the range includes it (omitted when it cannot be computed), earlier days from the stored daily rollup. Requires Member.

        - `ids` is a repeated query parameter, 1 to 100 entries; zero, more than 100, or a malformed entry is a 400.
        - An unknown id, or one belonging to a different org, is not an error: it yields an entry with an empty inner `items` list.
        - `from`/`to` are calendar dates in the org calendar, both optional (default: the last 90 days ending today), one range shared across every id.
        - Days are the org's own calendar (its `timezone` setting), the same for every viewer: render `day` as a label, never through the browser clock. The response's `timezone` field names that calendar.
        - An undocumented query parameter is a 400 naming it.
      security:
        - sessionCookie: []
      parameters:
        - name: ids
          in: query
          required: true
          style: form
          explode: true
          schema: { type: array, items: { type: string, format: uuid }, minItems: 1, maxItems: 100 }
          description: 'Repeated `ids=<uuid>&ids=<uuid>...`, 1 to 100 entries. An id unknown, or belonging to a different org, yields an empty-items entry rather than an error - never distinguishable from one another.'
        - { name: from, in: query, required: false, schema: { type: string, format: date }, description: 'Calendar date lower bound (inclusive), read in the org calendar, shared across every id. Defaults to `to` minus 89 days.' }
        - { name: to, in: query, required: false, schema: { type: string, format: date }, description: 'Calendar date upper bound (inclusive), read in the org calendar, shared across every id. Defaults to the org today.' }
      responses:
        '200':
          description: Each requested policy's daily score trend, in request order.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScoreHistoryBatch' }
        '400': { description: '`ids` missing/empty/over 100 entries/containing a malformed uuid, a malformed from/to date, from after to, a resolved range over 400 days, or an undocumented query parameter was supplied (naming it).' }
        '401': { description: No live session. }
        '403':
          description: 'The caller is below Member, or the provider refused the caller''s token (the body says to log in again).'
        '500':
          description: 'Internal failure; the body is the fixed string "config write failed" with no further detail, or "trend unavailable" when the org''s timezone cannot be resolved.'
        '503':
          description: 'The platform could not verify the session or determine the caller''s role (an infrastructure failure, not a refusal); retry later. During a provider outage a read may still be served from a bounded role cache (default 15 minutes past the cache TTL), a write never is.'
  /config/policies/{id}:
    get:
      operationId: getPolicy
      summary: Full policy detail - metadata, control groups/controls, and assignments
      description: |-
        Returns the policy's metadata, control groups and controls, and assignments. Requires Member.

        - `{id}` must belong to the caller's org (404 otherwise; an unknown id and another org's id are indistinguishable).
        - `assignments.project_ids` is the first page of the direct assignment set (capped at 100, ordered by project_path then id), limited to the projects the caller can see, so it may be shorter than `assignments.assigned_project_count`; `GET /config/policies/{id}/projects` pages through the rest. `assignments.portfolio_ids` is neither filtered nor paginated.
      security:
        - sessionCookie: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Full policy detail.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PolicyDetail' }
        '400': { description: Malformed policy id (not a valid uuid). }
        '401': { description: No live session. }
        '403':
          description: 'The caller is below Member, or the provider refused the caller''s token (the body says to log in again).'
        '500':
          description: 'Internal failure; the body is the fixed string "config write failed" with no further detail.'
        '503':
          description: 'The platform could not verify the session or determine the caller''s role (an infrastructure failure, not a refusal); retry later. During a provider outage a read may still be served from a bounded role cache (default 15 minutes past the cache TTL), a write never is. The visible project set may fail to resolve for the same reason.'
        '404': { description: 'Unknown policy id, or a policy belonging to a different org.' }
    put:
      operationId: updatePolicyMeta
      summary: Update a policy's metadata (name, description, color, enforcement, min_points)
      description: |-
        Updates the metadata only; control groups, controls and assignments have their own PUT endpoints. Requires Maintainer.

        - A name, description, color, enforcement or min_points change marks nothing stale. A `scope_filter` or `applies_to` change is a membership change: exactly the projects entering or leaving the governed set go stale, and a flip of `applies_to` to `assigned` closes the issues of every project that loses the policy.
        - `applies_to` keeps its stored value when absent; every other field is replaced.
        - Last save wins: concurrent edits are not merged.
        - `name` must stay unique within the org (case-sensitive); renaming onto an existing name is a 409 and nothing is updated.
      security:
        - sessionCookie: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PolicyMetaRequest' }
      responses:
        '204':
          description: 'Updated; only the projects entering or leaving the governed set are marked stale.'
        '400': { description: 'Validation failed, naming the field.' }
        '401': { description: No live session. }
        '403':
          description: 'The caller is below Maintainer, or the provider refused the caller''s token (the body says to log in again).'
        '500':
          description: 'Internal failure; the body is the fixed string "config write failed" with no further detail.'
        '503':
          description: 'The platform could not verify the session or determine the caller''s role (an infrastructure failure, not a refusal); retry later. During a provider outage a read may still be served from a bounded role cache (default 15 minutes past the cache TTL), a write never is.'
        '404': { description: 'Unknown policy id, or a policy belonging to a different org.' }
        '409': { description: 'A policy with this name already exists in this org (per-org name uniqueness, case-sensitive).' }
    delete:
      operationId: deletePolicy
      summary: Delete a policy (cascades its control groups, controls, and assignments)
      description: |-
        Deletes the policy and cascades its control groups, controls and assignments. Requires Maintainer.

        - The projects the policy governed (its scope-filtered set) are marked stale; a project the scope filter excluded is not.
        - Issues referencing the deleted policy are closed across the whole org; each affected project receives a `project.update` event carrying its `issues_closed`.
      security:
        - sessionCookie: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204':
          description: 'Deleted; the governed projects are marked stale and every project whose issues were closed receives a project.update event.'
        '400': { description: Malformed policy id (not a valid uuid). }
        '401': { description: No live session. }
        '403':
          description: 'The caller is below Maintainer, or the provider refused the caller''s token (the body says to log in again).'
        '409':
          description: 'A referenced id is unknown, belongs to a different org, or is outside what the caller can see.'
        '500':
          description: 'Internal failure; the body is the fixed string "config write failed" with no further detail.'
        '503':
          description: 'The platform could not verify the session or determine the caller''s role (an infrastructure failure, not a refusal); retry later. During a provider outage a read may still be served from a bounded role cache (default 15 minutes past the cache TTL), a write never is.'
        '404': { description: 'Unknown policy id, or a policy belonging to a different org.' }

  /config/policies/{id}/projects:
    get:
      operationId: listPolicyProjects
      summary: The policy's direct coverage, with per-policy score and open issue count, paginated
      description: |-
        The projects the policy directly covers: its explicit project assignments or, when `applies_to` is `all`, every live project of the org within its scope filter (archived and provider-deleted projects excluded). Projects reached only through a portfolio are not listed (see `PolicyAssignmentsPreview.portfolio_reach_count`). Offset-paginated (`page`/`per_page`); deep pages may be slow on an `all` policy. Requires Member or above.

        - `{id}` must belong to the caller's own org (404 otherwise; unknown ids and ids belonging to a different org are indistinguishable).
        - `items` only lists the projects the caller can currently see; `total` is not filtered this way.
        - `page` (default 1, minimum 1) and `per_page` (default 20, capped at 100).
        - Each row carries `name`/`name_with_namespace`, this policy's own per-project score (`policy_score_points`/`policy_score_letter`/`policy_score_withheld`, taken from the project's latest run and distinct from the project's global score; the third field says whether that run evaluated any control of this policy) and `open_issue_count` (issues requiring this policy only, never the project's total).
        - A project the policy's scope filter excludes is not returned, and `total` moves with it.
        - `sort`/`order`: closed, case-sensitive enums. `sort=policy_score_points&order=asc` (the default) is worst-first. A project this policy has never scored (empty `policy_score_letter`) sorts last regardless of `order`; a withheld row (`policy_score_withheld` true) orders with the zeros, the flag saying that 0 is not a grade. `path` orders by the row's `path`. `id` is always the final tiebreak.
        - `freshness`/`language`/`last_active_since`/`last_active_before`/`archived`/`provider_deleted`: the same six facets as `GET /projects`, narrowing this list on top of the scope filter; `total` narrows identically. Under `applies_to = all`, `archived=true` or `provider_deleted=true` only returns dead projects the policy still governs through a direct assignment.
      security:
        - sessionCookie: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: page, in: query, schema: { type: integer } }
        - { name: per_page, in: query, schema: { type: integer } }
        - { name: sort, in: query, required: false, schema: { type: string, enum: [policy_score_points, path], default: policy_score_points }, description: 'Sort key. policy_score_points orders by this policy''s own per-project score, worst-first by default; a project this policy has never scored sorts last regardless of order. path orders by the row''s path. Default policy_score_points. id is always the final tiebreak. Any other value is a 400 naming the field and the allowed set.' }
        - { name: order, in: query, required: false, schema: { type: string, enum: [asc, desc], default: asc }, description: 'Sort direction, paired with sort. Default asc; sort=policy_score_points&order=asc (the default pair) is worst-first. Any other value is a 400 naming the field and the allowed set.' }
        - name: freshness
          in: query
          required: false
          style: form
          explode: true
          schema: { type: array, items: { $ref: '#/components/schemas/Freshness' } }
          description: 'Optional multi-value filter, the same repeated-parameter shape as GET /projects: freshness=<value>&freshness=<value>..., each validated against the Freshness vocabulary, multiple values OR-ed together. Omitted means no filter.'
        - { name: language, in: query, required: false, schema: { type: string }, description: 'Matches a key of the row''s languages map, case-insensitive. A row with no languages collected yet never matches.' }
        - { name: last_active_since, in: query, required: false, schema: { type: string, format: date }, description: 'Inclusive lower bound on last_activity_at (UTC calendar date); a row with no last_activity_at is excluded.' }
        - { name: last_active_before, in: query, required: false, schema: { type: string, format: date }, description: 'Inclusive upper bound on last_activity_at (UTC calendar date); a row with no last_activity_at is excluded.' }
        - name: archived
          in: query
          required: false
          schema: { type: boolean, default: false }
          description: 'Defaults to false: archived rows are excluded, as in GET /projects. true opts them back in, independently of provider_deleted. Any value other than "true" or "false" is a 400.'
        - name: provider_deleted
          in: query
          required: false
          schema: { type: boolean, default: false }
          description: 'Defaults to false: provider-deleted rows are excluded, as in GET /projects. true opts them back in, independently of archived. Any value other than "true" or "false" is a 400.'
      responses:
        '200':
          description: One page of the policy's direct coverage.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PolicyProjectsPage' }
        '400': { description: 'Malformed policy id (not a valid uuid), sort/order is not one of its own closed, case-sensitive vocabulary values, or freshness/archived/provider_deleted carries an unrecognized value, or last_active_since/last_active_before is not a valid YYYY-MM-DD date - naming the field and, for the closed vocabularies, the allowed set.' }
        '401': { description: No live session. }
        '403':
          description: 'The caller is below Member, or the provider refused the caller''s token (the fixed body "your access could not be verified with the provider: log in again, or your account may have been blocked"); log in again.'
        '500':
          description: 'An internal failure (for example a database error), never a client-caused rejection; the body is the fixed string "config write failed" with no diagnostic detail.'
        '503':
          description: 'The platform could not verify the caller''s session or determine the caller''s role (an infrastructure failure, not a refusal), or could not resolve the caller''s visible project set with the provider; retry later. During a provider outage a GET or HEAD may still be served from a role cached before the outage (by default up to 15 minutes past the cache TTL); a write is never served that way.'
        '404': { description: 'Unknown policy id, or a policy belonging to a different org.' }

  /config/policies/{id}/score-history:
    get:
      operationId: policyScoreHistory
      summary: Daily score trend for a policy
      description: |-
        A bounded date series in the org calendar, one point per day the policy has data for (not the standard list envelope). Requires Member or above.

        - `{id}` must belong to the caller's own org (404 otherwise; unknown ids and ids belonging to a different org are indistinguishable).
        - `from`/`to` are calendar dates in the org calendar (`YYYY-MM-DD`, never a date-time). Both optional: `to` defaults to today, `from` to `to` minus 89 days. The range must not exceed 400 days and `from` must not be after `to` (400 otherwise).
        - Each `day` is the average per-policy score over every project whose last completed run at or before that day's end carries this policy, rounded half-up to one decimal; never a per-project breakdown. A day with no contributing project is absent from `items` (a gap), never a zero-value point.
        - If the range includes today, one freshly computed point for today is appended; if that computation fails, the point is omitted and every stored day is still returned.
        - `items` is ordered by `day` ascending; a gap is never backfilled or interpolated.
        - Days are the org's own calendar (its `timezone` setting), the same for every viewer; render `day` as a label, never through the browser clock. The response's `timezone` field names that calendar.
      security:
        - sessionCookie: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: from, in: query, required: false, schema: { type: string, format: date }, description: 'Calendar date lower bound (inclusive), read in the org calendar. Defaults to `to` minus 89 days.' }
        - { name: to, in: query, required: false, schema: { type: string, format: date }, description: 'Calendar date upper bound (inclusive), read in the org calendar. Defaults to the org today.' }
      responses:
        '200':
          description: The policy's daily score trend.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScoreHistory' }
        '400': { description: 'Malformed policy id, a malformed from/to date, from after to, or a resolved range over 400 days.' }
        '401': { description: No live session. }
        '403':
          description: 'The caller is below Member, or the provider refused the caller''s token (the fixed body "your access could not be verified with the provider: log in again, or your account may have been blocked"); log in again.'
        '500':
          description: 'An internal failure (for example a database error), never a client-caused rejection; the body is the fixed string "config write failed" with no diagnostic detail, or "trend unavailable" when the org''s timezone cannot be resolved.'
        '503':
          description: 'The platform could not verify the caller''s session or determine the caller''s role (an infrastructure failure, not a refusal); retry later. During a provider outage a GET or HEAD may still be served from a role cached before the outage (by default up to 15 minutes past the cache TTL); a write is never served that way.'
        '404': { description: 'Unknown policy id, or a policy belonging to a different org.' }

  /config/policies/{id}/control-breakdown:
    get:
      operationId: policyControlBreakdown
      summary: Per-control-type pass/fail/not_evaluable counts for a policy, as of now
      description: |-
        For each control type appearing in the policy, the summed finding-status counts (pass/fail/not_evaluable) across the current run of every org project whose latest run carries this policy. The counts are the statuses the CLI pushed, never a platform-side re-evaluation. Requires Member or above.

        - `{id}` must belong to the caller's own org (404 otherwise; unknown ids and ids belonging to a different org are indistinguishable).
        - Per-control rows exist only for pushes made since this feature became available: a project scored before then contributes nothing until its next push. A control type with no contributing rows does not appear in `items`.
        - `project_count` is the number of distinct projects contributing to that control type's counts.
        - A control type the platform does not serve for its provider is omitted; an unknown control type (a newer CLI's control) appears with its counts.
        - `items` is ordered by `control_type` ascending.
        - `portfolio_id` (optional) restricts the counts to projects that are both in that portfolio's current resolved project set and carry this policy in their current run. It must belong to the caller's own org (404 otherwise). Omitted, every org project whose current run carries the policy counts.
      security:
        - sessionCookie: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: portfolio_id, in: query, required: false, schema: { type: string, format: uuid }, description: 'Restricts the summed counts to this portfolio''s current resolved project set intersected with the policy''s current coverage. Must belong to the caller''s own org (404 otherwise).' }
      responses:
        '200':
          description: The policy's per-control-type breakdown, as of now.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PolicyControlBreakdown' }
        '400': { description: 'Malformed policy id, or a malformed portfolio_id (not a valid uuid).' }
        '401': { description: No live session. }
        '403':
          description: 'The caller is below Member, or the provider refused the caller''s token (the fixed body "your access could not be verified with the provider: log in again, or your account may have been blocked"); log in again.'
        '500':
          description: 'An internal failure (for example a database error), never a client-caused rejection; the body is the fixed string "config write failed" with no diagnostic detail.'
        '503':
          description: 'The platform could not verify the caller''s session or determine the caller''s role (an infrastructure failure, not a refusal); retry later. During a provider outage a GET or HEAD may still be served from a role cached before the outage (by default up to 15 minutes past the cache TTL); a write is never served that way.'
        '404': { description: 'Unknown policy id, a policy belonging to a different org, an unknown portfolio_id, or a portfolio_id belonging to a different org.' }

  /config/policies/{id}/content:
    put:
      operationId: replacePolicyContent
      summary: Full replace of a policy's control groups and controls (whole form)
      description: |-
        The request body is the complete desired state, never a diff; the replace is atomic.

        - Position is derived from array order for both control groups and controls, never a caller-supplied index.
        - `control.config` must be valid JSON.
        - Every control whose type appears on `GET /controls` has its `config` validated against the schema served for that type (keys, field types, enum values, nulls, integer range); one 400 lists every violation across the whole body. A valid config is stored byte-for-byte. An unknown control type is stored as-is, unvalidated.
        - Reads are untouched: a config stored before this validation existed, or made invalid by a later CLI version, is still served verbatim by `GET /config/policies/{id}` and `/context`.
        - A successful replace marks the policy's governed projects (the scope-filtered set) stale; an assigned project the scope filter excludes is not staled.
        - Requires Maintainer.
      security:
        - sessionCookie: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PolicyContentRequest' }
      responses:
        '200':
          description: 'Replaced; the policy''s governed projects are marked stale and a project.update event is emitted for each. The body is always present, `{"warnings": []}` at minimum: a config key the served schema no longer knows (a field renamed or removed by a newer CLI version) is accepted, stored and reported as a warning.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PolicyContentResult' }
        '400':
          description: 'Validation failed, naming the field. Two body shapes, both JSON objects: (1) structural failures carry `{"message": "<field> ..."}`: control_groups absent from the body (an explicit empty array is a valid full clear), an unrecognized top-level field, a control group with an empty name, a control missing type/version/config, a config that is not a JSON object, or a control type repeated in the policy; (2) control-config validation carries `{"error": "<one sentence>", "violations": [ConfigValidationError, ...], "violations_total": <integer>}`, listing every violation found across the whole body in body order, capped at 100 entries, with `violations_total` the true, uncapped count. Nothing is written in either case.'
        '401': { description: No live session. }
        '403':
          description: 'The caller is below Maintainer, or the provider refused the caller''s token (the fixed body "your access could not be verified with the provider: log in again, or your account may have been blocked"); log in again.'
        '409':
          description: 'A referenced id is unknown, belongs to a different org, or is not visible to the caller.'
        '422':
          description: 'Two control groups in the same request body share a name (exact match after trimming whitespace); names identify a control group in `/context`. The body is the ordinary `{"message": "..."}` shape carrying `control_groups[<i>].name "<name>" duplicates control_groups[<first>]; names are the wire identity of a control group in /context`. Nothing is written.'
        '500':
          description: 'An internal failure (for example a database error), never a client-caused rejection; the body is the fixed string "config write failed" with no diagnostic detail.'
        '503':
          description: 'The platform could not verify the caller''s session or determine the caller''s role (an infrastructure failure, not a refusal); retry later. During a provider outage a GET or HEAD may still be served from a role cached before the outage (by default up to 15 minutes past the cache TTL); a write is never served that way.'
        '404': { description: 'Unknown policy id, or a policy belonging to a different org.' }

  /config/policies/{id}/assignments:
    put:
      operationId: replacePolicyAssignments
      summary: Full-set replace of a policy's project and portfolio assignments
      description: |-
        The request body is the complete desired assignment set for every project the caller can see, never a diff. A project the caller cannot see keeps its assignment as it was: leaving it out of the body does not remove it. Submitting the id of a project the caller cannot see is rejected (409), never silently accepted.

        - Only the projects entering or leaving the policy's governed set are marked stale. A project this write assigns that the policy's `scope_filter` excludes is assigned but not staled. The caller never computes the diff itself.
        - Requires Maintainer.
      security:
        - sessionCookie: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PolicyAssignments' }
      responses:
        '204':
          description: 'Replaced; the projects entering or leaving the governed set are marked stale and a project.update event is emitted for each.'
        '400': { description: 'Validation failed, naming the field: project_ids and/or portfolio_ids absent from the body (an explicit empty array is a valid full clear of that half of the set), an unrecognized top-level field (for example a misnamed key), or a malformed project/portfolio id.' }
        '401': { description: No live session. }
        '403':
          description: 'The caller is below Maintainer, or the provider refused the caller''s token (the fixed body "your access could not be verified with the provider: log in again, or your account may have been blocked"); log in again.'
        '500':
          description: 'An internal failure (for example a database error), never a client-caused rejection; the body is the fixed string "config write failed" with no diagnostic detail.'
        '503':
          description: 'The platform could not verify the caller''s session or determine the caller''s role (an infrastructure failure, not a refusal), or could not resolve the caller''s visible project set with the provider; retry later. During a provider outage a GET or HEAD may still be served from a role cached before the outage (by default up to 15 minutes past the cache TTL); a write is never served that way.'
        '404': { description: 'Unknown policy id, or a policy belonging to a different org.' }
        '409': { description: 'A referenced project_id or portfolio_id is unknown, belongs to a different org than the policy, or (project_id only) is not visible to the caller. No partial write; the whole replace rolls back.' }

