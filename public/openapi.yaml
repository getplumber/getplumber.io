            schema: { $ref: '#/components/schemas/UnboardRequest' }
      responses:
        '200':
          description: Per-item batch results.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UnboardResult' }
        '400': { description: 'Malformed body, empty project_ids, or project_ids over its own 100-item cap.' }
        '401': { description: No live session. }
        '403':
          description: 'The caller is below Maintainer, or the provider refused the caller''s token; log in again, or the account may have been blocked.'
        '500':
          description: 'An internal failure, not caused by the request; the body is the fixed string "unboard request failed".'
        '503':
          description: 'The platform could not verify the session, determine the caller''s role, or resolve the caller''s visible project set (session store or provider unreachable). During a provider outage a GET or HEAD may still be served from a role cached before the outage (a bounded grace window, 15 minutes past the cache TTL by default); a write always answers 503.'
  /projects/unboard/merge:
    post:
      operationId: mergeUnboardings
      summary: Batch-merge open removal merge requests (Maintainer, visible only)
      description: |-
        Merges the open removal merge request of every unboarding in the batch using the calling user's own provider OAuth token, so a provider-side failure is reported per item. On a successful merge the project's `deployment_status` becomes `unboarded`. Always 200: `{merged: [unboarding_id...], failed: [{id, reason}]}`. `unboarding_ids` must be non-empty and at most 100 entries (400 otherwise). Requires Maintainer or above.

        Failure reasons: `not_found` (unknown, foreign or invisible, indistinguishable), `not_mergeable` (no open merge request: nothing needed removing, or it already merged or failed), `merge_failed` (the provider rejected the merge: rights, unresolved discussions, conflicts, or the caller's OAuth write token being unavailable).
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UnboardMergeRequest' }
      responses:
        '200':
          description: Per-item batch results.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UnboardMergeResult' }
        '400': { description: 'Malformed body, empty unboarding_ids, or unboarding_ids over the 100-item cap.' }
        '401': { description: No live session. }
        '403':
          description: 'The caller is below Maintainer, or the provider refused the caller''s token; log in again, or the account may have been blocked.'
        '500':
          description: 'An internal failure, not caused by the request; the body is the fixed string "unboard request failed".'
        '503':
          description: 'The platform could not verify the session, determine the caller''s role, or resolve the caller''s visible project set (session store or provider unreachable). During a provider outage a GET or HEAD may still be served from a role cached before the outage (a bounded grace window, 15 minutes past the cache TTL by default); a write always answers 503.'
  /projects/unboard/cancel:
    post:
      operationId: cancelUnboardings
      summary: Cancel a stuck unboarding, closing its open removal merge request (Maintainer, visible only)
      description: |-
        Cancels every unboarding in the batch that is still `pending` or `mr_opened`: a still-open removal merge request is closed with the calling user's own provider OAuth token (one the provider already reports closed is fine), the unboarding is marked `failed` with a fixed cancellation diagnostic, and the project returns to the state it had before the unboard attempt started. This is the only way out of an `mr_opened` unboarding whose merge request was closed or abandoned on the provider. Always 200: `{cancelled: [unboarding_id...], failed: [{id, reason}]}`. `unboarding_ids` must be non-empty and at most 100 entries (400 otherwise). Requires Maintainer or above.

        Failure reasons: `not_found` (unknown, foreign or invisible, indistinguishable), `not_cancellable` (already `merged` or `failed`, including one resolved a moment earlier), `cancel_failed` (the provider refused to close the merge request: rights, it merged meanwhile, or the caller's OAuth write token being unavailable).
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UnboardCancelRequest' }
      responses:
        '200':
          description: Per-item batch results.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UnboardCancelResult' }
        '400': { description: 'Malformed body, empty unboarding_ids, or unboarding_ids over the 100-item cap.' }
        '401': { description: No live session. }
        '403':
          description: 'The caller is below Maintainer, or the provider refused the caller''s token; log in again, or the account may have been blocked.'
        '500':
          description: 'An internal failure, not caused by the request; the body is the fixed string "unboard request failed".'
        '503':
          description: 'The platform could not verify the session, determine the caller''s role, or resolve the caller''s visible project set (session store or provider unreachable). During a provider outage a GET or HEAD may still be served from a role cached before the outage (a bounded grace window, 15 minutes past the cache TTL by default); a write always answers 503.'
  /projects/policies:
    get:
      operationId: projectsDirectPolicies
      summary: The directly-assigned policy ids of a set of projects, visible only (Member)
      description: |-
        For every visible project among `project_ids`, the ids of the policies directly assigned to it, as an onboarding policy picker pre-selects them. An unknown, foreign or invisible project id is simply absent from the response, never an error. Requires Member or above.

        When a project's last sync found a Plumber configuration file and the project is still onboardable, its entry also carries an `offer` to import that file's controls as a policy: `match` (an existing policy already has exactly the same controls), `new` (a new policy named "Custom - {project path}" would be created; a preview lists the control types it would enable), or `unavailable` (the offer could not be computed this time, see its reason; the project can still be onboarded normally). A project with no configuration file, or no longer onboardable, carries no `offer` at all.

        `project_ids` is a comma-separated list; at most 100 are considered, any beyond that are ignored. It is the only accepted query parameter: an unrecognized one answers 400 naming it.
      security:
        - sessionCookie: []
      parameters:
        - { name: project_ids, in: query, required: true, schema: { type: string }, description: 'Comma-separated project ids.' }
