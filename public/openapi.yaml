  /audit/analyses:
    get:
      operationId: listAuditAnalyses
      summary: 'Analysis history: pushed runs and asset-sync attempts, newest first (Maintainer)'
      description: |-
        The org's analysis history: two kinds of row interleaved newest first into one page. A `run` row is a pushed CLI analysis result (project, ref, pipeline and job ids, score, when it was received); a `sync` row is a scheduled or manual asset-sync attempt (instance, whether it was scheduled, its outcome, its error text when it failed). Each entry's `kind` names which one it is; only that kind's fields are populated.

        - Both kinds are windowed to the last 30 days (a run received, or a sync started, in the last 30 days), for the lists and the totals alike.
        - `runs_total` and `syncs_total` count each kind separately within that window; `total` is their sum.
        - Every push produces a `run` row (a successful re-check included); a re-check that never produces a push leaves no row here.
        - `run` rows are limited to the projects the caller can see, in the list and in `runs_total` alike; `sync` rows carry no project and are never filtered.
        - `page` and `per_page` paginate the merged page.
        - `project` applies to `run` rows only and excludes every `sync` row; `kind` narrows to one kind; combined filters intersect (`kind=sync&project=...` is empty). `from`/`to` narrow the range within the 30-day window: a `from` earlier than the window never widens it.
        - Requires a session at Maintainer level.
      security:
        - sessionCookie: []
      parameters:
        - { name: page, in: query, required: false, schema: { type: integer, default: 1 }, description: 'Minimum 1; values below 1 are clamped up to 1.' }
        - { name: per_page, in: query, required: false, schema: { type: integer, default: 20 }, description: 'Capped at 100; values above 100 are clamped down.' }
        - { name: project, in: query, required: false, schema: { type: string }, description: 'Exact provider project path. Applies to run rows only and excludes every sync row (they carry no project).' }
        - { name: kind, in: query, required: false, schema: { $ref: '#/components/schemas/AuditAnalysisKind' }, description: 'Narrows to one kind of row (run or sync); any other value answers 400.' }
        - { name: from, in: query, required: false, schema: { type: string, format: date-time }, description: 'RFC3339 lower bound, intersected with the fixed 30-day window (never widens past it). A malformed value answers 400.' }
        - { name: to, in: query, required: false, schema: { type: string, format: date-time }, description: 'RFC3339 upper bound (inclusive). A malformed value answers 400.' }
      responses:
        '200':
          description: One merged, newest-first page of the org's run and sync history.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditAnalysisList' }
        '400': { description: 'An undocumented query parameter was supplied (naming it), kind is not run/sync, or from/to is not a valid RFC3339 date-time.' }
        '401': { description: No live session. }
        '403':
          description: 'The caller is below Maintainer, or the provider refused the caller''s token; log in again.'
        '500':
          description: 'An internal failure, never a client-caused rejection; the body is the fixed string "audit request failed".'
        '503':
          description: 'The platform could not verify the session, determine the caller''s role or resolve the caller''s visible projects: an infrastructure failure, not a rejection. During a provider outage a GET or HEAD may still be answered from a bounded role cache (default 15 minutes past its TTL); a write is never served that way.'
