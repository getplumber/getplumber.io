      summary: Create a policy (metadata only - content and assignments are separate calls)
      description: |-
        Creates a policy with no control groups, controls or assignments yet; add them afterwards via `policies/{id}/content` and `policies/{id}/assignments`. Requires Maintainer.

        - `name` is required, non-empty and unique within the org (case-sensitive); a duplicate is a 409.
        - `color` defaults to #3b82f6 when omitted or empty.
