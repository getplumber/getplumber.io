        - sessionCookie: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: The project's bill of materials, grouped by resource kind.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectDependencies' }
