        '503':
          description: 'The platform could not verify your session or your role with the provider: an infrastructure failure, retry later. During a provider outage a GET or HEAD may still be served from a role cached before the outage (grace window, default 15 minutes past the cache TTL); a write always answers 503.'
  /overview/score-history:
    get:
      operationId: overviewScoreHistory
      summary: Daily org-wide score trend (Member)
      description: |-
        A bounded date series in the org calendar, one point per day the org has data for; not the standard list envelope. Requires Member.

        - `from`/`to` are `YYYY-MM-DD` calendar dates in the org calendar, both optional: `to` defaults to today, `from` to `to` minus 89 days. The range must not exceed 400 days and `from` must not be after `to` (400 otherwise).
        - Each `day` is the average, rounded to one decimal, of the latest run points as of that day's end across every project of the org that has a scorable run: every project and every instance, not narrowed to the caller's instance and not visibility-filtered (the history of `Overview.score_points`). A day on which no project had a scorable run is absent from `items`, never a zero.
        - Days before today come from the stored daily rollup; if the range includes today, a live point for today is appended, and omitted if it cannot be computed.
        - `items` is ordered by `day` ascending, with no backfill and no interpolation: a gap stays a gap.
        - Days follow the org's own `timezone` setting, the same for every viewer; render `day` as a label, never through the browser clock. The response's `timezone` field names that calendar.
      security:
        - sessionCookie: []
      parameters:
        - { name: from, in: query, required: false, schema: { type: string, format: date }, description: 'Inclusive lower bound, a calendar date in the org calendar. Defaults to `to` minus 89 days.' }
        - { name: to, in: query, required: false, schema: { type: string, format: date }, description: 'Inclusive upper bound, a calendar date in the org calendar. Defaults to the org''s today.' }
      responses:
        '200':
          description: The org's daily score trend.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScoreHistory' }
        '400': { description: 'A malformed from/to date, from after to, or a resolved range over 400 days.' }
        '401': { description: No live session. }
        '403':
          description: 'The caller is below Member, or the provider refused the caller''s token; the body says to log in again, or that your account may have been blocked.'
        '500':
          description: 'An internal error; the body is the fixed string "could not load the overview", or "trend unavailable" when the org''s timezone cannot be resolved.'
        '503':
          description: 'The platform could not verify your session or your role with the provider: an infrastructure failure, retry later. During a provider outage a GET or HEAD may still be served from a role cached before the outage (grace window, default 15 minutes past the cache TTL); a write always answers 503.'
  /overview/top-projects:
    get:
      operationId: topProjects
      summary: The caller's top-scoring visible projects (Member)
      description: |-
        The caller's visible projects that have a run, ordered by `score_points` descending then `project_path` ascending, as slim rows. Requires Member.

        - A project that has never had a run is excluded.
        - `limit` (default 5, maximum 20) bounds the row count.
        - `order=asc` reverses only the score direction (worst-scoring first); the `project_path` tiebreak stays ascending. Any other value answers 400.
        - An undocumented query parameter answers 400 naming it.
      security:
        - sessionCookie: []
      parameters:
        - { name: limit, in: query, required: false, schema: { type: integer, default: 5, maximum: 20 }, description: 'Default 5, maximum 20; values above 20 are rejected, not clamped.' }
        - name: order
          in: query
          required: false
          schema: { type: string, enum: [asc, desc], default: desc }
          description: 'desc (default): score_points descending, project_path ascending as the tiebreak. asc reverses only the score direction (worst first); the tiebreak is unchanged. Any other value answers 400 naming the allowed set.'
      responses:
        '200':
          description: The caller's top-scoring visible projects.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TopProjects' }
        '400': { description: 'An undocumented query parameter was supplied (naming it), limit is not a positive integer at or under 20, or order is not "asc" or "desc".' }
        '401': { description: No live session. }
        '403':
          description: 'The caller is below Member, or the provider refused the caller''s token; the body says to log in again, or that your account may have been blocked.'
        '500':
          description: 'An internal error; the body is the fixed string "could not load the overview".'
        '503':
          description: 'The platform could not verify your session or your role with the provider: an infrastructure failure, retry later. During a provider outage a GET or HEAD may still be served from a role cached before the outage (grace window, default 15 minutes past the cache TTL); a write always answers 503.'
  /issues:
    get:
      operationId: listIssues
      summary: The issues list, over the caller's visible projects (Member)
      description: |-
        One page of issues across the caller's visible projects. Every filter is optional; different filters AND together. Without a `status` filter, Dismissed issues are excluded; `status=Dismissed` shows them. Requires Member.

        - `status`, `severity`, `control_type`, `issue_type` and `owner` are multi-value: repeat the parameter to OR values within one filter, at most 100 values each (a 101st answers 400). There is no single-value alias.
        - `sort` (`first_detected_at` | `updated_at` | `severity`, default `first_detected_at`) picks the ordering key and `order` (`asc` | `desc`, default `desc`) its direction. `severity` orders semantically: `critical` > `high` > `medium` > `low` > unset. Any other value answers 400.
        - `project` is an exact provider project path; `portfolio` resolves to the portfolio's current project set; `policy` is a policy id or name and matches issues currently required by that policy. An unknown, foreign-org or invisible value answers an empty page, never an error.
        - `q` is a case-insensitive literal substring match against `control_type`, the issue code (ISSUE-nnn) and the project path; `%` and `_` match literally.
        - `fixable=true` narrows to issues currently eligible for `triggerFix` (a fix exists for the issue's control and its status is `Detected` or `In progress`); only `true`/`false` are accepted. `total` reflects this filter too.
        - `severity` values are matched case-insensitively against `critical`/`high`/`medium`/`low`; an issue with no severity never matches.
        - `first_detected_since`/`first_detected_before` bound `first_detected_at` and `updated_since`/`updated_before` bound `updated_at`: UTC calendar dates, inclusive at both ends, each optional, combining with every other filter and with `sort`/`order`. An invalid date answers 400.
        - By default the issues of projects deleted on the provider are excluded from `items` and `total`; `provider_deleted=true` includes them.
        - Any undocumented query parameter answers 400 naming it.
        - `page` (default 1, minimum 1, clamped up) and `per_page` (default 20, capped at 100) paginate after visibility and filters; `total` is that count.
      security:
        - sessionCookie: []
      parameters:
        - name: status
          in: query
          required: false
          style: form
          explode: true
          schema: { type: array, items: { $ref: '#/components/schemas/IssueStatus' }, maxItems: 100 }
          description: 'Multi-value: repeat `status=<value>` to OR exact values, at most 100. Omitted means every status except Dismissed.'
        - name: control_type
          in: query
          required: false
          style: form
          explode: true
          schema: { type: array, items: { type: string }, maxItems: 100 }
          description: 'Multi-value: repeat `control_type=<value>` to OR exact values, at most 100. Omitted means no filter.'
        - name: issue_type
          in: query
          required: false
          style: form
          explode: true
          schema: { type: array, items: { type: string, pattern: '^ISSUE-[0-9]{3}$' }, maxItems: 100 }
          description: 'Multi-value: repeat `issue_type=<value>` to OR exact values, at most 100. The issue''s own ISSUE-nnn code (IssueSummary.code, the key of GET /issue-types): what fired, whereas control_type filters the owning control, which may own several issue types. Every value must match ^ISSUE-[0-9]{3}$; any other value answers 400 naming the field. Omitted means no filter.'
        - name: severity
          in: query
          required: false
          style: form
          explode: true
          schema: { type: array, items: { type: string, enum: [critical, high, medium, low] }, maxItems: 100 }
          description: 'Multi-value: repeat `severity=<value>` to OR values, at most 100. Values are matched case-insensitively against critical/high/medium/low; any other value answers 400 naming the field. An issue with no severity never matches. Omitted means no filter.'
        - { name: project, in: query, required: false, schema: { type: string }, description: 'Exact provider project path.' }
        - { name: portfolio, in: query, required: false, schema: { type: string, format: uuid }, description: 'Portfolio id; resolved to its current project set.' }
        - name: policy
          in: query
          required: false
          schema: { type: string }
          description: 'A policy id (uuid) or a policy name; matches issues currently required by that policy. An unknown value answers an empty page.'
        - name: owner
          in: query
          required: false
          style: form
          explode: true
          schema: { type: array, items: { type: string }, maxItems: 100 }
          description: 'Multi-value: repeat `owner=<value>` to OR exact platform user ids, at most 100. Omitted means no filter.'
        - { name: q, in: query, required: false, schema: { type: string }, description: 'Case-insensitive literal substring match against control_type, the issue code (ISSUE-nnn, so q=505 finds ISSUE-505) and the project path; trimmed, % and _ match literally, multi-word phrases match only as exact substrings.' }
        - name: fixable
          in: query
          required: false
          schema: { type: boolean }
          description: 'true narrows to issues currently eligible for triggerFix (a fix exists for the issue''s control and its status is Detected or In progress). Only true/false are accepted; any other value answers 400.'
        - { name: provider_deleted, in: query, required: false, schema: { type: boolean, default: false }, description: 'Omitted or false hides the issues of projects deleted on the provider (their status is untouched); true includes them, as on listProjects.' }
        - { name: first_detected_since, in: query, required: false, schema: { type: string, format: date }, description: 'Inclusive lower bound on the issue''s first_detected_at (UTC calendar date). Omitted means no bound.' }
        - { name: first_detected_before, in: query, required: false, schema: { type: string, format: date }, description: 'Inclusive upper bound on the issue''s first_detected_at (UTC calendar date); the named day is in range. Omitted means no bound.' }
        - { name: updated_since, in: query, required: false, schema: { type: string, format: date }, description: 'Inclusive lower bound on the issue''s updated_at, when it last moved (UTC calendar date). Independent of the first_detected bounds. Omitted means no bound.' }
        - { name: updated_before, in: query, required: false, schema: { type: string, format: date }, description: 'Inclusive upper bound on the issue''s updated_at (UTC calendar date); the named day is in range. Omitted means no bound.' }
        - { name: page, in: query, required: false, schema: { type: integer, default: 1 }, description: 'Minimum 1; values below 1 are clamped up to 1.' }
        - { name: per_page, in: query, required: false, schema: { type: integer, default: 20 }, description: 'Capped at 100; values above 100 are clamped down.' }
        - name: sort
          in: query
          required: false
          schema: { type: string, enum: [first_detected_at, updated_at, severity], default: first_detected_at }
          description: 'Ordering key, default first_detected_at. severity orders semantically (critical > high > medium > low > empty), never alphabetically. Any other value answers 400.'
        - name: order
          in: query
          required: false
          schema: { type: string, enum: [asc, desc], default: desc }
          description: 'Ordering direction, default desc. Any other value answers 400.'
      responses:
        '200':
          description: One page of the caller's visible issues.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IssueList' }
        '400': { description: 'An undocumented query parameter (named in the body); a status, severity, fixable, sort or order value outside its vocabulary (naming the field and the allowed set); provider_deleted not "true" or "false"; a period bound that is not a valid YYYY-MM-DD date (naming the field); an issue_type value outside ^ISSUE-[0-9]{3}$ (naming the field); or a multi-value filter repeated more than 100 times (naming the field).' }
        '401': { description: No live session. }
        '403':
          description: 'The caller is below Member, or the provider refused the caller''s token; the body says to log in again, or that your account may have been blocked.'
        '500':
          description: 'An internal error; the body is the fixed string "issues request failed".'
        '503':
          description: 'The platform could not verify your session or your role with the provider: an infrastructure failure, retry later. During a provider outage a GET or HEAD may still be served from a role cached before the outage (grace window, default 15 minutes past the cache TTL); a write always answers 503.'
  /issues/summary:
    get:
      operationId: getIssuesSummary
      summary: Issue counts by status and severity, over the caller's visible projects (Member)
      description: |-
        The same population `listIssues` answers, under the same filters and the same visibility, as counts instead of a page: `total`, `by_status` and `by_severity`. Accepts every `listIssues` query parameter except `page`, `per_page`, `sort` and `order`, with the same semantics; any other parameter answers 400 naming it. Requires Member.

        - `total` and `by_severity` apply the caller's filters exactly as `listIssues` does, including the default status rule (every status except Dismissed) and the default `provider_deleted` rule; `total` equals `listIssues`' `total` for the same query string.
        - `by_status` ignores the `status` filter and keeps every other one, so selecting a status does not zero the other status counts.
        - `by_status` always carries all four statuses (`Detected`, `In progress`, `Fixed`, `Dismissed`) and `by_severity` all four severities (`critical`, `high`, `medium`, `low`), with `0` where nothing matches.
        - An issue with no severity counts in `total` and its `by_status` bucket but in no `by_severity` bucket, so the `by_severity` sum can be smaller than `total`.
        - An unknown or foreign-org `portfolio`/`policy`, or an unknown or invisible `project`, answers all zeros with every key present, never an error.
      security:
        - sessionCookie: []
      parameters:
        - name: status
          in: query
          required: false
          style: form
          explode: true
          schema: { type: array, items: { $ref: '#/components/schemas/IssueStatus' }, maxItems: 100 }
          description: 'Multi-value, as on listIssues. Narrows `total` and `by_severity` but not `by_status` (see the operation description). Omitted means every status except Dismissed, for `total`/`by_severity`.'
        - name: control_type
          in: query
          required: false
          style: form
          explode: true
          schema: { type: array, items: { type: string }, maxItems: 100 }
          description: 'MULTI-VALUE, as on listIssues. Narrows all three numbers.'
        - name: issue_type
          in: query
          required: false
          style: form
          explode: true
          schema: { type: array, items: { type: string, pattern: '^ISSUE-[0-9]{3}$' }, maxItems: 100 }
          description: 'Multi-value: repeat `issue_type=<value>` to OR exact values, at most 100. The issue''s own ISSUE-nnn code (IssueSummary.code, the key of GET /issue-types): what fired, whereas control_type filters the owning control, which may own several issue types. Every value must match ^ISSUE-[0-9]{3}$; any other value answers 400 naming the field. Omitted means no filter. Narrows all three numbers.'
        - name: severity
          in: query
          required: false
          style: form
          explode: true
          schema: { type: array, items: { type: string, enum: [critical, high, medium, low] }, maxItems: 100 }
          description: 'MULTI-VALUE and case-insensitive against the frozen vocabulary, as on listIssues. Narrows all three numbers, `by_status` included.'
        - { name: project, in: query, required: false, schema: { type: string }, description: 'Exact provider project path.' }
        - { name: portfolio, in: query, required: false, schema: { type: string, format: uuid }, description: 'Portfolio id; resolved to its current project set.' }
        - { name: policy, in: query, required: false, schema: { type: string }, description: 'A policy id (uuid) or a policy name, matched as on listIssues.' }
        - name: owner
          in: query
          required: false
          style: form
          explode: true
          schema: { type: array, items: { type: string }, maxItems: 100 }
          description: 'MULTI-VALUE, as on listIssues.'
        - { name: q, in: query, required: false, schema: { type: string }, description: 'Substring match against control_type, the issue code and the project path, case-insensitive, literal - exactly as on listIssues.' }
        - { name: fixable, in: query, required: false, schema: { type: boolean }, description: 'true narrows to issues currently eligible for triggerFix, exactly as on listIssues. Strict: only true/false are accepted.' }
        - { name: provider_deleted, in: query, required: false, schema: { type: boolean, default: false }, description: 'Omitted or false hides the issues of projects deleted on the provider; true includes them. Applies to all three numbers.' }
        - { name: first_detected_since, in: query, required: false, schema: { type: string, format: date }, description: 'Inclusive lower bound on first_detected_at (UTC calendar date). Omitted means no bound.' }
        - { name: first_detected_before, in: query, required: false, schema: { type: string, format: date }, description: 'Inclusive upper bound on first_detected_at (UTC calendar date); the named day is in range. Omitted means no bound.' }
        - { name: updated_since, in: query, required: false, schema: { type: string, format: date }, description: 'Inclusive lower bound on updated_at (UTC calendar date). Omitted means no bound.' }
        - { name: updated_before, in: query, required: false, schema: { type: string, format: date }, description: 'Inclusive upper bound on updated_at (UTC calendar date); the named day is in range. Omitted means no bound.' }
      responses:
        '200':
          description: The counts for the caller's visible, filtered issues.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IssuesSummary' }
        '400': { description: 'An undocumented query parameter (named in the body; page, per_page, sort and order are not accepted here); a status, severity or fixable value outside its vocabulary; provider_deleted not "true" or "false"; a period bound that is not a valid YYYY-MM-DD date (naming the field); an issue_type value outside ^ISSUE-[0-9]{3}$ (naming the field); or a multi-value filter repeated more than 100 times (naming the field).' }
        '401': { description: No live session. }
        '403':
          description: 'The caller is below Member, or the provider refused the caller''s token; the body says to log in again, or that your account may have been blocked.'
        '500':
          description: 'An internal error; the body is the fixed string "issues request failed".'
        '503':
          description: 'The platform could not verify your session or your role with the provider: an infrastructure failure, retry later. During a provider outage a GET or HEAD may still be served from a role cached before the outage (grace window, default 15 minutes past the cache TTL); a write always answers 503.'
  /issues/trend:
