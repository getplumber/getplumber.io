  /audit/config:
    get:
      operationId: listAuditConfig
      summary: 'Config-change trail: every config mutation, newest first (Maintainer)'
      description: |-
        The org's config-change trail: at most one row per successful config-mutating write, newest first (`created_at` descending). Each row carries who acted (`actor_name`, null for a system write or a since-deleted user), what kind of entity changed (`entity_kind`, see `AuditConfigKind`), what happened (`action`: `created`, `updated`, `deleted` or `rotated`), and a short label captured at write time, which survives the entity's later deletion.

        - Recording is best-effort, after the write itself: a row can be lost when the platform fails right after the write, with no retry or backfill.
        - Windowed to the last 30 days, for the list and `total` alike.
        - `page` and `per_page` paginate the window; `total` counts every match within it.
        - `entity_kind`, `action`, `actor` and `from`/`to` filters combine; a system write never matches an `actor` filter; `from`/`to` stay within the 30-day window (a `from` earlier than the window never widens it).
        - Requires a session at Maintainer level or above. The trail never stores secret content: `entity_label`, `action` and `actor_name` are its only facts.
      security:
        - sessionCookie: []
      parameters:
        - { name: page, in: query, required: false, schema: { type: integer, default: 1 }, description: 'Minimum 1; values below 1 are clamped up to 1.' }
        - { name: per_page, in: query, required: false, schema: { type: integer, default: 20 }, description: 'Capped at 100; values above 100 are clamped down.' }
        - { name: entity_kind, in: query, required: false, schema: { $ref: '#/components/schemas/AuditConfigKind' }, description: 'Exact-match filter. Any other value answers 400.' }
        - { name: action, in: query, required: false, schema: { $ref: '#/components/schemas/AuditConfigAction' }, description: 'Exact-match filter. Any other value answers 400.' }
        - { name: actor, in: query, required: false, schema: { type: string, format: uuid }, description: 'Exact-match filter against the platform user id. A malformed value answers 400.' }
        - { name: from, in: query, required: false, schema: { type: string, format: date-time }, description: 'RFC3339 lower bound, intersected with the fixed 30-day window (never widens past it). A malformed value answers 400.' }
        - { name: to, in: query, required: false, schema: { type: string, format: date-time }, description: 'RFC3339 upper bound (inclusive). A malformed value answers 400.' }
      responses:
        '200':
          description: One page of the org's config-change trail, newest first.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditConfigList' }
        '400': { description: 'An undocumented query parameter was supplied (naming it), entity_kind/action is not a recognized value, actor is not a valid id, or from/to is not a valid RFC3339 date-time.' }
        '401': { description: No live session. }
        '403':
