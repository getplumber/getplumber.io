        '403':
          description: 'The caller is below Maintainer, the org''s licence level is below 2 (portfolios require licence level 2 or above, see LicenceStatus.level), or the provider refused the caller''s token (the fixed body "your access could not be verified with the provider: log in again, or your account may have been blocked"); log in again.'
        '409':
          description: 'A referenced id is unknown, belongs to a different org, or is not visible to the caller.'
        '500':
          description: 'An internal failure (for example a database error), never a client-caused rejection; the body is the fixed string "config write failed" with no diagnostic detail.'
        '503':
          description: 'The platform could not verify the caller''s session or determine the caller''s role (an infrastructure failure, not a refusal); retry later. During a provider outage a GET or HEAD may still be served from a role cached before the outage (by default up to 15 minutes past the cache TTL); a write is never served that way.'
        '404': { description: 'Unknown portfolio id, or a portfolio belonging to a different org.' }

  /config/portfolios/{id}/projects:
    get:
      operationId: listPortfolioProjects
      summary: The portfolio's full resolved-project set, paginated
      description: |-
        The portfolio's full resolved-project set: explicit projects plus every project matching a group rule, computed at read time. Keyset-paginated (`per_page`/`after`), since a single group rule can match an entire fleet. Requires Member or above.

        - `{id}` must belong to the caller's own org (404 otherwise; unknown ids and ids belonging to a different org are indistinguishable).
        - `items` only lists the projects the caller can currently see; `total` is not filtered this way.
        - `per_page` (default 20, capped at 100). `after` is the opaque cursor from a previous page's `next_cursor`; omitted or empty starts from the first page. A malformed `after` is a 400, never silently treated as the first page.
        - `freshness`/`language`/`last_active_since`/`last_active_before`/`archived`/`provider_deleted`: the same six facets as `GET /projects`, narrowing this portfolio's resolved set; `total` narrows identically.
      security:
        - sessionCookie: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: per_page, in: query, schema: { type: integer } }
        - { name: after, in: query, schema: { type: string } }
        - name: freshness
          in: query
          required: false
          style: form
          explode: true
          schema: { type: array, items: { $ref: '#/components/schemas/Freshness' } }
          description: 'Optional multi-value filter, the same repeated-parameter shape as GET /projects: freshness=<value>&freshness=<value>..., each validated against the Freshness vocabulary, multiple values OR-ed together. Omitted means no filter.'
        - { name: language, in: query, required: false, schema: { type: string }, description: 'Matches a key of the row''s languages map, case-insensitive. A row with no languages collected yet never matches.' }
        - { name: last_active_since, in: query, required: false, schema: { type: string, format: date }, description: 'Inclusive lower bound on last_activity_at (UTC calendar date); a row with no last_activity_at is excluded.' }
        - { name: last_active_before, in: query, required: false, schema: { type: string, format: date }, description: 'Inclusive upper bound on last_activity_at (UTC calendar date); a row with no last_activity_at is excluded.' }
        - name: archived
          in: query
          required: false
          schema: { type: boolean, default: false }
          description: 'Defaults to false: archived rows are excluded, as in GET /projects. true opts them back in, independently of provider_deleted. Any value other than "true" or "false" is a 400.'
        - name: provider_deleted
          in: query
          required: false
          schema: { type: boolean, default: false }
          description: 'Defaults to false: provider-deleted rows are excluded, as in GET /projects. true opts them back in, independently of archived. Any value other than "true" or "false" is a 400.'
      responses:
        '200':
          description: One page of the portfolio's resolved-project set.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PortfolioProjectsPage' }
        '400': { description: 'Malformed portfolio id (not a valid uuid), a malformed `after` cursor, or freshness/archived/provider_deleted carries an unrecognized value, or last_active_since/last_active_before is not a valid YYYY-MM-DD date - naming the field and, for the closed vocabularies, the allowed set.' }
        '401': { description: No live session. }
        '403':
          description: 'The caller is below Member, or the provider refused the caller''s token (the fixed body "your access could not be verified with the provider: log in again, or your account may have been blocked"); log in again.'
        '500':
          description: 'An internal failure (for example a database error), never a client-caused rejection; the body is the fixed string "config write failed" with no diagnostic detail.'
        '503':
          description: 'The platform could not verify the caller''s session or determine the caller''s role (an infrastructure failure, not a refusal), or could not resolve the caller''s visible project set with the provider; retry later. During a provider outage a GET or HEAD may still be served from a role cached before the outage (by default up to 15 minutes past the cache TTL); a write is never served that way.'
        '404': { description: 'Unknown portfolio id, or a portfolio belonging to a different org.' }
    put:
      operationId: replacePortfolioProjects
      summary: Full-set replace of a portfolio's explicit projects
      description: |-
        The request body is the complete desired explicit-project set for every project the caller can see, never a diff. A project the caller cannot see stays included as before: leaving it out of the body does not remove it. Submitting the id of a project the caller cannot see is rejected (409), never silently accepted.

        - Only the projects entering or leaving the resolved set are marked stale; group-rule matches are unaffected by this call.
        - Requires Maintainer.
      security:
        - sessionCookie: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PortfolioProjectsRequest' }
      responses:
        '204':
          description: 'Replaced; the projects entering or leaving the resolved set are marked stale and a project.update event is emitted for each.'
        '400': { description: 'Validation failed, naming the field: project_ids absent from the body (an explicit empty array is a valid full clear), an unrecognized top-level field, or a malformed project id.' }
        '401': { description: No live session. }
        '403':
          description: 'The caller is below Maintainer, the org''s licence level is below 2 (portfolios require licence level 2 or above, see LicenceStatus.level), or the provider refused the caller''s token (the fixed body "your access could not be verified with the provider: log in again, or your account may have been blocked"); log in again.'
        '500':
          description: 'An internal failure (for example a database error), never a client-caused rejection; the body is the fixed string "config write failed" with no diagnostic detail.'
        '503':
          description: 'The platform could not verify the caller''s session or determine the caller''s role (an infrastructure failure, not a refusal), or could not resolve the caller''s visible project set with the provider; retry later. During a provider outage a GET or HEAD may still be served from a role cached before the outage (by default up to 15 minutes past the cache TTL); a write is never served that way.'
        '404': { description: 'Unknown portfolio id, or a portfolio belonging to a different org.' }
        '409': { description: 'A referenced project_id is unknown, belongs to a different org than the portfolio, or is not visible to the caller. No partial write; the whole replace rolls back.' }

  /config/portfolios/{id}/excluded-projects:
    put:
      operationId: replacePortfolioExcludedProjects
      summary: Full-set replace of the projects excluded from a portfolio's rule matches
      description: |-
        Excludes specific projects from what the portfolio's group rules match, without giving up the rule. The resolved set becomes `(projects UNION rule matches) MINUS excluded_projects`, and every surface that reads membership applies the same subtraction (`resolved_count`, `resolved_projects`, `GET /config/portfolios/{id}/projects`, `PortfolioSummary.resolved_project_count`, `ProjectListItem.portfolio_count`/`portfolio_ids`, the `?portfolio_id=` inventory filter, policy governed sets, `/context`). The excluded ids are returned in `PortfolioDetail.excluded_projects`. Requires Maintainer and licence level 2 or above.

        - The body is the complete desired exclusion set, never a diff. Absent or null `excluded_project_ids` is a 400; an explicit empty array clears every exclusion.
        - A newly added id is accepted only when a group rule of this portfolio currently matches it; a new id no rule reaches is a 400. An id already in the stored exclusion set is not re-checked and may stay even if no rule matches it any more; it excludes nothing and is removed by resubmitting the set without it, or by making the project an explicit member.
        - An id that is an explicit member is a 400 with its own distinct reason, stored or new: an explicit member is removed through `replacePortfolioProjects`, not excluded.
        - Adding an already-excluded project through `replacePortfolioProjects` drops its exclusion in the same transaction: an explicit member is never excluded.
        - Only the projects entering or leaving the resolved set are marked stale. Excluding a project also closes the issues of any policy it thereby loses, reported on the `project.update` event as `issues_closed`.
        - Excluding a project does not free a licence slot: a slot is consumed by deployment (see `LicenceStatus`), never by portfolio membership.
      security:
        - sessionCookie: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PortfolioExcludedProjectsRequest' }
      responses:
        '204': { description: 'Replaced; the projects entering or leaving the resolved set are marked stale and a project.update event is emitted for each, with any issues_closed count.' }
        '400': { description: 'Validation failed, naming the field and the offending ids: excluded_project_ids absent from the body (an explicit empty array is a valid full clear), an unrecognized top-level field, a malformed project id, more than 100 entries, a newly added id no group rule of this portfolio matches (an already-stored id is not re-checked), or an id that is an explicit member, stored or new (remove it instead).' }
        '401': { description: No live session. }
        '403':
          description: 'The caller is below Maintainer, the org''s licence level is below 2 (portfolios require licence level 2 or above, see LicenceStatus.level), or the provider refused the caller''s token (the fixed body "your access could not be verified with the provider: log in again, or your account may have been blocked"); log in again.'
        '404': { description: 'Unknown portfolio id, or a portfolio belonging to a different org.' }
        '500':
          description: 'An internal failure (for example a database error), never a client-caused rejection; the body is the fixed string "config write failed" with no diagnostic detail.'
        '503':
          description: 'The platform could not verify the caller''s session or determine the caller''s role (an infrastructure failure, not a refusal); retry later. During a provider outage a GET or HEAD may still be served from a role cached before the outage (by default up to 15 minutes past the cache TTL); a write is never served that way.'
        '409':
          description: 'A submitted project was deleted concurrently while the request was in flight; nothing is written. Retry with a body that no longer names the vanished project.'
  /config/portfolios/{id}/policies:
    put:
      operationId: replacePortfolioPolicies
      summary: Replace the set of policies assigned to a portfolio (full set)
      description: |-
        The portfolio-side counterpart of the `portfolio_ids` half of `PUT /config/policies/{id}/assignments`. The body is the complete desired policy set: each policy newly present is assigned to the portfolio, each policy no longer present is unassigned, in one transaction. A project entering or leaving a policy's governed set is marked stale (a member the policy's scope filter excludes never moves); a project that loses a policy has that policy's issues closed, carried as `issues_closed`.

        - `{id}` must belong to the caller's own org (404 otherwise); every policy id must too (404 "policy not found", whole request rolled back).
        - Requires Maintainer level and licence level 2.
      security:
        - sessionCookie: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PortfolioPoliciesRequest' }
      responses:
        '204': { description: 'Replaced.' }
        '400': { description: 'Validation failed, naming the field: policy_ids absent from the body (an explicit empty array is a valid full clear), an unrecognized top-level field, a malformed policy id, or more than 100 entries.' }
        '401': { description: No live session. }
        '403':
          description: 'The caller is below Maintainer, the org''s licence level is below 2 (portfolios require licence level 2 or above, see LicenceStatus.level), or the provider refused the caller''s token (the fixed body "your access could not be verified with the provider: log in again, or your account may have been blocked"); log in again.'
        '500':
          description: 'An internal failure (for example a database error), never a client-caused rejection; the body is the fixed string "config write failed" with no diagnostic detail.'
        '503':
          description: 'The platform could not verify the caller''s session or determine the caller''s role (an infrastructure failure, not a refusal); retry later. During a provider outage a GET or HEAD may still be served from a role cached before the outage (by default up to 15 minutes past the cache TTL); a write is never served that way.'
        '404': { description: 'Portfolio or a policy not found in the caller''s org.' }
        '409':
          description: 'The portfolio''s policy set changed concurrently while this request was in flight; nothing was written, the body is "the configuration changed concurrently, retry the request". Send the identical request again.'
  /config/portfolios/{id}/score-history:
    get:
      operationId: portfolioScoreHistory
      summary: Daily score trend for a portfolio
      description: |-
        A bounded date series in the org calendar, one point per day the portfolio has data for; the portfolio counterpart of `GET /config/policies/{id}/score-history`, same shape. Requires Member or above.

        - `{id}` must belong to the caller's own org (404 otherwise; unknown ids and ids belonging to a different org are indistinguishable).
        - `from`/`to` are calendar dates in the org calendar (`YYYY-MM-DD`, never a date-time). Both optional: `to` defaults to today, `from` to `to` minus 89 days. The range must not exceed 400 days and `from` must not be after `to` (400 otherwise).
        - Each `day` is the average, across the portfolio's current projects (explicit projects plus group-rule matches, as resolved now, not as they stood on that day), of each project's score at that day (its last completed run at or before that day's end), rounded half-up to one decimal. A project with no run at or before that day, or whose run then was unscorable (degraded collection, every policy withholding its score, or nothing evaluated), contributes nothing and is never averaged in as a 0. A day where no project has data is absent from `items` (a gap), never a zero-value point. Past days reshape when the portfolio's resolved project set changes.
        - If the range includes today, one freshly computed point for today is appended, against the current resolved set; if that computation fails, the point is omitted and every stored day is still returned.
        - `items` is ordered by `day` ascending; a gap is never backfilled or interpolated.
        - The current project set here spans every git instance of the org, unlike the `score_points` field of `GET /config/portfolios/{id}`, which is scoped to the caller's own login instance; in a multi-instance org the two can differ.
        - Days are the org's own calendar (its `timezone` setting), the same for every viewer; render `day` as a label, never through the browser clock. The response's `timezone` field names that calendar.
      security:
        - sessionCookie: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: from, in: query, required: false, schema: { type: string, format: date }, description: 'Calendar date lower bound (inclusive), read in the org calendar. Defaults to `to` minus 89 days.' }
        - { name: to, in: query, required: false, schema: { type: string, format: date }, description: 'Calendar date upper bound (inclusive), read in the org calendar. Defaults to the org today.' }
      responses:
        '200':
          description: The portfolio's daily score trend.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScoreHistory' }
        '400': { description: 'Malformed portfolio id, a malformed from/to date, from after to, or a resolved range over 400 days.' }
        '401': { description: No live session. }
        '403':
          description: 'The caller is below Member, or the provider refused the caller''s token (the fixed body "your access could not be verified with the provider: log in again, or your account may have been blocked"); log in again.'
        '500':
          description: 'An internal failure (for example a database error), never a client-caused rejection; the body is the fixed string "config write failed" with no diagnostic detail, or "trend unavailable" when the org''s timezone cannot be resolved.'
        '503':
          description: 'The platform could not verify the caller''s session or determine the caller''s role (an infrastructure failure, not a refusal); retry later. During a provider outage a GET or HEAD may still be served from a role cached before the outage (by default up to 15 minutes past the cache TTL); a write is never served that way.'
        '404': { description: 'Unknown portfolio id, or a portfolio belonging to a different org.' }

  /config/portfolios/{id}/rules:
    put:
      operationId: replacePortfolioRules
      summary: "Full-set replace of a portfolio's group: path rules"
      description: |-
        A rule is a group path prefix (e.g. `team-a`), not a reference to a group object. A project belongs if its path equals the rule or sits under it: `team-a` matches `team-a/api` and `team-a/sub/web`, but never `team-alpha`. Matching is dynamic: projects that later appear under the path join automatically.

        - A path with a typo is accepted and simply matches nothing.
        - Rules track the path string, not the group's identity: if a group is renamed on the provider, the rule stops matching until it is updated to the new path.
        - The request body is the complete desired rule set, never a diff.
        - Only the projects entering or leaving the resolved set are marked stale; explicit projects are unaffected by this call, and a project a surviving rule matches before and after the replace is never staled.
        - Duplicate `group_path` values collapse rather than causing an error.
        - Requires Maintainer.
      security:
        - sessionCookie: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PortfolioRulesRequest' }
      responses:
        '204':
          description: 'Replaced; the projects entering or leaving the resolved set are marked stale and a project.update event is emitted for each.'
        '400': { description: 'Validation failed, naming the field: group_paths absent from the body (an explicit empty array is a valid full clear), an unrecognized top-level field, or an empty group_path.' }
        '401': { description: No live session. }
        '403':
          description: 'The caller is below Maintainer, the org''s licence level is below 2 (portfolios require licence level 2 or above, see LicenceStatus.level), or the provider refused the caller''s token (the fixed body "your access could not be verified with the provider: log in again, or your account may have been blocked"); log in again.'
        '409':
          description: 'A referenced id is unknown, belongs to a different org, or is not visible to the caller.'
        '500':
          description: 'An internal failure (for example a database error), never a client-caused rejection; the body is the fixed string "config write failed" with no diagnostic detail.'
        '503':
          description: 'The platform could not verify the caller''s session or determine the caller''s role (an infrastructure failure, not a refusal); retry later. During a provider outage a GET or HEAD may still be served from a role cached before the outage (by default up to 15 minutes past the cache TTL); a write is never served that way.'
        '404': { description: 'Unknown portfolio id, or a portfolio belonging to a different org.' }

  /catalog/repos:
    get:
      operationId: listCatalogRepos
      summary: List the org's registered catalog repositories (Member)
      description: |-
        Every repository this org has registered for continuous template cataloging, newest first.

        - `page` (default 1, minimum 1 - values below 1 are clamped up) and `per_page` (default 20, capped at 100) paginate the org's own repositories.
        - Requires an authenticated session at Member level or above.
      security:
        - sessionCookie: []
      parameters:
        - { name: page, in: query, required: false, schema: { type: integer, default: 1 }, description: 'Minimum 1; values below 1 are clamped up to 1.' }
        - { name: per_page, in: query, required: false, schema: { type: integer, default: 20 }, description: 'Capped at 100; values above 100 are clamped down.' }
      responses:
        '200':
          description: One page of the org's registered catalog repositories.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CatalogRepoList' }
        '401': { description: No live session. }
        '403':
          description: 'The caller is below Member, or the provider refused the caller''s token (the fixed body "your access could not be verified with the provider: log in again, or your account may have been blocked"); log in again.'
        '500':
          description: 'An internal failure (for example a database error), never a client-caused rejection; the body is the fixed string "catalog request failed" with no diagnostic detail.'
        '503':
          description: 'The platform could not verify the caller''s session or determine the caller''s role (an infrastructure failure, not a refusal); retry later. During a provider outage a GET or HEAD may still be served from a role cached before the outage (by default up to 15 minutes past the cache TTL); a write is never served that way.'
    post:
      operationId: registerCatalogRepo
      summary: Register a repository for continuous template cataloging (OrgAdmin)
      description: |-
        Adds a repository to the org's catalog: the platform confirms the repository exists and is reachable, records it, and schedules a first scan in the background. Scanning never runs inline - this call returns before any file is read; poll `listCatalogSyncs` with the returned `sync_id` to follow the scan's own progress.

        - `project_id` identifies the repository on the org's connected git provider.
        - The org's connected git provider must support cataloging; a repository on an unsupported provider is rejected.
        - Registering the same repository twice for the same org is rejected.
        - Requires an authenticated session at OrgAdmin level.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CatalogRepoRegisterRequest' }
      responses:
        '201':
          description: Registered; a first scan is scheduled in the background.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CatalogRepoRegistered' }
        '400': { description: 'Malformed body: project_id missing or not a positive integer.' }
        '401': { description: No live session. }
        '403':
          description: 'The caller is below OrgAdmin, or the provider refused the caller''s token (the fixed body "your access could not be verified with the provider: log in again, or your account may have been blocked"); log in again.'
        '409': { description: This repository is already registered for the org. }
        '422': { description: 'The repository could not be found or is not reachable with the org''s own provider credentials, the org''s connected provider does not support cataloging, or the org has no provider credentials configured yet.' }
        '500':
          description: 'An internal failure (for example a database error), never a client-caused rejection; the body is the fixed string "catalog request failed" with no diagnostic detail.'
        '503':
          description: 'The platform could not verify the caller''s session or determine the caller''s role (an infrastructure failure, not a refusal), or the provider read needed to confirm the repository is rate-limited right now; the body tells the two apart. Retry shortly. During a provider outage a GET or HEAD may still be served from a role cached before the outage (by default up to 15 minutes past the cache TTL); a write is never served that way.'
  /catalog/repos/{repoId}:
    delete:
      operationId: deleteCatalogRepo
      summary: Remove a repository from the org's catalog (OrgAdmin)
      description: |-
        Removes the repository and everything cataloged from it (its templates, versions, and scan history); it stops being scanned. This never touches anything on the git provider itself.

        - `{repoId}` must belong to the caller's own org (404 otherwise).
        - Requires an authenticated session at OrgAdmin level.
      security:
        - sessionCookie: []
      parameters:
        - { name: repoId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Removed. }
        '400': { description: 'Malformed repoId (not a valid uuid); refused before any lookup.' }
        '401': { description: No live session. }
        '403':
          description: 'The caller is below OrgAdmin, or the provider refused the caller''s token (the fixed body "your access could not be verified with the provider: log in again, or your account may have been blocked"); log in again.'
        '500':
          description: 'An internal failure (for example a database error), never a client-caused rejection; the body is the fixed string "catalog request failed" with no diagnostic detail.'
        '503':
          description: 'The platform could not verify the caller''s session or determine the caller''s role (an infrastructure failure, not a refusal); retry later. During a provider outage a GET or HEAD may still be served from a role cached before the outage (by default up to 15 minutes past the cache TTL); a write is never served that way.'
        '404': { description: 'Unknown repository id, or a repository belonging to a different org.' }

  /catalog/repos/{repoId}/rescan:
    post:
      operationId: rescanCatalogRepo
      summary: Schedule a fresh scan of an already-registered repository (OrgAdmin)
      description: |-
        Schedules a new background scan for a repository already in the org's catalog, on top of whatever the nightly automatic scan already covers - useful right after pushing new templates upstream, without waiting for the next automatic pass.

        - `{repoId}` must belong to the caller's own org (404 otherwise).
        - The scan runs in the background; poll `listCatalogSyncs` with the returned `sync_id` for its outcome.
        - Requires an authenticated session at OrgAdmin level.
      security:
        - sessionCookie: []
      parameters:
        - { name: repoId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '202':
          description: A new scan is scheduled.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CatalogSyncScheduled' }
        '400': { description: 'Malformed repoId (not a valid uuid); refused before any lookup.' }
        '401': { description: No live session. }
        '403':
          description: 'The caller is below OrgAdmin, or the provider refused the caller''s token (the fixed body "your access could not be verified with the provider: log in again, or your account may have been blocked"); log in again.'
        '500':
          description: 'An internal failure (for example a database error), never a client-caused rejection; the body is the fixed string "catalog request failed" with no diagnostic detail.'
        '503':
          description: 'The platform could not verify the caller''s session or determine the caller''s role (an infrastructure failure, not a refusal); retry later. During a provider outage a GET or HEAD may still be served from a role cached before the outage (by default up to 15 minutes past the cache TTL); a write is never served that way.'
        '404': { description: 'Unknown repository id, or a repository belonging to a different org.' }
        '409': { description: A scan is already pending or running for this repository. }

  /catalog/repos/{repoId}/syncs:
    get:
      operationId: listCatalogSyncs
      summary: Scan history for one registered repository, newest first (Member)
      description: |-
        Every scan attempt recorded for this repository - the surface a client polls right after registering or rescanning to learn when a scan finished and what it found.

        - `{repoId}` scopes strictly to the caller's own org: an unknown id, or a repository belonging to a different org, answers an EMPTY page (`total: 0`), never an error (no existence leak).
        - `page` (default 1, minimum 1, values below 1 are clamped up) and `per_page` (default 20, capped at 100) paginate the repository's scan history; `total` reflects every match across every page.
        - Requires an authenticated session at Member level or above.
      security:
        - sessionCookie: []
      parameters:
        - { name: repoId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: page, in: query, required: false, schema: { type: integer, default: 1 }, description: 'Minimum 1; values below 1 are clamped up to 1.' }
        - { name: per_page, in: query, required: false, schema: { type: integer, default: 20 }, description: 'Capped at 100; values above 100 are clamped down.' }
      responses:
        '200':
          description: One page of this repository's scan history (empty when repoId is unknown or belongs to a different org).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CatalogSyncList' }
        '400': { description: Malformed repoId (not a valid uuid). }
        '401': { description: No live session. }
        '403':
          description: 'The caller is below Member, or the provider refused the caller''s token (the fixed body "your access could not be verified with the provider: log in again, or your account may have been blocked"); log in again.'
        '500':
          description: 'An internal failure (for example a database error), never a client-caused rejection; the body is the fixed string "catalog request failed" with no diagnostic detail.'
        '503':
          description: 'The platform could not verify the caller''s session or determine the caller''s role (an infrastructure failure, not a refusal); retry later. During a provider outage a GET or HEAD may still be served from a role cached before the outage (by default up to 15 minutes past the cache TTL); a write is never served that way.'
  /catalog/templates:
    get:
      operationId: listCatalogTemplates
      summary: Browse every template cataloged across the org's registered repositories (Member)
      description: |-
        Org-wide, across every repository the org has registered for cataloging - not scoped to one repository. Each row carries its owning repository, every known version, and its labels.

        - `q` is a case-insensitive substring match against the template's path and description.
        - `labels` is a comma-separated list of label names; a template matches when it carries at least one of them. Omitted applies no label filter.
        - `deprecated` filters to deprecated-only (`true`) or active-only (`false`); omitted returns both.
        - `page` (default 1, minimum 1 - values below 1 are clamped up) and `per_page` (default 20, capped at 100) paginate the org's own templates; `total` in the response reflects every match under the current filters, not just the page size.
        - `sort`/`order`: closed, case-sensitive enums. `sort=recent&order=desc` (the default) orders by `updated_at` descending. `id` is always the final tiebreak so pagination stays stable.
        - Requires an authenticated session at Member level or above.
      security:
        - sessionCookie: []
      parameters:
        - { name: q, in: query, required: false, schema: { type: string }, description: 'Case-insensitive substring match against the template path and description.' }
        - { name: labels, in: query, required: false, schema: { type: string }, description: 'Comma-separated label names; a template matches when it carries at least one of them. At most 50 names are considered; any beyond that are ignored.' }
        - { name: deprecated, in: query, required: false, schema: { type: boolean }, description: 'true for deprecated only, false for active only; omitted returns both.' }
        - { name: page, in: query, required: false, schema: { type: integer, default: 1 }, description: 'Minimum 1; values below 1 are clamped up to 1.' }
        - { name: per_page, in: query, required: false, schema: { type: integer, default: 20 }, description: 'Capped at 100; values above 100 are clamped down.' }
        - { name: sort, in: query, required: false, schema: { type: string, enum: [name, recent], default: recent }, description: 'Sort key. name orders by the template path; recent orders by updated_at. Default recent. id is always the final tiebreak. Any other value is a 400 naming the field and the allowed set.' }
        - { name: order, in: query, required: false, schema: { type: string, enum: [asc, desc], default: desc }, description: 'Sort direction, paired with sort. Default desc. Any other value is a 400 naming the field and the allowed set.' }
      responses:
        '200':
          description: One page of the org's cataloged templates.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CatalogTemplateList' }
        '400': { description: 'sort or order is not one of its own closed, case-sensitive vocabulary values, naming the field and the allowed set.' }
        '401': { description: No live session. }
        '403':
          description: 'The caller is below Member, or the provider refused the caller''s token (the fixed body "your access could not be verified with the provider: log in again, or your account may have been blocked"); log in again.'
        '500':
          description: 'An internal failure (for example a database error), never a client-caused rejection; the body is the fixed string "catalog request failed" with no diagnostic detail.'
        '503':
