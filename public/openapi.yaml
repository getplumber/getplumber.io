        - Join an entry to an issue by `code` (`IssueSummary.code`, the finding's `ISSUE-nnn` code); `control_type` alone cannot disambiguate a control owning several issue types.
        - An issue type whose owning control the platform does not serve is not listed (the platform serves GitLab). An issue can still carry such a code (a GitHub project pushing results, or a CLI newer than the platform's pin): a code with no catalog entry is not an error, fall back to rendering the `code` itself.
      security:
