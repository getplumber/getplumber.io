        '400': { description: 'An undocumented query parameter (named in the body); a severity or fixable value outside its vocabulary (naming the field and the allowed set); provider_deleted not "true" or "false"; an issue_type value outside ^ISSUE-[0-9]{3}$ (naming the field); a multi-value filter repeated more than 100 times (naming the field); a malformed from/to date; from after to; or a range over 400 days.' }
        '401': { description: No live session. }
        '403':
          description: 'The caller is below Member, or the provider refused the caller''s token; the body says to log in again, or that your account may have been blocked.'
        '500':
