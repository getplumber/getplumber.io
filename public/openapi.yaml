  /projects/onboard:
    post:
      operationId: onboardProjects
      summary: Start onboarding a batch of projects, applying a policy set (Maintainer, visible only)
      description: |-
        Starts onboarding for every project in the batch: sets its directly-assigned policies to exactly the submitted `policy_ids` (never a diff), starts a new onboarding attempt and queues the merge request that adds the Plumber integration. Always 200 with per-item results: `{accepted: [{project_id, onboarding_id, warnings}], rejected: [{project_id, reason}]}`; a rejected item is left untouched. Requires Maintainer or above.

        - `project_ids` must be non-empty; `project_ids` and `policy_ids` are each capped at 100 entries (400 otherwise, before any per-item work). An empty `policy_ids` clears every direct assignment; the project still resolves whatever a covering group grants it.
        - Removing a policy this way closes the project's open issues that no longer require any policy; the project is not marked stale.
        - Rejection reasons: `not_found` (unknown, foreign or invisible project, indistinguishable), `not_onboardable` (already onboarded, or a removal in flight; an unboarded project is onboardable again), `no_component` (no integration component configured on the instance), `already_pending` (an attempt is already in flight), `provider_unsupported`, `policy_not_found` (a policy unknown or of another organization), `ci_disabled` (the project's CI/CD is disabled), `ci_config_external` (the project's `ci_config_path` points outside the repository).
        - `warnings` on an accepted item are best-effort notes from the project's last synced listing: `no_shared_runners` (shared runners disabled for this project; a specific runner may still be configured).
        - Licence cap: if onboarding the whole batch would push the org past its licence's `project_limit`, the call answers 422 before any per-item work.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OnboardRequest' }
      responses:
        '200':
          description: Per-item batch results.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OnboardResult' }
        '400': { description: 'Malformed body, empty project_ids, or either project_ids or policy_ids over its own 100-item cap.' }
        '401': { description: No live session. }
        '403':
          description: 'The caller is below Maintainer, or the provider refused the caller''s token; log in again, or the account may have been blocked.'
        '415':
          description: 'Content-Type is not application/json (application/json; charset=utf-8 is accepted, application/json-patch+json is refused). No project in the batch is onboarded.'
        '422': { description: 'Licence project cap exceeded: onboarding this batch would push the org past its licence''s project_limit. The message names the current usage count and the limit (see LicenceStatus/LicenceUsage); no project in the batch is onboarded. A project already counted against the licence (LicenceUsage.project_ids) consumes no additional slot on re-onboard.' }
        '500':
          description: 'An internal failure, not caused by the request; the body is the fixed string "onboard request failed".'
        '503':
          description: 'The platform could not verify the session, determine the caller''s role, or resolve the caller''s visible project set (session store or provider unreachable). During a provider outage a GET or HEAD may still be served from a role cached before the outage (a bounded grace window, 15 minutes past the cache TTL by default); a write always answers 503.'
  /projects/onboard/merge:
    post:
      operationId: mergeOnboardings
      summary: Batch-merge open onboarding merge requests (Maintainer, visible only)
      description: |-
        Merges the open merge request of every onboarding in the batch using the calling user's own provider OAuth token, so a provider-side rights or mergeability failure is reported per item. Always 200: `{merged: [onboarding_id...], failed: [{id, reason}]}`. `onboarding_ids` must be non-empty and at most 100 entries (400 otherwise). A successful merge completes the onboarding attempt and marks the project `running`; `deployment_status` becomes `onboarded` only once a verified push is received on the project's default branch. Requires Maintainer or above.

        Failure reasons: `not_found` (unknown, foreign or invisible, indistinguishable), `not_mergeable` (no open merge request: never opened, already merged or failed), `merge_not_ready` (the provider has not finished computing mergeability; retry shortly, see `OnboardMergeFailureReason`), `not_approved` / `discussions_not_resolved` / `ci_must_pass` / `need_rebase` / `conflict` (a decided provider blocker), `merge_failed` (any other provider-side refusal, including the caller's OAuth write token being unavailable).
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OnboardMergeRequest' }
      responses:
        '200':
          description: Per-item batch results.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OnboardMergeResult' }
        '400': { description: 'Malformed body, empty onboarding_ids, or onboarding_ids over the 100-item cap.' }
        '401': { description: No live session. }
        '403':
          description: 'The caller is below Maintainer, or the provider refused the caller''s token; log in again, or the account may have been blocked.'
        '415':
          description: 'Content-Type is not application/json (application/json; charset=utf-8 is accepted, application/json-patch+json is refused). No onboarding in the batch is merged.'
        '500':
          description: 'An internal failure, not caused by the request; the body is the fixed string "onboard request failed".'
        '503':
          description: 'The platform could not verify the session, determine the caller''s role, or resolve the caller''s visible project set (session store or provider unreachable). During a provider outage a GET or HEAD may still be served from a role cached before the outage (a bounded grace window, 15 minutes past the cache TTL by default); a write always answers 503.'
  /projects/unboard:
    post:
      operationId: unboardProjects
      summary: Start removing Plumber from a batch of onboarded or lost projects (Maintainer, visible only)
      description: |-
        Starts removal of the Plumber integration for every project in the batch: marks the project `unboarding` immediately, starts a new unboarding attempt and queues the merge request that removes the integration from its CI configuration; no further analysis push updates its display until the removal merges (`unboarded`) or the attempt fails. Always 200 with per-item results: `{accepted: [{project_id, unboarding_id}], rejected: [{project_id, reason}]}`. `project_ids` must be non-empty and at most 100 entries (400 otherwise). Requires Maintainer or above.

        Rejection reasons: `not_found` (unknown, foreign or invisible, indistinguishable), `not_unboardable` (the project is neither `onboarded` nor `lost`), `already_pending` (an unboarding attempt is already in flight), `in_flight` (an analysis re-check is running for this project; retry once it settles), `provider_unsupported`.
      security:
