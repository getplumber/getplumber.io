        '400': { description: 'A deployment_status, freshness, version_check or coverage value outside its vocabulary; archived, provider_deleted, has_onboarding_error, is_component_repo or official_component_repo not "true" or "false"; direct_children_only without path_prefix; a malformed policy_id, portfolio_id, date bound or after cursor; or an undocumented query parameter (named in the body; this includes sort, order and page, which this operation does not accept).' }
        '401': { description: No live session. }
        '403':
