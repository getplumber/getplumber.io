      operationId: issuesTrend
      summary: Daily open-issue count trend over the caller's visible issues (Member)
      description: |-
        For each day in the range, the count of matching issues that were `Detected` or `In progress` at the end of that day in the org calendar, reconstructed exactly from the issue history. Requires Member.

        - Accepts the same filters as `listIssues` except `status` (the series itself is the status dimension): `control_type`, `issue_type`, `severity`, `project`, `portfolio`, `policy`, `owner`, `q`, `fixable` and `provider_deleted`, with the same semantics.
        - Filters evaluate against each issue's current attributes, not its attributes on that day: `owner` and `severity` narrow every day of the series to issues currently owned by that user or currently at that severity.
        - `from`/`to` are `YYYY-MM-DD` calendar dates in the org calendar, both optional: `to` defaults to today, `from` to `to` minus 89 days. The range must not exceed 400 days and `from` must not be after `to` (400 otherwise).
        - `items` has one entry per day in the range, ascending; a day with zero open issues still gets an entry with `open_count` 0.
        - How the series is computed is not part of the contract and may change; do not assume either shape.
        - Any undocumented query parameter answers 400 naming it.
        - Days follow the org's own `timezone` setting, the same for every viewer; render `day` as a label, never through the browser clock. The response's `timezone` field names that calendar.
      security:
        - sessionCookie: []
      parameters:
        - { name: from, in: query, required: false, schema: { type: string, format: date }, description: 'Inclusive lower bound, a calendar date in the org calendar. Defaults to `to` minus 89 days.' }
        - { name: to, in: query, required: false, schema: { type: string, format: date }, description: 'Inclusive upper bound, a calendar date in the org calendar. Defaults to the org''s today.' }
        - name: control_type
          in: query
          required: false
          style: form
          explode: true
          schema: { type: array, items: { type: string }, maxItems: 100 }
