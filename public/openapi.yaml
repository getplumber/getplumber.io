          style: form
          explode: true
          schema: { type: array, items: { type: string, enum: [critical, high, medium, low] }, maxItems: 100 }
          description: 'Multi-value: repeat `severity=<value>` to OR values, at most 100. Values are matched case-insensitively against critical/high/medium/low, against each issue''s current severity; any other value answers 400. An issue with no severity never matches. Omitted means no filter.'
        - { name: project, in: query, required: false, schema: { type: string }, description: 'Exact provider project path.' }
        - { name: portfolio, in: query, required: false, schema: { type: string, format: uuid }, description: 'Portfolio id; resolved to its current project set.' }
        - name: policy
          in: query
          required: false
          schema: { type: string }
          description: 'A policy id (uuid) or a policy name, matched as on listIssues.'
        - name: owner
          in: query
          required: false
          style: form
          explode: true
          schema: { type: array, items: { type: string }, maxItems: 100 }
          description: 'Multi-value: repeat `owner=<value>` to OR exact platform user ids, matched against each issue''s current owner across every day of the series, at most 100. Omitted means no filter.'
        - { name: q, in: query, required: false, schema: { type: string }, description: 'Case-insensitive literal substring match against control_type, the issue code (ISSUE-nnn, so q=505 finds ISSUE-505) and the project path; trimmed, % and _ match literally, multi-word phrases match only as exact substrings.' }
        - name: fixable
          in: query
          required: false
          schema: { type: boolean }
          description: 'true narrows to issues currently eligible for triggerFix (a fix exists for the issue''s control and its status is Detected or In progress), evaluated against each issue''s current state. Only true/false are accepted; any other value answers 400.'
        - { name: provider_deleted, in: query, required: false, schema: { type: boolean, default: false }, description: 'Omitted or false hides the issues of projects deleted on the provider from every daily point, the same population the list and the summary show; true includes them, as on listIssues.' }
