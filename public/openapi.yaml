        - { name: from, in: query, required: false, schema: { type: string, format: date-time }, description: 'RFC3339 lower bound against created_at, unbounded when absent. A malformed value answers 400.' }
        - { name: to, in: query, required: false, schema: { type: string, format: date-time }, description: 'RFC3339 upper bound (inclusive) against created_at. A malformed value answers 400.' }
      responses:
        '200':
          description: One page of the org's fix history.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditFixList' }
        '400': { description: 'An undocumented query parameter was supplied (naming it), actor is not a valid id, status is not a recognized value, or from/to is not a valid RFC3339 date-time.' }
