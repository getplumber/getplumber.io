<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="t">
  <title id="t">The agent-framework 1.26.1 and 1.26.2 attack path, step by step: how the poisoned wheels reached PyPI, then how they ran inside a CI pipeline</title>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4E6B6B"/></marker>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0A0F0C"/><stop offset="100%" stop-color="#070A08"/></linearGradient>
  </defs>
  <rect width="1200" height="640" fill="url(#bg)" rx="16"/>
  <text x="64" y="48" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" letter-spacing="1.8" font-weight="700" fill="#F2B544">UPSTREAM · HOW THE BAD WHEELS REACHED PYPI (NOVEMBER 17, UTC)</text>
  <rect x="64" y="66" width="336" height="150" rx="12" fill="#0E1411" stroke="#192B2B" stroke-width="1.5"/>
  <circle cx="86" cy="90" r="13" fill="#F2B544"/>
  <text x="86" y="95" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="800" fill="#06110F">A</text>
  <text x="108" y="95" font-family="Segoe UI, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#FFFFFF">A publishing credential</text>
  <text x="80" y="120" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#C5CFCB">An account or token with publishing</text>
  <text x="80" y="139" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#C5CFCB">rights on the PyPI project.</text>
  <text x="80" y="158" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#C5CFCB">How it was obtained is not public.</text>
  <text x="80" y="177" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#C5CFCB">No matching git tag in the repo.</text>
  <line x1="404" y1="141.0" x2="442" y2="141.0" stroke="#4E6B6B" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="446" y="66" width="336" height="150" rx="12" fill="#0E1411" stroke="#192B2B" stroke-width="1.5"/>
  <circle cx="468" cy="90" r="13" fill="#F2B544"/>
  <text x="468" y="95" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="800" fill="#06110F">B</text>
  <text x="490" y="95" font-family="Segoe UI, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#FFFFFF">1.26.1 on PyPI</text>
  <text x="462" y="120" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#C5CFCB">20:35: one wheel, no sdist, no</text>
  <text x="462" y="139" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#C5CFCB">attestation. It becomes the latest</text>
  <text x="462" y="158" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#C5CFCB">version. The rest of the framework</text>
  <text x="462" y="177" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#C5CFCB">keeps working. Gone by 21:13.</text>
  <line x1="786" y1="141.0" x2="824" y2="141.0" stroke="#4E6B6B" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="828" y="66" width="336" height="150" rx="12" fill="#0E1411" stroke="#192B2B" stroke-width="1.5"/>
  <circle cx="850" cy="90" r="13" fill="#F2B544"/>
  <text x="850" y="95" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="800" fill="#06110F">C</text>
  <text x="872" y="95" font-family="Segoe UI, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#FFFFFF">1.26.2, 33 minutes later</text>
  <text x="844" y="120" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#C5CFCB">21:08: a second malicious wheel,</text>
  <text x="844" y="139" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#C5CFCB">now also after GitHub Actions</text>
  <text x="844" y="158" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#C5CFCB">OIDC tokens. Still the latest at 21:16.</text>
  <text x="844" y="177" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#C5CFCB">Both gone from PyPI by 22:00.</text>
  <path d="M 996.0 216 L 996.0 246 L 42 246 L 42 410.0 L 59 410.0" fill="none" stroke="#4E6B6B" stroke-width="2" marker-end="url(#arr)"/>
  <text x="76" y="266" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#93A3A3">the resolver picks the newest version</text>
  <text x="64" y="304" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" letter-spacing="1.8" font-weight="700" fill="#09C3C3">YOUR PIPELINE · HOW IT RAN ON THE RUNNER</text>
  <rect x="64" y="322" width="200" height="176" rx="12" fill="#0E1411" stroke="#192B2B" stroke-width="1.5"/>
  <circle cx="86" cy="346" r="13" fill="#09C3C3"/>
  <text x="86" y="351" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="800" fill="#06110F">1</text>
  <text x="108" y="351" font-family="Segoe UI, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#FFFFFF">Entry point</text>
  <text x="80" y="376" font-family="Consolas, 'Courier New', monospace" font-size="12.5" fill="#9CF3F3">pip install</text>
  <text x="80" y="395" font-family="Consolas, 'Courier New', monospace" font-size="12.5" fill="#9CF3F3">agent-framework</text>
  <text x="80" y="414" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#C5CFCB">with no version or hashes</text>
  <text x="80" y="433" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#C5CFCB">resolves to 1.26.1</text>
  <text x="80" y="452" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#C5CFCB">or 1.26.2.</text>
  <line x1="267" y1="410.0" x2="285" y2="410.0" stroke="#4E6B6B" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="288" y="322" width="200" height="176" rx="12" fill="#0E1411" stroke="#192B2B" stroke-width="1.5"/>
  <circle cx="310" cy="346" r="13" fill="#09C3C3"/>
  <text x="310" y="351" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="800" fill="#06110F">2</text>
  <text x="332" y="351" font-family="Segoe UI, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#FFFFFF">Code execution</text>
  <text x="304" y="376" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#C5CFCB">Python loads a</text>
  <text x="304" y="395" font-family="Consolas, 'Courier New', monospace" font-size="12.5" fill="#9CF3F3">.pth</text>
  <text x="304" y="414" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#C5CFCB">startup hook from</text>
  <text x="304" y="433" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#C5CFCB">site-packages on every</text>
  <text x="304" y="452" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#C5CFCB">start in that job: tests,</text>
  <text x="304" y="471" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#C5CFCB">scripts, even pip.</text>
  <line x1="491" y1="410.0" x2="509" y2="410.0" stroke="#4E6B6B" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="512" y="322" width="200" height="176" rx="12" fill="#0E1411" stroke="#192B2B" stroke-width="1.5"/>
  <circle cx="534" cy="346" r="13" fill="#09C3C3"/>
  <text x="534" y="351" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="800" fill="#06110F">3</text>
  <text x="556" y="351" font-family="Segoe UI, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#FFFFFF">What was reachable</text>
  <text x="528" y="376" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#C5CFCB">Secrets in env vars,</text>
  <text x="528" y="395" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#C5CFCB">Azure managed identity,</text>
  <text x="528" y="414" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#C5CFCB">Azure DevOps agent creds,</text>
  <text x="528" y="433" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#C5CFCB">GitHub OIDC if the job has</text>
  <text x="528" y="452" font-family="Consolas, 'Courier New', monospace" font-size="12.5" fill="#9CF3F3">id-token: write</text>
  <text x="528" y="471" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#C5CFCB">and credential files.</text>
  <line x1="715" y1="410.0" x2="733" y2="410.0" stroke="#4E6B6B" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="736" y="322" width="200" height="176" rx="12" fill="#0E1411" stroke="#192B2B" stroke-width="1.5"/>
  <circle cx="758" cy="346" r="13" fill="#09C3C3"/>
  <text x="758" y="351" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="800" fill="#06110F">4</text>
  <text x="780" y="351" font-family="Segoe UI, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#FFFFFF">Exfiltration</text>
  <text x="752" y="376" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#C5CFCB">Data sent to one</text>
  <text x="752" y="395" font-family="Consolas, 'Courier New', monospace" font-size="12.5" fill="#9CF3F3">webhook.site</text>
  <text x="752" y="414" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#C5CFCB">URL, a legitimate service.</text>
  <text x="752" y="433" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#C5CFCB">Match the full path, not</text>
  <text x="752" y="452" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#C5CFCB">the domain.</text>
  <line x1="939" y1="410.0" x2="957" y2="410.0" stroke="#4E6B6B" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="960" y="322" width="200" height="176" rx="12" fill="#0E1411" stroke="#192B2B" stroke-width="1.5"/>
  <circle cx="982" cy="346" r="13" fill="#09C3C3"/>
  <text x="982" y="351" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="800" fill="#06110F">5</text>
  <text x="1004" y="351" font-family="Segoe UI, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#FFFFFF">What stays</text>
  <text x="976" y="376" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#C5CFCB">The hook stays in</text>
  <text x="976" y="395" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#C5CFCB">site-packages: any cached</text>
  <text x="976" y="414" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#C5CFCB">venv, image or self-hosted</text>
  <text x="976" y="433" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#C5CFCB">runner from that evening</text>
  <text x="976" y="452" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#C5CFCB">runs it again.</text>
  <rect x="64" y="526" width="1072" height="78" rx="11" fill="#061A1A" stroke="#2AC7C7" stroke-width="1.5"/>
  <text x="84" y="549" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" letter-spacing="1.5" font-weight="700" fill="#2AC7C7">WHERE IT BREAKS</text>
  <text x="84" y="571" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">Step 1 never happens with a pinned version and hashes, and step 3 shrinks when id-token: write</text>
  <text x="84" y="592" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">lives only in the deploy job, not in the job that installs and tests.</text>
</svg>
