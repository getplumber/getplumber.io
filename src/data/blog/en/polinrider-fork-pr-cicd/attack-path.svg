<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="t">
  <title id="t">The PolinRider fork pull request attack path, step by step: how the loader got into open pull requests, then how the project's own CI ran and published it</title>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4E6B6B"/></marker>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0A0F0C"/><stop offset="100%" stop-color="#070A08"/></linearGradient>
  </defs>
  <rect width="1200" height="640" fill="url(#bg)" rx="16"/>
  <text x="64" y="48" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" letter-spacing="1.8" font-weight="700" fill="#F2B544">UPSTREAM · HOW THE LOADER GOT INTO THE PULL REQUESTS (OCTOBER 19, UTC)</text>
  <rect x="64" y="66" width="336" height="150" rx="12" fill="#0E1411" stroke="#192B2B" stroke-width="1.5"/>
  <circle cx="86" cy="90" r="13" fill="#F2B544"/>
  <text x="86" y="95" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="800" fill="#06110F">A</text>
  <text x="108" y="95" font-family="Segoe UI, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#FFFFFF">A trusted-looking contributor</text>
  <text x="80" y="120" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#C5CFCB">Account Eternity0207 opened 217 PRs</text>
  <text x="80" y="139" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#C5CFCB">across open source projects. 145 of</text>
  <text x="80" y="158" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#C5CFCB">them were merged, none with the loader.</text>
  <line x1="404" y1="141.0" x2="442" y2="141.0" stroke="#4E6B6B" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="446" y="66" width="336" height="150" rx="12" fill="#0E1411" stroke="#192B2B" stroke-width="1.5"/>
  <circle cx="468" cy="90" r="13" fill="#F2B544"/>
  <text x="468" y="95" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="800" fill="#06110F">B</text>
  <text x="490" y="95" font-family="Segoe UI, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#FFFFFF">Force-push into open PRs</text>
  <text x="462" y="120" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#C5CFCB">A commit adds a loader and hooks it</text>
  <text x="462" y="139" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#C5CFCB">into the npm scripts:</text>
  <text x="462" y="158" font-family="Consolas, 'Courier New', monospace" font-size="12.5" fill="#9CF3F3">"node api.js &amp;&amp; ..."</text>
  <text x="462" y="177" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#C5CFCB">in package.json.</text>
  <line x1="786" y1="141.0" x2="824" y2="141.0" stroke="#4E6B6B" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="828" y="66" width="336" height="150" rx="12" fill="#0E1411" stroke="#192B2B" stroke-width="1.5"/>
  <circle cx="850" cy="90" r="13" fill="#F2B544"/>
  <text x="850" y="95" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="800" fill="#06110F">C</text>
  <text x="872" y="95" font-family="Segoe UI, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#FFFFFF">Force-push it away</text>
  <text x="844" y="120" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#C5CFCB">30 to 40 minutes later another</text>
  <text x="844" y="139" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#C5CFCB">force-push replaces it. The final</text>
  <text x="844" y="158" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#C5CFCB">diff a reviewer sees is clean. Only</text>
  <text x="844" y="177" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#C5CFCB">the PR timeline keeps a trace.</text>
  <path d="M 614.0 216 L 614.0 246 L 42 246 L 42 410.0 L 59 410.0" fill="none" stroke="#4E6B6B" stroke-width="2" marker-end="url(#arr)"/>
  <text x="76" y="266" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#93A3A3">every push to the PR branch starts the pull_request workflows</text>
  <text x="64" y="304" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" letter-spacing="1.8" font-weight="700" fill="#09C3C3">THE PROJECT'S PIPELINE · HOW IT RAN AND SHIPPED</text>
  <rect x="64" y="322" width="200" height="176" rx="12" fill="#0E1411" stroke="#192B2B" stroke-width="1.5"/>
  <circle cx="86" cy="346" r="13" fill="#09C3C3"/>
  <text x="86" y="351" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="800" fill="#06110F">1</text>
  <text x="108" y="351" font-family="Segoe UI, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#FFFFFF">No approval</text>
  <text x="80" y="376" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#C5CFCB">Fork PR runs start</text>
  <text x="80" y="395" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#C5CFCB">without a maintainer</text>
  <text x="80" y="414" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#C5CFCB">clicking approve.</text>
  <text x="80" y="433" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#C5CFCB">AsyncAPI required it,</text>
  <text x="80" y="452" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#C5CFCB">so nothing ran there.</text>
  <line x1="267" y1="410.0" x2="285" y2="410.0" stroke="#4E6B6B" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="288" y="322" width="200" height="176" rx="12" fill="#0E1411" stroke="#192B2B" stroke-width="1.5"/>
  <circle cx="310" cy="346" r="13" fill="#09C3C3"/>
  <text x="310" y="351" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="800" fill="#06110F">2</text>
  <text x="332" y="351" font-family="Segoe UI, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#FFFFFF">Install and build</text>
  <text x="304" y="376" font-family="Consolas, 'Courier New', monospace" font-size="12.5" fill="#9CF3F3">npm install</text>
  <text x="304" y="395" font-family="Consolas, 'Courier New', monospace" font-size="12.5" fill="#9CF3F3">npm run build</text>
  <text x="304" y="414" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#C5CFCB">run the PR's own</text>
  <text x="304" y="433" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#C5CFCB">package.json scripts,</text>
  <text x="304" y="452" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#C5CFCB">loader included.</text>
  <line x1="491" y1="410.0" x2="509" y2="410.0" stroke="#4E6B6B" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="512" y="322" width="200" height="176" rx="12" fill="#0E1411" stroke="#192B2B" stroke-width="1.5"/>
  <circle cx="534" cy="346" r="13" fill="#09C3C3"/>
  <text x="534" y="351" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="800" fill="#06110F">3</text>
  <text x="556" y="351" font-family="Segoe UI, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#FFFFFF">What was reachable</text>
  <text x="528" y="376" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#C5CFCB">On a fork pull_request:</text>
  <text x="528" y="395" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#C5CFCB">no repository secrets,</text>
  <text x="528" y="414" font-family="Consolas, 'Courier New', monospace" font-size="12.5" fill="#9CF3F3">GITHUB_TOKEN</text>
  <text x="528" y="433" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#C5CFCB">read-only. No stolen</text>
  <text x="528" y="452" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#C5CFCB">secret reported.</text>
  <line x1="715" y1="410.0" x2="733" y2="410.0" stroke="#4E6B6B" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="736" y="322" width="200" height="176" rx="12" fill="#0E1411" stroke="#192B2B" stroke-width="1.5"/>
  <circle cx="758" cy="346" r="13" fill="#09C3C3"/>
  <text x="758" y="351" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="800" fill="#06110F">4</text>
  <text x="780" y="351" font-family="Segoe UI, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#FFFFFF">Release build</text>
  <text x="752" y="376" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#C5CFCB">CircuitVerse's desktop</text>
  <text x="752" y="395" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#C5CFCB">release workflow also</text>
  <text x="752" y="414" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#C5CFCB">runs on pull_request and</text>
  <text x="752" y="433" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#C5CFCB">builds installers from</text>
  <text x="752" y="452" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#C5CFCB">the PR, on 4 runners.</text>
  <line x1="939" y1="410.0" x2="957" y2="410.0" stroke="#4E6B6B" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="960" y="322" width="200" height="176" rx="12" fill="#0E1411" stroke="#192B2B" stroke-width="1.5"/>
  <circle cx="982" cy="346" r="13" fill="#09C3C3"/>
  <text x="982" y="351" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="800" fill="#06110F">5</text>
  <text x="1004" y="351" font-family="Segoe UI, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#FFFFFF">Published</text>
  <text x="976" y="376" font-family="Consolas, 'Courier New', monospace" font-size="12.5" fill="#9CF3F3">upload-artifact</text>
  <text x="976" y="395" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#C5CFCB">puts 40 infected</text>
  <text x="976" y="414" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#C5CFCB">installers on the run</text>
  <text x="976" y="433" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#C5CFCB">pages, under the</text>
  <text x="976" y="452" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#C5CFCB">project's name.</text>
  <rect x="64" y="526" width="1072" height="78" rx="11" fill="#061A1A" stroke="#2AC7C7" stroke-width="1.5"/>
  <text x="84" y="549" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" letter-spacing="1.5" font-weight="700" fill="#2AC7C7">WHERE IT BREAKS</text>
  <text x="84" y="571" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">Step 1 never happens when every outside fork run needs a maintainer's approval, and step 5</text>
  <text x="84" y="592" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">never happens when builds from forks are not uploaded: release installers come only from releases.</text>
</svg>
